<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Punarvasu — Guided Case Wizard</title>
<style>
:root{
  --teal:#1C6B5A;--teal2:#2E7D32;--amber:#C8600A;--amber-bg:#FDF3E8;
  --ink:#1a1a1a;--ink2:#444;--ink3:#888;
  --border:#e0e0e0;--white:#fff;--cream:#f7f5f0;--bg:#f2f0eb;
  --success:#2E7D32;--danger:#c0392b;
  --lang-en:#0D47A1;--lang-hi:#A64B2A;
  --font:'Source Sans 3','Noto Sans Devanagari',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--white);display:flex;flex-direction:column}
.topbar{background:var(--teal);color:white;padding:14px 16px;flex-shrink:0}
.topbar h1{font-size:16px;font-weight:700}
.topbar .sub{font-size:11.5px;opacity:.85;margin-top:2px}
.search-btn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:white;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.search-btn:hover{background:rgba(255,255,255,0.25)}
.search-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tab-btn{background:var(--cream);border:1.5px solid var(--border);border-radius:14px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.tab-btn.active{background:var(--teal);border-color:var(--teal);color:white}
.search-nudge{background:var(--amber-bg);border:1.5px solid var(--amber);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--ink2);margin-bottom:12px}
.breadcrumb{padding:10px 16px 0;font-size:12px;color:var(--ink3);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.breadcrumb .seg{background:var(--cream);border:1px solid var(--border);border-radius:12px;padding:2px 10px}
.body{flex:1;overflow-y:auto;padding:16px}
.lock-icon-wrap{text-align:center;margin:8px 0 20px}
.lock-icon{font-size:44px}
.lock-card{background:var(--cream);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:14px}
.lock-card-title{font-size:15.5px;font-weight:700;color:var(--ink);margin-bottom:10px}
.coupon-row{display:flex;gap:8px}
.coupon-row input{flex:1;border:1px solid var(--border);border-radius:6px;padding:11px 14px;font-family:var(--font);font-size:15px;outline:none;text-transform:uppercase;transition:border-color .15s}
.coupon-row input:focus{border-color:var(--teal)}
.btn-apply{background:var(--teal);color:white;border:none;padding:0 18px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font)}
.btn-apply:disabled{opacity:.6;cursor:default}
.coupon-err{font-size:12.5px;color:var(--danger);margin-top:6px;min-height:16px}
.lock-or{text-align:center;font-size:12.5px;color:var(--ink3);margin:14px 0;position:relative}
.lock-or::before,.lock-or::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--border)}
.lock-or::before{left:0}
.lock-or::after{right:0}
.token-price{font-size:22px;font-weight:700;color:var(--ink);margin-bottom:4px}
.token-note{font-size:12.5px;color:var(--ink3);margin-bottom:14px}
.btn-stub{width:100%;background:var(--white);color:var(--ink3);border:1.5px dashed var(--border);padding:12px;border-radius:6px;font-family:var(--font);font-size:14.5px;cursor:pointer;text-align:center}
.btn-stub:hover{background:var(--cream)}
.back-btn{font-size:13px;font-weight:600;color:var(--teal);background:none;border:none;cursor:pointer;padding:0 0 10px;display:block}
h2.step-title{font-size:17px;font-weight:700;margin-bottom:4px}
p.step-sub{font-size:13px;color:var(--ink3);margin-bottom:14px}
.search-box{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:12px;font-family:var(--font)}
.search-box.no-match{border-color:var(--danger);color:var(--danger)}
.no-match-msg{font-size:12.5px;color:var(--danger);margin:-6px 0 12px;padding:0 2px}
.option-group{margin-bottom:16px}
.option-group-label{font-size:11.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.collapsible-section{margin-bottom:10px;border:1.5px solid var(--border);border-radius:10px;overflow:hidden}
.collapsible-header{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer;background:var(--cream);user-select:none}
.collapsible-header:hover{background:var(--amber-bg)}
.collapsible-arrow{font-size:11px;color:var(--teal);transition:transform .15s;display:inline-block}
.collapsible-arrow.open{transform:rotate(90deg)}
.collapsible-label{font-size:12.5px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.03em;flex:1}
.collapsible-count{font-size:11px;color:var(--ink3)}
.collapsible-body{padding:10px 10px 2px}
.selected-node{margin-bottom:2px}
.selected-node-header{display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer;background:#F0F7F4;border:1.5px solid var(--teal);border-radius:8px}
.selected-node-header:hover{background:#E4F1EC}
.selected-node-text .kent{font-size:13.5px;font-weight:700;color:var(--teal)}
.selected-node-text .en{font-size:12px;color:var(--lang-en);margin-top:1px}
.selected-node-text .hi{font-size:11.5px;color:var(--lang-hi);margin-top:1px}
.opt-card{border:1.5px solid var(--border);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer;background:var(--white);transition:all .12s}
.opt-card:hover{border-color:var(--teal)}
.opt-card .kent{font-size:14px;font-weight:700;color:var(--ink)}
.opt-count{font-size:12px;font-weight:600;color:var(--amber)}
.opt-card .en{font-size:12.5px;color:var(--lang-en);margin-top:2px}
.opt-card .hi{font-size:12px;color:var(--lang-hi);margin-top:1px}
.opt-card .meta{font-size:10.5px;color:var(--ink3);margin-top:3px}
.chapter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ch-card{border:1.5px solid var(--border);border-radius:10px;padding:11px 6px;cursor:pointer;background:var(--white);text-align:center;transition:all .12s}
.ch-card:hover{border-color:var(--amber);background:var(--amber-bg)}
.ch-card .en{font-size:12px;font-weight:600}
.ch-card .hi{font-size:10.5px;color:var(--lang-hi);margin-top:1px}
.general-block{margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid var(--cream);}
.general-block:last-child{border-bottom:none;}
.stop-here-card{border:2.5px solid var(--teal);background:#E8F8F5;border-radius:12px;padding:13px 14px;margin-bottom:16px;cursor:pointer;transition:all .12s;box-shadow:0 2px 10px rgba(28,107,90,.16)}
.stop-here-card:hover{background:#DEF4F0}
.stop-here-card .label{font-size:12.5px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:6px}
.stop-here-card .kent{font-size:14px;font-weight:700;margin-top:3px}
.stop-here-card .en{font-size:12.5px;color:var(--lang-en);margin-top:2px}
.stop-here-card .hi{font-size:12px;color:var(--lang-hi);margin-top:1px}
.footer-bar{position:sticky;bottom:0;background:white;border-top:1px solid var(--border);padding:10px 16px;display:flex;gap:10px;flex-shrink:0}
.btn-primary{background:var(--teal);color:white;border:none;border-radius:8px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;width:100%}
.btn-outline{background:none;border:1.5px solid var(--border);border-radius:8px;padding:10px 16px;font-size:13px;color:var(--ink2);cursor:pointer;width:100%}
.btn-outline.danger{color:var(--danger);border-color:#f2c4bd}
.case-item{border:1.5px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;position:relative;cursor:pointer}
.case-item:hover{border-color:var(--teal);background:var(--cream)}
.case-item-hint{font-size:10.5px;color:var(--ink3);margin-top:6px;font-style:italic}
.editing-banner{background:var(--amber-bg);border:1.5px solid var(--amber);border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--ink2);margin-bottom:12px}
.cancel-edit-link{color:var(--amber);font-weight:700;cursor:pointer;text-decoration:underline}
.case-item .path-en{font-size:13.5px;font-weight:600}
.case-item .path-hi{font-size:12px;color:var(--ink3);margin-top:2px}
.case-item .remedy-count{font-size:10.5px;color:var(--ink3);margin-top:4px}
.case-item .remove-btn{position:absolute;top:10px;right:10px;font-size:11px;color:var(--danger);background:none;border:none;cursor:pointer}
.empty-state{text-align:center;padding:40px 16px;color:var(--ink3)}
.loading{text-align:center;padding:60px 16px}
.load-bar{width:220px;height:4px;background:var(--border);border-radius:2px;margin:16px auto 0;overflow:hidden}
.load-anim{height:100%;background:var(--teal);border-radius:2px;animation:la 2s ease-in-out infinite}
@keyframes la{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
.show-all-link{font-size:12.5px;color:var(--teal);text-align:center;padding:8px;cursor:pointer;font-weight:600}
.connector-box{border:1.5px solid var(--amber);background:var(--amber-bg);border-radius:10px;padding:14px;margin-bottom:14px}
.connector-box .label{font-size:11px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.connector-box p{font-size:13.5px;color:var(--ink2);line-height:1.4}
input[type=text]{font-family:var(--font)}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading">
    <p style="font-size:14px;color:var(--ink3)">Loading repertory data…</p>
    <div class="load-bar"><div class="load-anim"></div></div>
  </div>
</div>

<script src="repertory_data.js"></script>
<script src="repertory_translations_english.js"></script>
<script src="repertory_translations_hindi.js"></script>
<script src="repertory_translations_hindi_romanized.js"></script>

<script>
'use strict';

// =================================================================
// STATE
// =================================================================
const state = {
  screen: 'loading',           // loading | intake | lock | chapters | walk | generalsWalk | connectorPrompt | caseReview | search | submitted
  currentWalk: { pathTokens: [] },
  completeCase: [],            // [{ rubricId, path, remedyCount, source? }] — source:'generals' tags entries added via the generals sequence
  connectorQueue: [],          // pending optional connector suggestions to show
  editingCaseIndex: null,      // index into completeCase currently being re-walked/edited, or null
  returnScreenAfterSearch: 'chapters', // where to go back to if search is cancelled without a pick
  patient: {
    name: '', age: '', sex: '', location: '', reason: ''
  },
  lock: {
    codeInput: '', error: '', isUnlocked: false, accessCodeUsed: '', busy: false
  },
  submit: { busy: false, error: '' },
  // Generals runs as a fixed sequence of topics. Each topic's questions all
  // show together on one screen as a list — tapping a question expands it
  // (collapsing whichever other one was open) to reveal yes/no/not-sure and,
  // if answered "yes" and the real dataset has children for that exact
  // rubric, a follow-up detail section inline (categorized the same way as
  // the complaint tree-walker: small categories as checkboxes, larger ones
  // as type-ahead search + browse). `expandedItem` is which question index
  // is currently open (null = all collapsed); `answers` remembers each
  // question's choice and any follow-up picks, keyed by 'topicIdx-itemIdx'.
  generalsQueue: { active: false, index: -1, order: [], expandedItem: null, detailSearch: {}, answers: {} },
  search: {
    query: '',
    activeTab: 'all',          // all | sensation | timing | modality | laterality | cause | sequence | content
    displayLimit: 30
  },
  data: {
    chaptersBucketed: null,    // { chapterName: [[id,path,remedies], ...] }
    connectorMap: null,        // { rubricId: [{connectedChapter, connectorType}] }
    chapterList: [],
    searchIndex: null
  }
};

// =================================================================
// DATA LOADING & INDEXING
// =================================================================
async function initData() {
  // EMBEDDED_DATA comes from repertory_data.js (script tag, top-level const —
  // accessed here by bare reference since that's visible across classic scripts
  // on the same page regardless of var/let/const, as established earlier)
  const rubrics = EMBEDDED_DATA.rubrics;

  const buckets = {};
  for (const rubric of rubrics) {
    const chapter = rubric[1].split(',')[0].trim();
    if (!buckets[chapter]) buckets[chapter] = [];
    buckets[chapter].push(rubric);
  }
  state.data.chaptersBucketed = buckets;
  state.data.chapterList = Object.keys(buckets).sort();

  // Build the global search index once — combines Kent term + English + Hindi
  // text into one lowercase searchable string per rubric, plus precomputed
  // qualifier tags (reusing the same Sensation/Timing/Modality/Laterality/
  // Cause/Sequence/Content patterns) for the distinguisher-tab filters.
  const enTable = safeGlobalLookup('TRANSLATIONS_ENGLISH') || {};
  const hiTable = safeGlobalLookup('TRANSLATIONS_HINDI') || {};
  const romanTable = safeGlobalLookup('ROMANIZED_HINDI') || {};
  const searchIndex = [];
  for (const [id, path, remedies] of rubrics) {
    const chapter = path.split(',')[0].trim();
    const slug = slugifyChapter(chapter);
    const enEntry = enTable[slug] && enTable[slug][path];
    const hiEntry = hiTable[slug] && hiTable[slug][path];
    const romanEntry = romanTable[slug] && romanTable[slug][path];
    const enText = (enEntry && enEntry.plain) || '';
    const hiText = (hiEntry && hiEntry.plain) || '';
    const romanText = romanEntry || ''; // Romanized Hindi is stored as a direct string, not {plain, category}
    searchIndex.push({
      id, path, chapter, remedyCount: remedies.length,
      searchable: (path + ' ' + enText + ' ' + hiText + ' ' + romanText).toLowerCase(),
      tags: {
        sensation: SENSATION_RE.test(path), timing: TIMING_RE.test(path),
        modality: MODALITY_RE.test(path), laterality: LATERALITY_RE.test(path),
        cause: CAUSE_RE.test(path), sequence: SEQUENCE_RE.test(path), content: CONTENT_RE.test(path)
      }
    });
  }
  state.data.searchIndex = searchIndex;

  try {
    const res = await fetch('connector_map.json');
    state.data.connectorMap = await res.json();
  } catch (e) {
    console.warn('connector_map.json not found — connector suggestions disabled.');
    state.data.connectorMap = {};
  }

  // If a ?code=XXXXXXXX parameter is present in the URL (sent via the
  // WhatsApp welcome message), pre-fill the lock screen code field and show
  // the lock screen FIRST — the patient sees their code pre-filled, taps
  // Unlock, then fills their basic details. Without a URL code, the normal
  // flow applies: intake details first, then the lock screen.
  // If a ?code=XXXXXXXX parameter is in the URL, pre-fill it in the lock
  // screen field so the patient just taps Unlock — no typing needed.
  // The flow stays: basic details first, then lock screen (pre-filled), then tree-walker.
  const urlCode = new URLSearchParams(window.location.search).get('code');
  if (urlCode) {
    state.lock.codeInput = urlCode.trim().toUpperCase();
  }
  state.screen = 'intake';
  render();
}

// =================================================================
// CORE ENGINE
// =================================================================
function slugifyChapter(chapter) {
  if (chapter === 'Heart & Circulation') return 'heart-and-circulation';
  return chapter.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

function lookupTranslation(chapter, path, table) {
  if (!table) return null;
  const bucket = table[slugifyChapter(chapter)];
  if (!bucket) return null;
  return bucket[path] || null;
}

function safeGlobalLookup(varName) {
  // Same defensive pattern as the earlier EMBEDDED_DATA scoping fix: a bare
  // reference works for let/const globals declared in another <script> tag,
  // but NOT via window[name] — so try bare reference first (per known name),
  // then fall back to window[] for var-style globals.
  try {
    if (varName === 'TRANSLATIONS_ENGLISH' && typeof TRANSLATIONS_ENGLISH !== 'undefined') return TRANSLATIONS_ENGLISH;
    if (varName === 'TRANSLATIONS_HINDI' && typeof TRANSLATIONS_HINDI !== 'undefined') return TRANSLATIONS_HINDI;
    if (varName === 'ROMANIZED_HINDI' && typeof ROMANIZED_HINDI !== 'undefined') return ROMANIZED_HINDI;
  } catch (e) { /* not defined via bare reference in this scope */ }
  return window[varName]; // fallback for var-style globals
}

function renderTrilingualBlock(disp, count) {
  const countSuffix = (typeof count === 'number') ? ` <span class="opt-count">(${count})</span>` : '';
  return `
    <div class="kent">${esc(disp.kent)}${countSuffix}</div>
    ${disp.en ? `<div class="en">${esc(disp.en)}</div>` : ''}
    ${disp.hi ? `<div class="hi">${esc(disp.hi)}</div>` : ''}
  `;
}

function getDisplayText(chapter, path, kentToken) {
  const enTable = safeGlobalLookup('TRANSLATIONS_ENGLISH');
  const hiTable = safeGlobalLookup('TRANSLATIONS_HINDI');
  const romanTable = safeGlobalLookup('ROMANIZED_HINDI');
  if (!enTable) console.error('[wizard] TRANSLATIONS_ENGLISH is not accessible — check that repertory_translations_english.js loaded without error (Network tab / Console for a script error).');
  if (!hiTable) console.error('[wizard] TRANSLATIONS_HINDI is not accessible — check that repertory_translations_hindi.js loaded without error.');

  const en = lookupTranslation(chapter, path, enTable);
  const hi = lookupTranslation(chapter, path, hiTable);
  const roman = lookupTranslation(chapter, path, romanTable);
  if (enTable && !en) console.warn('[wizard] No English translation on file for path:', path);
  if (hiTable && !hi) console.warn('[wizard] No Hindi translation on file for path:', path);
  return {
    kent: kentToken,               // Kent's original term — always shown, never replaced
    en: (en && en.plain) || '',    // plain English — blank only if genuinely no translation exists
    hi: (hi && hi.plain) || '',    // Hindi (Devanagari) — blank only if genuinely no translation exists
    roman: roman || '' // Romanized Hindi — file stores this as a direct string, not {plain, category}
  };
}

// Core primitive — validated against live data before this build began.
// Given a partial path (array of tokens starting with the chapter), returns:
//   exactMatchRubric — the rubric AT exactly this path, if one exists
//   nextOptions      — { token: { rubricCount, totalRemedies, sampleId, samplePath } }
function getNextOptions(pathTokens) {
  const chapter = pathTokens[0];
  const bucket = state.data.chaptersBucketed[chapter] || [];
  const prefixLower = pathTokens.map(t => t.toLowerCase());

  let exactMatchRubric = null;
  const nextOptions = {};

  for (const [id, path, remedies] of bucket) {
    const rParts = path.split(',').map(s => s.trim());
    if (rParts.length < prefixLower.length) continue;
    let isPrefix = true;
    for (let i = 0; i < prefixLower.length; i++) {
      if (rParts[i].toLowerCase() !== prefixLower[i]) { isPrefix = false; break; }
    }
    if (!isPrefix) continue;

    if (rParts.length === prefixLower.length) {
      exactMatchRubric = { id, path, remedyCount: remedies.length };
      continue;
    }
    const nextToken = rParts[pathTokens.length];
    if (!nextOptions[nextToken]) {
      nextOptions[nextToken] = { rubricCount: 0, totalRemedies: 0, sampleId: id, samplePath: path };
    }
    nextOptions[nextToken].rubricCount++;
    nextOptions[nextToken].totalRemedies += remedies.length;
  }

  return { exactMatchRubric, nextOptions };
}

// Soft, cosmetic-only classification of an option token, purely to group same-kind
// options under a heading. Never used to hide or filter — every option from
// getNextOptions is always shown somewhere.
// Hindi pairing for the 5 distinguisher categories above — shown alongside
// the English wherever a category label appears, same trilingual convention
// as everything else patient-facing.
const KIND_HINDI = {
  'What it feels like': 'कैसा महसूस होता है',
  'When it happens': 'कब होता है',
  'What affects it': 'इससे क्या असर पड़ता है',
  'Which side': 'कौन-सी तरफ',
  'Other details': 'अन्य जानकारी',
};

const SENSATION_RE = /\b(pain|ache|burning|stitching|cutting|tearing|throbbing|pressing|drawing|numbness|itching|heaviness|constriction|tension)\b/i;
const TIMING_RE = /\b(morning|forenoon|noon|afternoon|evening|night|midnight|before|after|during|periodic|every|annually|monthly|daily|hourly)\b/i;
const MODALITY_RE = /\b(agg|amel|better|worse|from|during|while|motion|rest|touch|pressure|warm|cold|damp|eating|lying|standing|sitting)\b/i;
const LATERALITY_RE = /\b(right|left|one side|alternating sides|side to side)\b/i;
const CAUSE_RE = /\b(from|after|ailments from|due to|following|induced by)\b/i;
const SEQUENCE_RE = /alternating with|followed by|preceded by|extending to|extends to|spreading to/i;
const CONTENT_RE = /as if|as from|sensation of|like|as though/i;

function classifyOptionKind(token) {
  if (SENSATION_RE.test(token)) return 'What it feels like';
  if (TIMING_RE.test(token)) return 'When it happens';
  if (MODALITY_RE.test(token)) return 'What affects it';
  if (LATERALITY_RE.test(token)) return 'Which side';
  return 'Other details';
}

// =================================================================
// RENDER
// =================================================================
function render() {
  const app = document.getElementById('app');
  if (state.screen === 'loading') app.innerHTML = renderLoading();
  else if (state.screen === 'intake') app.innerHTML = renderIntakeScreen();
  else if (state.screen === 'lock') app.innerHTML = renderLockScreen();
  else if (state.screen === 'chapters') app.innerHTML = renderChapterSelect();
  else if (state.screen === 'walk') app.innerHTML = renderWalkStep();
  else if (state.screen === 'generalsWalk') app.innerHTML = renderGeneralsQuestionStep();
  else if (state.screen === 'connectorPrompt') app.innerHTML = renderConnectorPrompt();
  else if (state.screen === 'caseReview') app.innerHTML = renderCaseReview();
  else if (state.screen === 'search') app.innerHTML = renderSearchScreen();
  else if (state.screen === 'submitted') app.innerHTML = renderSubmittedScreen();

  if (state.screen === 'intake') wireIntakeScreen();
  if (state.screen === 'lock') wireLockScreen();
}

function renderLoading() {
  return `<div class="loading"><p style="font-size:14px;color:var(--ink3)">Loading repertory data…</p>
    <div class="load-bar"><div class="load-anim"></div></div></div>`;
}

function renderIntakeScreen() {
  const p = state.patient;
  return `
    ${renderTopbar('Punarvasu Clinic', 'A few details before we begin')}
    <div class="body">
      <h2 class="step-title">Tell us about yourself</h2>

function wireIntakeScreen() {
  const nameF = document.getElementById('intakeNameField');
  const ageF = document.getElementById('intakeAgeField');
  const locF = document.getElementById('intakeLocationField');
  const reasonF = document.getElementById('intakeReasonField');
  if (nameF) nameF.addEventListener('input', () => { state.patient.name = nameF.value; });
  if (ageF) ageF.addEventListener('input', () => { state.patient.age = ageF.value; });
  if (locF) locF.addEventListener('input', () => { state.patient.location = locF.value; });
  if (reasonF) reasonF.addEventListener('input', () => { state.patient.reason = reasonF.value; });
}

function onIntakeSexPick(sex) {
  state.patient.sex = sex;
  render();
}

function onIntakeContinue() {
  const p = state.patient;
  if (!p.name.trim() || !p.age || !p.sex) {
    state.lock.error = 'Please fill in name, age, and sex before continuing.';
    render();
    return;
  }
  state.lock.error = '';
  // If already unlocked via URL code, skip lock screen and go straight to chapters
  state.screen = 'lock';
  render();
}

function renderLockScreen() {
  return `
    ${renderTopbar('Punarvasu Clinic', 'Unlock your symptom intake')}
    <div class="body">
      <button class="back-btn" onclick="state.screen='intake'; render();">&larr; Back</button>
      <div class="lock-icon-wrap"><div class="lock-icon">🔒</div></div>
      <h2 class="step-title" style="text-align:center">Unlock your symptom intake</h2>
      <p class="step-sub" style="text-align:center">This session requires a coupon code or a one-time token.</p>

      <div class="lock-card">
        <div class="lock-card-title">Have a coupon code?</div>
        <div class="coupon-row">
          <input id="lockCodeField" type="text" placeholder="Enter coupon code" value="${escAttr(state.lock.codeInput)}" maxlength="20">
          <button class="btn-apply" id="lockSubmitBtn" ${state.lock.busy ? 'disabled' : ''}>${state.lock.busy ? 'Checking…' : 'Apply'}</button>
        </div>
        <div class="coupon-err">${esc(state.lock.error)}</div>
      </div>

      <div class="lock-or">OR</div>

      <div class="lock-card" style="text-align:center">
        <div class="lock-card-title">Buy a one-time token</div>
        <div class="token-price">₹—</div>
        <div class="token-note">Online payment is coming soon.</div>
        <button class="btn-stub" id="buyTokenBtn">Please contact the clinic for a code</button>
      </div>
    </div>
  `;
}

function wireLockScreen() {
  const codeF = document.getElementById('lockCodeField');
  const btn = document.getElementById('lockSubmitBtn');
  if (codeF) {
    codeF.addEventListener('input', () => { state.lock.codeInput = codeF.value; });
    codeF.addEventListener('keydown', (e) => { if (e.key === 'Enter') onLockSubmit(); });
  }
  if (btn) btn.addEventListener('click', onLockSubmit);
  const tokenBtn = document.getElementById('buyTokenBtn');
  if (tokenBtn) {
    tokenBtn.addEventListener('click', () => {
      alert('Online payment is not yet available. Please contact the clinic directly for a coupon code.');
    });
  }
}

async function onLockSubmit() {
  const code = (state.lock.codeInput || '').trim().toUpperCase();
  if (!code) {
    state.lock.error = 'Please enter a code.';
    render();
    return;
  }
  state.lock.busy = true;
  state.lock.error = '';
  render();

  const result = await window.checkAndUseAccessCode(code);
  state.lock.busy = false;

  if (result.ok) {
    state.lock.isUnlocked = true;
    state.lock.accessCodeUsed = code;
    // If patient came via URL code, they haven't filled intake details yet
    // (name will be empty). Send them to intake first, then chapters.
    state.screen = 'chapters';
    render();
  } else if (result.reason === 'used') {
    state.lock.error = 'This code has already been used. Please contact the clinic for a new one.';
    render();
  } else {
    state.lock.error = 'That code was not recognized. Please check and try again.';
    render();
  }
}

      { path: 'Generalities, food', en: 'Is there any food that makes you feel worse?', hi: 'क्या कोई ऐसा खाना है जिससे आपकी तबीयत ज़्यादा खराब हो जाती है?', roman: 'Kya koi aisa khaana hai jisse aapki tabiyat zyaada kharaab ho jaati hai?',
        // Kent's "Generalities, food" has ~70 children, but only about half are
        // specific FOOD ITEMS marked "agg." (aggravates) — the rest are neutral
        // "connected to X" entries or the one "amel." (warm drinks) outlier,
        // which don't belong under a "makes you worse" question. Filtered to
        // just the named foods that aggravate, per your request.
        childFilter: (token) => /agg\.$/.test(token.trim()) && token.trim() !== 'agg.' },
    ] },
  { label: 'Mental Generals', pathTokens: ['Mind'],
    items: [
      { path: 'Mind, irritability', en: 'Are you irritable?', hi: 'क्या आपको चिड़चिड़ापन रहता है?', roman: 'Kya aapko chidchidaapan rehta hai?' },
      { path: 'Mind, anger', en: 'Do you get angry easily?', hi: 'क्या आपको आसानी से गुस्सा आ जाता है?', roman: 'Kya aapko aasaani se gussa aa jaata hai?' },
      { path: 'Mind, weeping', en: 'Do you weep or cry easily?', hi: 'क्या आप आसानी से रो पड़ते हैं?', roman: 'Kya aap aasaani se ro padte hain?' },
      { kind: 'select',
        en: 'What are your hobbies?', hi: 'आपके शौक क्या हैं?', roman: 'Aapke shauk kya hain?',
        // Kent's Mind chapter does have rubrics for these — not as "hobbies"
        // but as psychological relationships to the activity. Each option is
        // filtered down to just the specific modifiers you asked to keep.
        options: [
          { path: 'Mind, reading', en: 'Reading', hi: 'पढ़ना', roman: 'Padhna',
            childFilter: (token) => ['desires', 'desires to be read to'].includes(token.trim()) },
          { path: 'Mind, writing', en: 'Writing', hi: 'लिखना', roman: 'Likhna',
            childFilter: (token) => token.trim() === 'desire for' },
          { path: 'Mind, music', en: 'Music', hi: 'संगीत', roman: 'Sangeet',
            childFilter: (token) => token.trim() === 'amel.' },
          { path: 'Mind, singing', en: 'Singing', hi: 'गाना', roman: 'Gaana',
            childFilter: (token) => ['amel. complaints', 'alternating with anger', 'alternating with hatred of work', 'hilarious'].includes(token.trim()) },
        ] },
    ] },
];

function findRubricByExactPath(chapter, fullPath) {
  const bucket = state.data.chaptersBucketed[chapter] || [];
  for (const [id, path, remedies] of bucket) {
    if (path.trim() === fullPath.trim()) return { id, path, remedyCount: remedies.length };
  }
  return null; // shouldn't happen — every top-level path was checked against the live dataset before inclusion
}

function itemPathTokens(item) {
  return item.path.split(',').map(s => s.trim());
}

// getNextOptions reports every next-level TOKEN under a path, but some of
// those tokens are only intermediate branch points (further sub-rubrics
// exist beneath them) with no rubric of their own at exactly that path — so
// they can't be added directly. This filters down to only the ones that
// really do resolve to a complete, addable rubric, which is what this
// one-level-deep follow-up screen needs. An optional filterFn narrows the
// result further (e.g. only "agg." foods, or only specific named modifiers)
// for questions that shouldn't offer every real child.
function getRealDetailChildren(chapter, itemPath, filterFn) {
  const { nextOptions } = getNextOptions(itemPath.split(',').map(s => s.trim()));
  const result = [];
  for (const [token, info] of Object.entries(nextOptions)) {
    if (filterFn && !filterFn(token)) continue;
    if (findRubricByExactPath(chapter, itemPath + ', ' + token)) result.push([token, info]);
  }
  return result;
}

function generalsAnswerKey(topicIdx, itemIdx) {
  return topicIdx + '-' + itemIdx;
}

function expandedGeneralsItem() {
  const gq = state.generalsQueue;
  if (gq.expandedItem === null) return null;
  return gq.order[gq.index].items[gq.expandedItem];
}

function startGeneralsSequence() {
  const isFemale = (state.patient.sex || '').toLowerCase() === 'female';
  const order = GENERALS_WALKS.filter(w => !w.femaleOnly || isFemale);
  state.generalsQueue = { active: true, index: 0, order, expandedItem: null, detailSearch: {}, answers: {} };
  state.screen = 'generalsWalk';
  render();
}

// Whatever's checked in the currently-expanded question's follow-up detail
// gets synced into completeCase here — called whenever that question is
// about to stop being the one on screen (collapsed, switched away from, or
// navigating off the topic entirely), so nothing typed/checked is lost even
// if the patient never explicitly taps "Done".
function finalizeGeneralsItemDetail() {
  const gq = state.generalsQueue;
  if (gq.expandedItem === null) return;
  const topic = gq.order[gq.index];
  const item = topic.items[gq.expandedItem];
  const key = generalsAnswerKey(gq.index, gq.expandedItem);
  const answer = gq.answers[key];
  if (!answer || answer.choice !== 'yes') return;

  const realChildren = getRealDetailChildren(topic.pathTokens[0], item.path, item.childFilter);
  if (realChildren.length === 0) return;

  const selected = answer.detailPaths || [];
  const allChildPaths = realChildren.map(([tok]) => item.path + ', ' + tok);
  state.completeCase = state.completeCase.filter(e =>
    !(e.source === 'generals' && allChildPaths.includes(e.path) && !selected.includes(e.path)));
  for (const p of selected) {
    const already = state.completeCase.some(e => e.source === 'generals' && e.path === p);
    if (!already) {
      const rubric = findRubricByExactPath(topic.pathTokens[0], p);
      if (rubric) state.completeCase.push({ rubricId: rubric.id, path: rubric.path, remedyCount: rubric.remedyCount, source: 'generals' });
    }
  }
}

// Tapping a question's header: expanding a different one finalizes+collapses
// whatever was open first (accordion — only one open at a time); tapping the
// already-open one closes it.
function onGeneralsItemExpand(idx) {
  const gq = state.generalsQueue;
  if (gq.expandedItem === idx) {
    finalizeGeneralsItemDetail();
    gq.expandedItem = null;
  } else {
    finalizeGeneralsItemDetail();
    gq.expandedItem = idx;
  }
  gq.detailSearch = {};
  render();
}

function onGeneralsAnswer(choice) {
  const gq = state.generalsQueue;
  const topic = gq.order[gq.index];
  const idx = gq.expandedItem;
  const item = topic.items[idx];
  const key = generalsAnswerKey(gq.index, idx);
  const prior = gq.answers[key];

  state.completeCase = state.completeCase.filter(e => !(e.source === 'generals' && e.path === item.path));
  if (prior && prior.detailPaths && prior.detailPaths.length) {
    state.completeCase = state.completeCase.filter(e => !(e.source === 'generals' && prior.detailPaths.includes(e.path)));
  }

  let hasDetail = false;
  if (choice === 'yes') {
    const rubric = findRubricByExactPath(topic.pathTokens[0], item.path);
    if (rubric) {
      state.completeCase.push({ rubricId: rubric.id, path: rubric.path, remedyCount: rubric.remedyCount, source: 'generals' });
    }
    hasDetail = getRealDetailChildren(topic.pathTokens[0], item.path, item.childFilter).length > 0;
  }
  gq.answers[key] = { choice, detailPaths: [] };

  if (!hasDetail) {
    // Nothing further to fill in for this one — collapse straight back to
    // the list so the next question is easy to get to.
    gq.expandedItem = null;
    gq.detailSearch = {};
  }
  render();
}

// select-kind questions (weather, hobbies) let the patient tap several named
// options rather than answer yes/no. Each toggle commits immediately — no
// separate follow-up/Done step, since these options don't drill any deeper.
// Options without a `path` (e.g. hobbies) are recorded as picked but add
// nothing to completeCase, since they aren't Kent rubrics.
function onGeneralsSelectToggle(optionIndex) {
  const gq = state.generalsQueue;
  const topic = gq.order[gq.index];
  const item = topic.items[gq.expandedItem];
  const key = generalsAnswerKey(gq.index, gq.expandedItem);
  const option = item.options[optionIndex];

  if (!gq.answers[key]) gq.answers[key] = { choice: 'select', selected: [] };
  const selected = gq.answers[key].selected;
  const idx = selected.indexOf(optionIndex);

  if (idx === -1) {
    selected.push(optionIndex);
    if (option.path) {
      const rubric = findRubricByExactPath(topic.pathTokens[0], option.path);
      if (rubric) state.completeCase.push({ rubricId: rubric.id, path: rubric.path, remedyCount: rubric.remedyCount, source: 'generals' });
    }
  } else {
    selected.splice(idx, 1);
    if (option.path) {
      state.completeCase = state.completeCase.filter(e => !(e.source === 'generals' && e.path === option.path));
    }
    // Unchecking the option means whatever further detail was picked under
    // it no longer applies either — clear that option's own rubrics and its
    // recorded state so nothing orphaned is left behind.
    const optKey = key + '-opt' + optionIndex;
    const optAnswer = gq.answers[optKey];
    if (optAnswer && optAnswer.detailPaths && optAnswer.detailPaths.length) {
      const paths = optAnswer.detailPaths;
      state.completeCase = state.completeCase.filter(e => !(e.source === 'generals' && paths.includes(e.path)));
    }
    delete gq.answers[optKey];
  }
  render();
}

function onGeneralsDetailToggle(path, keyOverride) {
  const gq = state.generalsQueue;
  const key = keyOverride || generalsAnswerKey(gq.index, gq.expandedItem);
  if (!gq.answers[key]) gq.answers[key] = { choice: 'yes', detailPaths: [] };
  const list = gq.answers[key].detailPaths;
  const idx = list.indexOf(path);
  const nowSelected = idx === -1;
  if (nowSelected) list.push(path); else list.splice(idx, 1);

  if (keyOverride) {
    // Option-level detail (nested inside a select-kind question, e.g. a
    // hobby's modifiers) has no separate "Done"/finalize step of its own, so
    // sync straight to completeCase here instead of waiting for a call that
    // will never come. Top-level item detail (no override) keeps the
    // existing deferred behavior, finalized on collapse/switch/continue.
    if (nowSelected) {
      const already = state.completeCase.some(e => e.source === 'generals' && e.path === path);
      if (!already) {
        const chapter = path.split(',')[0].trim();
        const rubric = findRubricByExactPath(chapter, path);
        if (rubric) state.completeCase.push({ rubricId: rubric.id, path: rubric.path, remedyCount: rubric.remedyCount, source: 'generals' });
      }
    } else {
      state.completeCase = state.completeCase.filter(e => !(e.source === 'generals' && e.path === path));
    }
  }
  render();
}

// Same focus/cursor preservation trick as the tree-walker's own search box
// (onSearchFilterChange) — a full re-render would otherwise steal focus out
// of the field on every keystroke.
function onGeneralsDetailSearch(categoryKind, text) {
  const inputId = 'genSearch_' + categoryKind.replace(/[^a-zA-Z0-9]/g, '');
  const inputEl = document.getElementById(inputId);
  const cursorPos = inputEl ? inputEl.selectionStart : text.length;

  state.generalsQueue.detailSearch[categoryKind] = text;
  render();

  const newInputEl = document.getElementById(inputId);
  if (newInputEl) {
    newInputEl.focus();
    newInputEl.setSelectionRange(cursorPos, cursorPos);
  }
}

// The explicit "Done" link inside an expanded question's follow-up detail —
// functionally identical to tapping the header again, just closer at hand
// when the detail section has pushed the header out of view.
function onGeneralsDetailDone() {
  onGeneralsItemExpand(state.generalsQueue.expandedItem);
}

function onGeneralsTopicContinue() {
  finalizeGeneralsItemDetail();
  const gq = state.generalsQueue;
  gq.expandedItem = null;
  gq.detailSearch = {};
  const nextTopic = gq.index + 1;
  if (nextTopic >= gq.order.length) {
    gq.active = false;
    onSubmitCase();
  } else {
    gq.index = nextTopic;
    render();
  }
}

function onGeneralsItemBack() {
  finalizeGeneralsItemDetail();
  const gq = state.generalsQueue;
  gq.expandedItem = null;
  gq.detailSearch = {};
  if (gq.index > 0) {
    gq.index--;
    render();
  } else {
    gq.active = false;
    state.screen = 'caseReview';
    render();
  }
}

function renderGeneralsAnswerBadge(answer) {
  if (!answer) return '';
  if (answer.choice === 'select') {
    const n = (answer.selected || []).length;
    if (!n) return '';
    return `<span style="font-size:12px;font-weight:600;color:var(--teal);white-space:nowrap;">&#10003; ${n} chosen</span>`;
  }
  if (answer.choice === 'yes') {
    const n = (answer.detailPaths || []).length;
    return `<span style="font-size:12px;font-weight:600;color:var(--teal);white-space:nowrap;">&#10003; Yes${n ? ' (' + n + ')' : ''}</span>`;
  }
  if (answer.choice === 'no') return `<span style="font-size:12px;color:var(--ink3);white-space:nowrap;">No</span>`;
  return `<span style="font-size:12px;color:var(--ink3);white-space:nowrap;">Not sure</span>`;
}

// Renders the categorized follow-up detail for one question — identical
// small-category/large-category (search + browse-all) logic as before, just
// placed inline under the question instead of on its own screen.
function renderGeneralsDetailInline(topic, itemPath, key, hideDoneLink, filterFn) {
  const chapter = topic.pathTokens[0];
  let entries = getRealDetailChildren(chapter, itemPath, filterFn);
  entries.sort((a, b) => b[1].rubricCount - a[1].rubricCount);

  const grouped = {};
  for (const [token, info] of entries) {
    const kind = classifyOptionKind(token);
    if (!grouped[kind]) grouped[kind] = [];
    grouped[kind].push([token, info]);
  }

  const gq = state.generalsQueue;
  const selected = (gq.answers[key] && gq.answers[key].detailPaths) || [];

  const renderOptCard = (token) => {
    const childPath = itemPath + ', ' + token;
    const disp = getDisplayText(chapter, childPath, token);
    const checked = selected.includes(childPath);
    const border = checked ? 'border:1.5px solid var(--teal);background:#F0F7F4;' : '';
    return `<div class="opt-card" style="cursor:pointer;${border}" onclick="onGeneralsDetailToggle('${escAttr(childPath)}', '${escAttr(key)}')">
      <div class="kent">${checked ? '&#10003; ' : ''}${esc(disp.kent)}</div>
      ${disp.en ? `<div class="en">${esc(disp.en)}</div>` : ''}
      ${disp.hi ? `<div class="hi">${esc(disp.hi)}</div>` : ''}
    </div>`;
  };

  const categoriesHtml = Object.entries(grouped).map(([kind, opts]) => {
    if (opts.length <= 4) {
      const optsHtml = opts.map(([token]) => renderOptCard(token)).join('');
      return `<div class="option-group"><div class="option-group-label">${esc(kind)}</div>${optsHtml}</div>`;
    }

    const searchKey = key + '::' + kind;
    const inputId = 'genSearch_' + searchKey.replace(/[^a-zA-Z0-9]/g, '');
    const searchText = gq.detailSearch[searchKey] || '';
    const searchLower = searchText.toLowerCase();
    const chosen = opts.filter(([token]) => selected.includes(itemPath + ', ' + token));
    const unchosen = opts.filter(([token]) => !selected.includes(itemPath + ', ' + token));
    const matches = searchLower
      ? unchosen.filter(([token]) => {
          const disp = getDisplayText(chapter, itemPath + ', ' + token, token);
          return (disp.en + ' ' + disp.hi + ' ' + disp.kent + ' ' + disp.roman).toLowerCase().includes(searchLower);
        }).slice(0, 8)
      : [];

    const chosenHtml = chosen.map(([token]) => renderOptCard(token)).join('');
    const matchesHtml = matches.map(([token]) => renderOptCard(token)).join('');

    const browseCap = 20;
    const browseList = unchosen.slice(0, browseCap);
    const browseMoreCount = unchosen.length - browseList.length;
    const browseHtml = browseList.map(([token]) => renderOptCard(token)).join('')
      + (browseMoreCount > 0 ? `<div style="font-size:12px;color:var(--ink3);padding:6px 2px;">+${browseMoreCount} more — use search above to find them</div>` : '');
    const groupKey = 'genDetail::' + searchKey;

    return `<div class="option-group">
      <div class="option-group-label">${esc(kind)} <span style="font-weight:400;color:var(--ink3)">(${opts.length})</span></div>
      ${chosenHtml}
      <input id="${inputId}" class="search-box" type="text" placeholder="Type to search…" value="${escAttr(searchText)}"
        oninput="onGeneralsDetailSearch('${escAttr(searchKey)}', this.value)">
      ${matchesHtml}
      ${renderCollapsibleSection(groupKey, 'Browse all', opts.length + ' option(s)', browseHtml)}
    </div>`;
  }).join('');

  const doneHtml = hideDoneLink ? '' : `
      <div style="text-align:center;margin-top:4px;">
        <span style="color:var(--teal);text-decoration:underline;cursor:pointer;font-size:13px;font-weight:600;" onclick="onGeneralsDetailDone()">Done with this one</span>
      </div>`;

  return `
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);">
      <div style="font-size:12px;color:var(--ink3);margin-bottom:8px;">A bit more detail on that —</div>
      ${categoriesHtml}
      ${doneHtml}
    </div>
  `;
}

function renderGeneralsQuestionStep() {
  const gq = state.generalsQueue;
  const topic = gq.order[gq.index];
  const topicTotal = gq.order.length;

  const progressHtml = `<div style="display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--cream);border-bottom:1px solid var(--border);">
    <div style="flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;">
      <div style="height:100%;width:${Math.round((gq.index / topicTotal) * 100)}%;background:var(--teal);border-radius:2px;transition:width .3s;"></div>
    </div>
    <div style="font-size:12px;color:var(--ink3);white-space:nowrap;">${gq.index + 1} of ${topicTotal}</div>
  </div>`;

  const itemsHtml = topic.items.map((item, idx) => {
    const key = generalsAnswerKey(gq.index, idx);
    const answer = gq.answers[key];
    const isExpanded = gq.expandedItem === idx;

    if (!isExpanded) {
      return `<div style="border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;" onclick="onGeneralsItemExpand(${idx})">
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:600;color:var(--ink);">${esc(item.en)}</div>
          ${!answer ? `<div style="font-size:12px;color:var(--ink3);margin-top:2px;">${esc(item.hi)}</div>` : ''}
        </div>
        ${renderGeneralsAnswerBadge(answer)}
        <span style="color:var(--ink3);font-size:11px;">&#9656;</span>
      </div>`;
    }

    if (item.kind === 'select') {
      const selected = (answer && answer.selected) || [];
      const optsHtml = item.options.map((opt, optIdx) => {
        const checked = selected.includes(optIdx);
        const border = checked ? 'border:1.5px solid var(--teal);background:#F0F7F4;' : '';
        const card = `<div class="opt-card" style="cursor:pointer;${border}" onclick="onGeneralsSelectToggle(${optIdx})">
          <div class="kent">${checked ? '&#10003; ' : ''}${esc(opt.en)}</div>
          <div class="hi">${esc(opt.hi)}</div>
        </div>`;
        // If this option maps to a real rubric that itself has further real
        // children (e.g. "Mind, reading" -> averse to / desires / agg.),
        // show that detail right under it once it's checked.
        let optDetail = '';
        if (checked && opt.path && getRealDetailChildren(topic.pathTokens[0], opt.path, opt.childFilter).length > 0) {
          optDetail = renderGeneralsDetailInline(topic, opt.path, key + '-opt' + optIdx, true, opt.childFilter);
        }
        return card + optDetail;
      }).join('');
      return `<div style="border:1.5px solid var(--teal);border-radius:8px;padding:14px;margin-bottom:8px;">
        <div style="font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;" onclick="onGeneralsItemExpand(${idx})">${esc(item.en)}</div>
        <div class="hi" style="margin-bottom:14px;">${esc(item.hi)}</div>
        ${optsHtml}
      </div>`;
    }

    const yesStyle = answer && answer.choice === 'yes' ? 'outline:2px solid var(--teal);outline-offset:-2px;' : '';
    const noStyle = answer && answer.choice === 'no' ? 'outline:2px solid var(--ink3);outline-offset:-2px;' : '';
    const skipStyle = answer && answer.choice === 'skip' ? 'outline:2px solid var(--ink3);outline-offset:-2px;' : '';
    const hasDetail = getRealDetailChildren(topic.pathTokens[0], item.path, item.childFilter).length > 0;
    const showDetail = answer && answer.choice === 'yes' && hasDetail;

    return `<div style="border:1.5px solid var(--teal);border-radius:8px;padding:14px;margin-bottom:8px;">
      <div style="font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;" onclick="onGeneralsItemExpand(${idx})">${esc(item.en)}</div>
      <div class="hi" style="margin-bottom:14px;">${esc(item.hi)}</div>
      <div style="display:flex;gap:8px;">
        <button class="btn-primary" style="flex:1;${yesStyle}" onclick="onGeneralsAnswer('yes')">Yes</button>
        <button class="btn-outline" style="flex:1;${noStyle}" onclick="onGeneralsAnswer('no')">No</button>
        <button class="btn-outline" style="flex:1;${skipStyle}" onclick="onGeneralsAnswer('skip')">Not sure</button>
      </div>
      ${showDetail ? renderGeneralsDetailInline(topic, item.path, key, false, item.childFilter) : ''}
    </div>`;
  }).join('');

  return `
    ${renderTopbar('General Health', topic.label + ' — ' + (gq.index + 1) + ' of ' + topicTotal)}
    ${progressHtml}
    <div class="body">
      <button class="back-btn" onclick="onGeneralsItemBack()">&larr; Back</button>
      <h2 class="step-title" style="margin-bottom:14px;">${esc(topic.label)}</h2>
      ${itemsHtml}
    </div>
    <div class="footer-bar">
      <button class="btn-primary" onclick="onGeneralsTopicContinue()">Continue →</button>
    </div>
  `;
}

// findChapterKey kept for safety (unused now)

  const keys = Object.keys(state.data.chaptersBucketed || {});
  return keys.find(k => k.toLowerCase() === name.toLowerCase()) || name;

function renderBreadcrumb() {
  if (!state.currentWalk.pathTokens.length) return '';
  const segs = state.currentWalk.pathTokens.map(t => `<span class="seg">${esc(t)}</span>`).join('');
  return `<div class="breadcrumb">${segs}</div>`;
}

// A block's icon can be one key (single SVG) or an array of keys (a few
// small ones shown side by side) for groups that cover several distinct
// body parts at once, e.g. Face + Mouth + Teeth.
function renderIcon(keyOrKeys) {
  if (!keyOrKeys) return '';
  const keys = Array.isArray(keyOrKeys) ? keyOrKeys : [keyOrKeys];
  const size = keys.length > 1 ? 20 : 26;
  const svgs = keys.filter(k => ICON_PATHS[k]).map(k =>
    `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="var(--teal)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[k]}</svg>`
  );
  if (!svgs.length) return '';
  if (svgs.length === 1) return `<div style="margin-bottom:4px;">${svgs[0]}</div>`;
  return `<div style="display:flex;justify-content:center;gap:4px;margin-bottom:4px;">${svgs.join('')}</div>`;
}

function renderChapterCard(ch, iconOverride) {
  const disp = getDisplayText(ch, ch, ch);
  const iconKey = iconOverride || STANDALONE_CHAPTER_ICONS[ch];
  return `<div class="ch-card" onclick="onChapterPick('${escAttr(ch)}')">
    ${renderIcon(iconKey)}
    <div class="en">${esc(ch)}</div>
    ${disp.hi ? `<div class="hi">${esc(disp.hi.slice(0,20))}</div>` : ''}
  </div>`;
}

function renderChapterSelect() {
  const sex = state.patient.sex;
  const visibleChapters = state.data.chapterList.filter(ch => {
    if (sex === 'male' && ch === 'Genitalia female') return false;
    if (sex === 'female' && ch === 'Genitalia male') return false;
    return true;
  });
  const visibleSet = new Set(visibleChapters);
  const caseCount = state.completeCase.length;
  const caseFooter = caseCount ? `<div class="footer-bar">
      <button class="btn-outline" onclick="goToCaseReview()">Review case (${caseCount} added)</button>
    </div>` : '';

  // Level 2 — a block was tapped; show just its chapters, with a way back
  // to the overview instead of every chapter in the repertory at once.
  if (chapterBlockView !== null) {
    const group = CHAPTER_GROUPS[chapterBlockView];
    const present = group.chapters.filter(ch => visibleSet.has(ch));
    const cols = present.length === 4 ? 2 : Math.min(present.length, 3);
    return `
      ${renderTopbar('Guided Case Wizard', group.label)}
      <div class="body">
        <button class="back-btn" onclick="onChapterBlockBack()">&larr; Back</button>
        <h2 class="step-title">${esc(group.label)}</h2>
        <p class="step-sub">Pick the one that best matches. जो सबसे सही लगे उसे चुनें।</p>
        <div class="chapter-grid" style="grid-template-columns:repeat(${cols},1fr);">${present.map(ch => renderChapterCard(ch, group.icon)).join('')}</div>
      </div>
      ${caseFooter}
    `;
  }

  // Level 1 — every related-chapter block shown as a single tile (tap to see
  // its specific chapters), plus every chapter that isn't part of any block,
  // exactly as before.
  const groupedSet = new Set();
  const blockTilesHtml = CHAPTER_GROUPS.map((g, idx) => {
    const present = g.chapters.filter(ch => visibleSet.has(ch));
    if (!present.length) return '';
    present.forEach(ch => groupedSet.add(ch));
    return `<div class="ch-card" onclick="onChapterBlockPick(${idx})">
      ${renderIcon(g.icon)}
      <div class="en">${esc(g.label)}</div>
      <div style="font-size:10px;color:var(--ink3);margin-top:3px;">${present.length} areas · ${present.length} क्षेत्र &rsaquo;</div>
    </div>`;
  }).join('');

  const remaining = visibleChapters.filter(ch => !groupedSet.has(ch));
  const cards = remaining.map(ch => renderChapterCard(ch)).join('');

  return `
    ${renderTopbar('Guided Case Wizard', 'Select what is troubling the patient')}
    <div class="body">
      <h2 class="step-title">Where is the main problem, or what kind of problem is it?</h2>
      <p class="step-sub">Pick the one that best matches — you can add more complaints after this one. जो सबसे सही लगे उसे चुनें — इसके बाद आप और शिकायतें भी जोड़ सकते हैं।</p>
      <div class="chapter-grid">${blockTilesHtml}${cards}</div>
    </div>
    ${caseFooter}
  `;
}

function onChapterBlockPick(groupIndex) {
  chapterBlockView = groupIndex;
  render();
}

function onChapterBlockBack() {
  chapterBlockView = null;
  render();
}

let searchFilter = '';
let showAllOptions = false;
let collapsedGroups = {}; // { groupLabel: true/false } — true = collapsed. Reusable pattern.
let chapterBlockView = null; // null = showing the block/chapter overview; a CHAPTER_GROUPS index = drilled into that one block's chapters
// Tracks the 3-tap cycle on the "stop here" card at the CURRENT node:
// 'unlocked' (not yet added) -> tap adds it, locks -> 'locked' -> tap
// unlocks (still added, reconsidering) -> 'unlockedAfterLock' -> tap finalizes
// (same connector/case-review routing the old single-tap used to do
// immediately). Reset whenever the current node changes.
let stopHereLockState = 'unlocked';

// Reusable collapsible-section renderer — used for option groups here, and
// intended for reuse anywhere else in the app that needs the same
// collapsed-by-default, tap-to-expand-and-collapse-again behavior.
function renderCollapsibleSection(groupKey, label, countLabel, innerHtml) {
  const isCollapsed = collapsedGroups[groupKey] !== false; // collapsed by default
  return `
    <div class="collapsible-section">
      <div class="collapsible-header" onclick="onToggleGroup('${escAttr(groupKey)}')">
        <span class="collapsible-arrow ${isCollapsed ? '' : 'open'}">&#9656;</span>
        <span class="collapsible-label">${esc(label)}</span>
        <span class="collapsible-count">${esc(countLabel)}</span>
      </div>
      ${!isCollapsed ? `<div class="collapsible-body">${innerHtml}</div>` : ''}
    </div>
  `;
}

function onToggleGroup(groupKey) {
  const currentlyCollapsed = collapsedGroups[groupKey] !== false;
  const willExpand = currentlyCollapsed;

  // Accordion behavior: expanding a live option-group ("What it feels like",
  // "Other details", etc.) auto-collapses its sibling groups at the same step,
  // making room for it. This does NOT apply to selectedNode history rows —
  // those are sequential/nested, not mutually-exclusive alternatives, so each
  // toggles independently.
  if (willExpand && !groupKey.startsWith('selectedNode::')) {
    const lastSep = groupKey.lastIndexOf('::');
    if (lastSep !== -1) {
      const scopePrefix = groupKey.slice(0, lastSep + 2); // same step, up to and including the final '::'
      for (const key in collapsedGroups) {
        if (key !== groupKey && key.startsWith(scopePrefix) && !key.startsWith('selectedNode::')) {
          collapsedGroups[key] = true; // force-collapse sibling groups
        }
      }
    }
  }

  collapsedGroups[groupKey] = !currentlyCollapsed;
  render();
}

function renderWalkStep() {
  const pathTokens = state.currentWalk.pathTokens;
  const chapter = pathTokens[0];

  // Render every already-made selection (depth 1 .. end) as a static, indented,
  // individually-collapsible row — this is the persistent history the patient
  // asked for. Each row gets its own expand/collapse arrow. Collapsing a row
  // only hides what's visually nested under it; it never removes the underlying
  // selection (pathTokens itself is untouched by collapsing).
  let historyHtml = '';
  let stoppedAtCollapsedDepth = -1;

  for (let depth = 1; depth < pathTokens.length; depth++) {
    const tokenAtDepth = pathTokens[depth];
    const pathUpToHere = pathTokens.slice(0, depth + 1).join(', ');
    const disp = getDisplayText(chapter, pathUpToHere, tokenAtDepth);
    const indent = (depth - 1) * 14;
    const nodeKey = 'selectedNode::' + pathUpToHere;
    const isCollapsed = collapsedGroups[nodeKey] === true; // selected nodes default OPEN

    historyHtml += `
      <div class="selected-node" style="margin-left:${indent}px">
        <div class="selected-node-header" onclick="onToggleGroup('${escAttr(nodeKey)}')">
          <span class="collapsible-arrow ${isCollapsed ? '' : 'open'}">&#9656;</span>
          <div class="selected-node-text">
            ${renderTrilingualBlock(disp)}
          </div>
        </div>
      </div>`;

    if (isCollapsed) { stoppedAtCollapsedDepth = depth; break; }
  }

  // If the path was cut short by a collapsed node, nothing further renders below it.
  if (stoppedAtCollapsedDepth !== -1) {
    return `
      ${renderTopbar('Guided Case Wizard', chapter)}
      ${renderBreadcrumb()}
      <div class="body">
        <button class="back-btn" onclick="onWalkBack()">&larr; Back</button>
      ${state.editingCaseIndex !== null ? `<div class="editing-banner">Editing an existing complaint. मौजूदा शिकायत में बदलाव किया जा रहा है। <span class="cancel-edit-link" onclick="onCancelEdit()">Cancel — keep original · रद्द करें, पहले जैसा रखें</span></div>` : ''}
        <h2 class="step-title">Choose what applies</h2>
        <p class="step-sub">जो लागू हो उसे चुनें</p>
        ${historyHtml}
      </div>
    `;
  }

  // Live, interactive options at the current deepest level — same logic as
  // before, just now indented to sit visually under the selection history.
  const liveIndent = (pathTokens.length - 1) * 14;
  const { exactMatchRubric, nextOptions } = getNextOptions(pathTokens);

  let entries = Object.entries(nextOptions);
  if (searchFilter) {
    const filterWords = searchFilter.split(/[,\s]+/).map(w => w.trim().toLowerCase()).filter(Boolean);
    entries = entries.filter(([token]) => {
      const optPath = pathTokens.concat([token]).join(', ');
      const disp = getDisplayText(chapter, optPath, token);
      const searchable = (disp.kent + ' ' + disp.en + ' ' + disp.hi + ' ' + disp.roman).toLowerCase();
      return filterWords.every(w => searchable.includes(w));
    });
  }
  entries.sort((a, b) => b[1].rubricCount - a[1].rubricCount);

  const totalCount = entries.length;
  const displayEntries = showAllOptions ? entries : entries.slice(0, 15);

  const grouped = {};
  for (const [token, info] of displayEntries) {
    const kind = classifyOptionKind(token);
    if (!grouped[kind]) grouped[kind] = [];
    grouped[kind].push([token, info]);
  }

  let stopHereHtml = '';
  if (exactMatchRubric) {
    const disp = getDisplayText(chapter, exactMatchRubric.path, pathTokens[pathTokens.length - 1]);
    const tapArgs = `'${exactMatchRubric.id}', '${escAttr(exactMatchRubric.path)}', ${exactMatchRubric.remedyCount}`;
    const stopHereLabels = {
      unlocked: { icon: 'lockOpen', en: 'Yes, this is it', hi: 'हाँ, यही है' },
      locked: { icon: 'lockClosed', en: 'Added — tap to reconsider', hi: 'जोड़ दिया — फिर से सोचने के लिए टैप करें' },
      unlockedAfterLock: { icon: 'lockOpen', en: 'Tap again to continue', hi: 'जारी रखने के लिए फिर से टैप करें' },
    };
    const s = stopHereLabels[stopHereLockState] || stopHereLabels.unlocked;
    const lockSvg = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--teal)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">${ICON_PATHS[s.icon]}</svg>`;
    stopHereHtml = `<div class="stop-here-card" onclick="onStopHereTap(${tapArgs})">
      <div class="label">${lockSvg}<span>${esc(s.en)} · ${esc(s.hi)}</span></div>
      ${renderTrilingualBlock(disp)}
    </div>`;
  }

  const groupsHtml = Object.entries(grouped).map(([kind, opts]) => {
    const inner = opts.map(([token, info]) => {
      const optPath = pathTokens.concat([token]).join(', ');
      const disp = getDisplayText(chapter, optPath, token);
      return `<div class="opt-card" onclick="onOptionPick('${escAttr(token)}')">
        ${renderTrilingualBlock(disp, info.rubricCount)}
        <div class="meta">${info.totalRemedies} remedy-references</div>
      </div>`;
    }).join('');
    const kindLabel = kind + ' · ' + (KIND_HINDI[kind] || kind);
    return renderCollapsibleSection(chapter + '::' + pathTokens.join(',') + '::' + kind, kindLabel, opts.length + ' विकल्प · option(s)', inner);
  }).join('');

  const showAllLink = (!showAllOptions && totalCount > 15)
    ? `<div class="show-all-link" onclick="onShowAllOptions()">Show all ${totalCount} options · सभी ${totalCount} विकल्प देखें</div>` : '';

  const noMoreOptions = totalCount === 0;
  const filterMatchedNothing = noMoreOptions && searchFilter.length > 0;
  const genuinelyNoData = noMoreOptions && searchFilter.length === 0;

  return `
    ${renderTopbar('Guided Case Wizard', chapter)}
    ${renderBreadcrumb()}
    <div class="body">
      <button class="back-btn" onclick="onWalkBack()">&larr; Back</button>
      ${state.editingCaseIndex !== null ? `<div class="editing-banner">Editing an existing complaint. मौजूदा शिकायत में बदलाव किया जा रहा है। <span class="cancel-edit-link" onclick="onCancelEdit()">Cancel — keep original · रद्द करें, पहले जैसा रखें</span></div>` : ''}
      <h2 class="step-title">Choose what applies</h2>
      <p class="step-sub">जो लागू हो उसे चुनें। Select one to go more specific, or tap "Yes, this is it" to stop here. अधिक विशेष जानकारी के लिए एक चुनें, या यहीं रुकने के लिए "हाँ, यही है" चुनें।</p>
      ${historyHtml}
      <div style="margin-left:${liveIndent}px">
        ${totalCount > 8 || searchFilter ? `<input id="walkFilterInput" class="search-box ${filterMatchedNothing ? 'no-match' : ''}" type="text" placeholder="Search these options… · यहाँ खोजें…" value="${escAttr(searchFilter)}" oninput="onSearchFilterChange(this.value)">` : ''}
        ${filterMatchedNothing ? `<div class="no-match-msg">No option here matches "${esc(searchFilter)}" — try a shorter part of the word, or clear this to see everything again. "${esc(searchFilter)}" से कोई विकल्प मेल नहीं खाता — शब्द का छोटा हिस्सा आज़माएं, या सब देखने के लिए इसे हटाएं।</div>` : ''}
        ${stopHereHtml}
        ${genuinelyNoData && !exactMatchRubric ? `<div class="empty-state">No further detail on file for this exact combination. इस सटीक जानकारी के लिए कोई और विवरण उपलब्ध नहीं है।</div>` : ''}
        ${groupsHtml}
        ${showAllLink}
      </div>
    </div>
  `;
}

function renderConnectorPrompt() {
  const item = state.connectorQueue[0];
  const typeLabel = { cause: 'often follows', sequence: 'often alternates or occurs together with', content: 'is often described alongside' }[item.connectorType] || 'is often linked with';
  return `
    ${renderTopbar('Guided Case Wizard', 'Related symptom check')}
    <div class="body">
      <div class="connector-box">
        <div class="label">Worth checking</div>
        <p>This complaint ${typeLabel} a symptom in <strong>${esc(item.connectedChapter)}</strong>. Would you like to check that too?</p>
      </div>
      <button class="btn-primary" style="margin-bottom:8px" onclick="onConnectorAccept('${escAttr(item.connectedChapter)}')">Yes, check ${esc(item.connectedChapter)}</button>
      <button class="btn-outline" onclick="onConnectorSkip()">No, skip this</button>
    </div>
  `;
}

function renderCaseReview() {
  const items = state.completeCase.map((c, i) => {
    const chapter = c.path.split(',')[0].trim();
    const disp = getDisplayText(chapter, c.path, c.path.split(',').map(s=>s.trim()).pop());
    return `
    <div class="case-item" onclick="onEditCaseItem(${i})">
      <button class="remove-btn" onclick="event.stopPropagation(); onRemoveCaseItem(${i})">Remove</button>
      ${renderTrilingualBlock(disp)}
      <div class="remedy-count">${c.remedyCount} remedy-references on file</div>
      <div class="case-item-hint">Tap to review or change this selection</div>
    </div>
  `;
  }).join('');

  return `
    ${renderTopbar('Your Symptoms', 'Review before continuing')}
    <div class="body">
      <h2 class="step-title">Complaints added so far</h2>
      ${state.completeCase.length ? items : '<div class="empty-state">No complaints added yet.</div>'}
    </div>
    <div class="footer-bar" style="flex-direction:column">
      <button class="btn-primary" onclick="onAddAnotherComplaint()">+ Add another complaint</button>
      ${state.completeCase.length ? `<button class="btn-outline" onclick="startGeneralsSequence()">Continue →</button>` : ''}
    </div>
  `;
}

// =================================================================
function renderSearchScreen() {
  const q = state.search.query.trim();
  const keywords = q.split(/[,\s]+/).map(k => k.trim().toLowerCase()).filter(Boolean);

  const TAB_DEFS = [
    { key: 'all', label: 'All' },
    { key: 'sensation', label: 'Sensation' },
    { key: 'timing', label: 'Timing' },
    { key: 'modality', label: 'Modality' },
    { key: 'laterality', label: 'Laterality' },
    { key: 'cause', label: 'Cause' },
    { key: 'sequence', label: 'Sequence' },
    { key: 'content', label: 'Content' }
  ];
  const tabsHtml = TAB_DEFS.map(t => `
    <button class="tab-btn ${state.search.activeTab === t.key ? 'active' : ''}" onclick="onSearchTabChange('${t.key}')">${esc(t.label)}</button>
  `).join('');

  let resultsHtml = '';
  let totalCount = 0;
  let nudgeHtml = '';

  if (keywords.length && state.data.searchIndex) {
    let matches = state.data.searchIndex.filter(r => keywords.every(k => r.searchable.includes(k)));
    if (state.search.activeTab !== 'all') {
      matches = matches.filter(r => r.tags[state.search.activeTab]);
    }
    matches.sort((a, b) => b.remedyCount - a.remedyCount);
    totalCount = matches.length;

    if (totalCount > 150) {
      nudgeHtml = `<div class="search-nudge">This matched a very large number of rubrics (${totalCount}). Try adding when it happens, which side, or what makes it better/worse to narrow this down.</div>`;
    }

    const shown = matches.slice(0, state.search.displayLimit);
    const byChapter = {};
    for (const r of shown) {
      if (!byChapter[r.chapter]) byChapter[r.chapter] = [];
      byChapter[r.chapter].push(r);
    }

    resultsHtml = Object.entries(byChapter).map(([chapter, items]) => `
      <div class="option-group-label" style="margin-top:14px">${esc(chapter)} (${items.length} shown)</div>
      ${items.map(r => {
        const disp = getDisplayText(r.chapter, r.path, r.path.split(',').map(s=>s.trim()).pop());
        return `<div class="opt-card" onclick="onSearchResultPick('${escAttr(r.path)}')">
          ${renderTrilingualBlock(disp)}
          <div class="meta">${r.remedyCount} remedy-references</div>
        </div>`;
      }).join('')}
    `).join('');

    if (state.search.displayLimit < totalCount) {
      resultsHtml += `<div class="show-all-link" onclick="onSearchShowMore()">Showing ${Math.min(state.search.displayLimit, totalCount)} of ${totalCount} — show more</div>`;
    }
  }

  return `
    ${renderTopbar('Search', 'Find a rubric directly, in Kent term, English, or Hindi')}
    <div class="body">
      <button class="back-btn" onclick="onCloseSearch()">&larr; Back</button>
      <input id="globalSearchInput" class="search-box" type="text" placeholder="e.g. pain, morning, right side…" value="${escAttr(state.search.query)}" oninput="onSearchInput(this.value)" autofocus>
      <p class="step-sub">Separate multiple keywords with commas. More keywords narrow the results.</p>
      <div class="search-tabs">${tabsHtml}</div>
      ${nudgeHtml}
      ${!keywords.length ? `<div class="empty-state">Start typing to search across all chapters.</div>` : ''}
      ${keywords.length && !totalCount ? `<div class="empty-state">No rubrics found matching all of: ${esc(keywords.join(', '))}</div>` : ''}
      ${resultsHtml}
    </div>
  `;
}


// =================================================================
function onChapterPick(chapter) {
  state.currentWalk = { pathTokens: [chapter] };
  searchFilter = '';
  showAllOptions = false;
  collapsedGroups = {};
  stopHereLockState = 'unlocked';
  state.screen = 'walk';
  render();
}

function onOptionPick(token) {
  state.currentWalk.pathTokens.push(token);
  searchFilter = '';
  showAllOptions = false;
  collapsedGroups = {};
  stopHereLockState = 'unlocked';
  render();
}

function onWalkBack() {
  if (state.currentWalk.pathTokens.length <= 1) {
    state.screen = 'chapters';
    state.editingCaseIndex = null; // abandoning the walk cancels any in-progress edit; original entry is untouched
  } else {
    state.currentWalk.pathTokens.pop();
  }
  searchFilter = '';
  showAllOptions = false;
  collapsedGroups = {};
  stopHereLockState = 'unlocked';
  render();
}

function onEditCaseItem(index) {
  const item = state.completeCase[index];
  state.editingCaseIndex = index;
  state.currentWalk = { pathTokens: item.path.split(',').map(s => s.trim()) };
  searchFilter = '';
  showAllOptions = false;
  collapsedGroups = {};
  stopHereLockState = 'locked'; // this rubric is already the current answer for this item
  state.screen = 'walk';
  render();
}

function onCancelEdit() {
  state.editingCaseIndex = null;
  state.screen = 'caseReview';
  render();
}

function onSearchFilterChange(val) {
  const inputEl = document.getElementById('walkFilterInput');
  const cursorPos = inputEl ? inputEl.selectionStart : val.length;

  searchFilter = val;
  render();

  const newInputEl = document.getElementById('walkFilterInput');
  if (newInputEl) {
    newInputEl.focus();
    newInputEl.setSelectionRange(cursorPos, cursorPos);
  }
}

function onShowAllOptions() {
  showAllOptions = true;
  render();
}

// The "stop here" card now works in three taps instead of one immediate
// add-and-navigate: tap 1 adds the rubric and locks the card (visible
// confirmation, no surprise navigation); tap 2 unlocks it again for
// reconsideration without removing it; tap 3 finalizes — exactly the same
// connector/case-review routing the old single-tap design used to do right away.
function onStopHereTap(rubricId, path, remedyCount) {
  if (stopHereLockState === 'unlocked') {
    const entry = { rubricId, path, remedyCount };
    if (state.editingCaseIndex !== null) {
      state.completeCase[state.editingCaseIndex] = entry;
    } else {
      state.completeCase.push(entry);
    }
    stopHereLockState = 'locked';
    render();
  } else if (stopHereLockState === 'locked') {
    stopHereLockState = 'unlockedAfterLock';
    render();
  } else {
    if (state.editingCaseIndex !== null) {
      state.editingCaseIndex = null;
      state.screen = 'caseReview';
    } else {
      const suggestions = (state.data.connectorMap[rubricId] || []);
      if (suggestions.length) {
        state.connectorQueue = suggestions.slice(0, 3); // cap at 3 to avoid overwhelming
        state.screen = 'connectorPrompt';
      } else {
        state.screen = 'caseReview';
      }
    }
    render();
  }
}

function onConnectorAccept(connectedChapter) {
  state.connectorQueue.shift();
  state.currentWalk = { pathTokens: [connectedChapter] };
  searchFilter = '';
  showAllOptions = false;
  collapsedGroups = {};
  stopHereLockState = 'unlocked';
  state.screen = 'walk';
  render();
}

function onConnectorSkip() {
  state.connectorQueue.shift();
  if (state.connectorQueue.length) {
    render(); // show next queued suggestion
  } else {
    state.screen = 'caseReview';
    render();
  }
}

function onRemoveCaseItem(index) {
  state.completeCase.splice(index, 1);
  render();
}

function onAddAnotherComplaint() {
  state.currentWalk = { pathTokens: [] };
  state.screen = 'chapters';
  render();
}

function onOpenSearch() {
  state.returnScreenAfterSearch = state.screen === 'search' ? state.returnScreenAfterSearch : state.screen;
  state.search.query = '';
  state.search.activeTab = 'all';
  state.search.displayLimit = 30;
  state.screen = 'search';
  render();
}

function onCloseSearch() {
  state.screen = state.returnScreenAfterSearch || 'chapters';
  render();
}

function onSearchInput(val) {
  const inputEl = document.getElementById('globalSearchInput');
  const cursorPos = inputEl ? inputEl.selectionStart : val.length;

  state.search.query = val;
  state.search.displayLimit = 30; // reset pagination on every new query
  render();

  const newInputEl = document.getElementById('globalSearchInput');
  if (newInputEl) {
    newInputEl.focus();
    newInputEl.setSelectionRange(cursorPos, cursorPos);
  }
}

function onSearchTabChange(tabKey) {
  state.search.activeTab = tabKey;
  state.search.displayLimit = 30;
  render();
}

function onSearchShowMore() {
  state.search.displayLimit += 30;
  render();
}

// The core of the search-to-tree feature: a chosen rubric's full path becomes
// the walk's pathTokens directly, landing the patient exactly there — the
// exact same rendering logic used for normal click-through browsing then
// takes over from this point on, with no special-casing needed downstream.
function onSearchResultPick(path) {
  const pathTokens = path.split(',').map(s => s.trim());
  state.currentWalk = { pathTokens };
  searchFilter = '';
  showAllOptions = false;
  collapsedGroups = {};
  stopHereLockState = 'unlocked';
  state.screen = 'walk';
  render();
}


function goToCaseReview() {
  state.screen = 'caseReview';
  render();
}
async function onSubmitCase() {
  state.submit.busy = true;
  state.submit.error = '';
  render();

  const payload = {
    patient: state.patient,
    accessCodeUsed: state.lock.accessCodeUsed,
    complaints: state.completeCase, // includes both complaint- and generals-sourced entries; generals ones carry source:'generals'
    submittedAt: new Date().toISOString()
  };

  const result = await window.submitCaseToFirebase(payload);
  state.submit.busy = false;

  if (result.ok) {
    state.screen = 'submitted';
    render();
  } else {
    state.submit.error = result.error || 'Could not submit — please try again.';
    render();
  }
}

// =================================================================
// UTIL
// =================================================================
function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escAttr(s) {
  return String(s || '').replace(/'/g, "\\'");
}

// =================================================================
// BOOT
// =================================================================
window.addEventListener('DOMContentLoaded', () => {
  // slight delay to let the script-tag data finish evaluating
  setTimeout(initData, 50);
});

<script type="module">
  // Same Firebase project and SDK version as questionnaire_prototype.html and
  // admin-panel.html — reusing the exact, already-tested access-code checking
  // logic, plus a new function for writing a completed case.
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, get, update, push, set }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAqzKPqBzNoBJc5FWjnVXMER4prgrbhqag",
    authDomain: "punarvasu-790a8.firebaseapp.com",
    databaseURL: "https://punarvasu-790a8-default-rtdb.firebaseio.com",
    projectId: "punarvasu-790a8",
    storageBucket: "punarvasu-790a8.firebasestorage.app",
    messagingSenderId: "774115339459",
    appId: "1:774115339459:web:4ee1f45e1e25d61666c676"
  };

  const app = initializeApp(firebaseConfig, 'patientIntakeApp');
  const db = getDatabase(app);

  // Identical logic to questionnaire_prototype.html's access-code check —
  // same rules, same behavior: burns the code the instant it's valid.
  window.checkAndUseAccessCode = async function (code) {
    try {
      const codeRef = ref(db, 'accessCodes/' + code);
      const snap = await get(codeRef);
      if (!snap.exists()) return { ok: false, reason: 'invalid' };
      const data = snap.val();
      if (data.used === true) return { ok: false, reason: 'used' };
      await update(codeRef, { used: true });
      return { ok: true };
    } catch (e) {
      console.error('[patient-intake] access code check failed:', e);
      return { ok: false, reason: 'error' };
    }
  };

  // Writes the completed case to a new /cases node — patient info, the full
  // selected-rubric list, which access code unlocked this session, and a
  // timestamp. Security rules (separate from this file) ensure a patient can
  // only write their own new case, never read anyone else's.
  window.submitCaseToFirebase = async function (payload) {
    try {
      const casesRef = ref(db, 'cases');
      const newCaseRef = push(casesRef);
      await set(newCaseRef, payload);
      return { ok: true, caseId: newCaseRef.key };
    } catch (e) {
      console.error('[patient-intake] case submission failed:', e);
      return { ok: false, error: e.message };
    }
  };

// Generals walk functions are defined in the main script above and are
// already globally accessible — no window assignment needed here.
</script>
