// A block's icon can be one key (single SVG) or an array of keys (a few
// small ones shown side by side) for groups that cover several distinct
// body parts at once, e.g. Face + Mouth + Teeth.
function renderIcon(keyOrKeys) {
  if (!keyOrKeys) return '';
  const keys = Array.isArray(keyOrKeys) ? keyOrKeys : [keyOrKeys];
  const size = keys.length > 1 ? 20 : 26;
  const svgs = keys.filter(k => ICON_PATHS[k]).map(k =>
    `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="var(--teal)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[k]}</svg>`
  );
  if (!svgs.length) return '';
  if (svgs.length === 1) return `<div style="margin-bottom:4px;">${svgs[0]}</div>`;
  return `<div style="display:flex;justify-content:center;gap:4px;margin-bottom:4px;">${svgs.join('')}</div>`;
}

function renderChapterCard(ch, iconOverride) {
  const iconKey = iconOverride || STANDALONE_CHAPTER_ICONS[ch];
  return `<div class="ch-card" onclick="onChapterPick('${escAttr(ch)}')">
    ${renderIcon(iconKey)}
    <div class="en">${esc(ch)}</div>
    ${CHAPTER_HINDI_NAMES[ch] ? `<div class="hi">${esc(CHAPTER_HINDI_NAMES[ch])}</div>` : ''}
  </div>`;
}

function renderChapterSelect() {
  const sex = state.patient.sex;
  const visibleChapters = state.data.chapterList.filter(ch => {
    if (sex === 'male' && ch === 'Genitalia female') return false;
    if (sex === 'female' && ch === 'Genitalia male') return false;
    return true;
  });
  const visibleSet = new Set(visibleChapters);
  const caseCount = state.completeCase.length;
  const caseFooter = caseCount ? `<div class="footer-bar">
      <button class="btn-outline" onclick="goToCaseReview()">Review case (${caseCount} added)</button>
    </div>` : '';

  // Level 2 — a block was tapped; show just its chapters, with a way back
  // to the overview instead of every chapter in the repertory at once.
  if (chapterBlockView !== null) {
    const group = CHAPTER_GROUPS[chapterBlockView];
    const present = group.chapters.filter(ch => visibleSet.has(ch));
    const cols = present.length === 4 ? 2 : Math.min(present.length, 3);
    return `
      ${renderTopbar('Guided Case Wizard', group.label)}
      <div class="body">
        <button class="back-btn" onclick="onChapterBlockBack()">&larr; Back</button>
        <h2 class="step-title">${esc(group.label)}</h2>
        <p class="hi" style="margin-bottom:10px;">${esc(group.hindi)}</p>
        <p class="step-sub">Pick the one that best matches. जो सबसे सही लगे उसे चुनें।</p>
        <div class="chapter-grid" style="grid-template-columns:repeat(${cols},1fr);">${present.map(ch => renderChapterCard(ch, group.icon)).join('')}</div>
      </div>
      ${caseFooter}
    `;
  }

  // Level 1 — every related-chapter block shown as a single tile (tap to see
  // its specific chapters), plus every chapter that isn't part of any block,
  // exactly as before.
  const groupedSet = new Set();
  const blockTilesHtml = CHAPTER_GROUPS.map((g, idx) => {
    const present = g.chapters.filter(ch => visibleSet.has(ch));
    if (!present.length) return '';
    present.forEach(ch => groupedSet.add(ch));
    return `<div class="ch-card" onclick="onChapterBlockPick(${idx})">
      ${renderIcon(g.icon)}
      <div class="en">${esc(g.label)}</div>
      <div class="hi">${esc(g.hindi)} &rsaquo;</div>
    </div>`;
  }).join('');

  const remaining = visibleChapters.filter(ch => !groupedSet.has(ch));
  const cards = remaining.map(ch => renderChapterCard(ch)).join('');

  return `
    ${renderTopbar('Guided Case Wizard', 'Select what is troubling the patient')}
    <div class="body">
      <button class="back-btn" onclick="startWarmupSequence()">&larr; Back</button>
      <h2 class="step-title">Where is the main problem, or what kind of problem is it?</h2>
      <p class="step-sub">Pick the one that best matches — you can add more complaints after this one. जो सबसे सही लगे उसे चुनें — इसके बाद आप और शिकायतें भी जोड़ सकते हैं।</p>
      <div class="chapter-grid">${blockTilesHtml}${cards}</div>
    </div>
    ${caseFooter}
  `;
}

function onChapterBlockPick(groupIndex) {
  chapterBlockView = groupIndex;
  render();
}

function onChapterBlockBack() {
  chapterBlockView = null;
  render();
}

let searchFilter = '';
let showAllOptions = false;
let collapsedGroups = {}; // { groupLabel: true/false } — true = collapsed. Reusable pattern.
let chapterBlockView = null; // null = showing the block/chapter overview; a CHAPTER_GROUPS index = drilled into that one block's chapters
// The "stop here" card starts UNLOCKED — tapping it locks the rubric in
// (adds it to the case) and never auto-navigates anywhere; the patient uses
// the explicit "Add more complaints" / "Continue" buttons to move on, on
// their own schedule. Tapping a locked card unlocks it again to reconsider —
// for a fresh (non-editing) pick that removes it from the case until
// something is locked again; when re-entering an already-added item to
// reconsider it, the original stays untouched until a new lock replaces it.
// Reset to 'unlocked' whenever the current node changes.
let stopHereLockState = 'unlocked';
// Case review list: every item shows locked by default (it's already in the
// case). Tapping it unlocks in place first ("click to reconsider"); tapping
// again while in that state is what navigates to the rubric's origin. Reset
// whenever the case list screen is freshly entered. Keyed by completeCase
// index — cleared entirely on any removal so a shifted index never carries
// stale state onto the wrong item.
let caseItemLockState = {};

// Reusable collapsible-section renderer — used for option groups here, and
// intended for reuse anywhere else in the app that needs the same
// collapsed-by-default, tap-to-expand-and-collapse-again behavior.
function renderCollapsibleSection(groupKey, label, countLabel, innerHtml) {
  const isCollapsed = collapsedGroups[groupKey] !== false; // collapsed by default
  return `
    <div class="collapsible-section">
      <div class="collapsible-header" onclick="onToggleGroup('${escAttr(groupKey)}')">
        <span class="collapsible-arrow ${isCollapsed ? '' : 'open'}">&#9656;</span>
        <span class="collapsible-label">${esc(label)}</span>
        <span class="collapsible-count">${esc(countLabel)}</span>
      </div>
      ${!isCollapsed ? `<div class="collapsible-body">${innerHtml}</div>` : ''}
    </div>
  `;
}

function onToggleGroup(groupKey) {
  const currentlyCollapsed = collapsedGroups[groupKey] !== false;
  const willExpand = currentlyCollapsed;

  // Accordion behavior: expanding a live option-group ("What it feels like",
  // "Other details", etc.) auto-collapses its sibling groups at the same step,
  // making room for it. This does NOT apply to selectedNode history rows —
  // those are sequential/nested, not mutually-exclusive alternatives, so each
  // toggles independently.
  if (willExpand && !groupKey.startsWith('selectedNode::')) {
    const lastSep = groupKey.lastIndexOf('::');
    if (lastSep !== -1) {
      const scopePrefix = groupKey.slice(0, lastSep + 2); // same step, up to and including the final '::'
      for (const key in collapsedGroups) {
        if (key !== groupKey && key.startsWith(scopePrefix) && !key.startsWith('selectedNode::')) {
          collapsedGroups[key] = true; // force-collapse sibling groups
        }
      }
    }
  }

  collapsedGroups[groupKey] = !currentlyCollapsed;
  render();
}

function renderWalkStep() {
  const pathTokens = state.currentWalk.pathTokens;
  const chapter = pathTokens[0];

  // Render every already-made selection (depth 1 .. end) as a static, indented,
  // individually-collapsible row — this is the persistent history the patient
  // asked for. Each row gets its own expand/collapse arrow. Collapsing a row
  // only hides what's visually nested under it; it never removes the underlying
  // selection (pathTokens itself is untouched by collapsing).
  let historyHtml = '';
  let stoppedAtCollapsedDepth = -1;

  for (let depth = 1; depth < pathTokens.length; depth++) {
    const tokenAtDepth = pathTokens[depth];
    const pathUpToHere = pathTokens.slice(0, depth + 1).join(', ');
    const disp = getDisplayText(chapter, pathUpToHere, tokenAtDepth);
    const indent = (depth - 1) * 14;
    const nodeKey = 'selectedNode::' + pathUpToHere;
    const isCollapsed = collapsedGroups[nodeKey] === true; // selected nodes default OPEN

    historyHtml += `
      <div class="selected-node" style="margin-left:${indent}px">
        <div class="selected-node-header" onclick="onToggleGroup('${escAttr(nodeKey)}')">
          <span class="collapsible-arrow ${isCollapsed ? '' : 'open'}">&#9656;</span>
          <div class="selected-node-text">
            ${renderTrilingualBlock(disp)}
          </div>
        </div>
      </div>`;

    if (isCollapsed) { stoppedAtCollapsedDepth = depth; break; }
  }

  // If the path was cut short by a collapsed node, nothing further renders below it.
  if (stoppedAtCollapsedDepth !== -1) {
    return `
      ${renderTopbar('Guided Case Wizard', chapter)}
      ${renderBreadcrumb()}
      <div class="body">
        <button class="back-btn" onclick="onWalkBack()">&larr; Back</button>
      ${state.editingCaseIndex !== null ? `<div class="editing-banner">Editing an existing complaint. मौजूदा शिकायत में बदलाव किया जा रहा है। <span class="cancel-edit-link" onclick="onCancelEdit()">Cancel — keep original · रद्द करें, पहले जैसा रखें</span></div>` : ''}
        <h2 class="step-title">Choose what applies</h2>
        <p class="step-sub">जो लागू हो उसे चुनें</p>
        ${historyHtml}
      </div>
      ${state.completeCase.length ? `<div class="footer-bar">
        <button class="btn-outline" onclick="onAddAnotherComplaint()">Add more complaints · और शिकायतें जोड़ें</button>
        <button class="btn-primary" onclick="goToCaseReview()">Continue → · जारी रखें</button>
      </div>` : ''}
    `;
  }

  // Live, interactive options at the current deepest level — same logic as
  // before, just now indented to sit visually under the selection history.
  const liveIndent = (pathTokens.length - 1) * 14;
  const { exactMatchRubric, nextOptions } = getNextOptions(pathTokens);

  let entries = Object.entries(nextOptions);
  if (searchFilter) {
    const filterWords = searchFilter.split(/[,\s]+/).map(w => w.trim().toLowerCase()).filter(Boolean);
    entries = entries.filter(([token]) => {
      const optPath = pathTokens.concat([token]).join(', ');
      const disp = getDisplayText(chapter, optPath, token);
      const searchable = (disp.kent + ' ' + disp.en + ' ' + disp.hi + ' ' + disp.roman).toLowerCase();
      return filterWords.every(w => searchable.includes(w));
    });
  }
  entries.sort((a, b) => b[1].rubricCount - a[1].rubricCount);

  const totalCount = entries.length;
  const displayEntries = showAllOptions ? entries : entries.slice(0, 15);

  const grouped = {};
  for (const [token, info] of displayEntries) {
    const kind = classifyOptionKind(token);
    if (!grouped[kind]) grouped[kind] = [];
    grouped[kind].push([token, info]);
  }

  let stopHereHtml = '';
  if (exactMatchRubric) {
    const disp = getDisplayText(chapter, exactMatchRubric.path, pathTokens[pathTokens.length - 1]);
    const tapArgs = `'${exactMatchRubric.id}', '${escAttr(exactMatchRubric.path)}', ${exactMatchRubric.remedyCount}`;
    const captions = {
      unlocked: { icon: 'lockOpen', en: 'Tap to lock', hi: 'लॉक करें' },
      locked: { icon: 'lockClosed', en: 'Tap to unlock', hi: 'अनलॉक करें' },
    };
    const s = captions[stopHereLockState] || captions.unlocked;
    const lockSvg = `<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="var(--danger)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">${ICON_PATHS[s.icon]}</svg>`;
    stopHereHtml = `<div class="stop-here-card" onclick="onStopHereTap(${tapArgs})">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
        <div style="flex:1;min-width:0;">
          <div class="label">Yes, this is it · हाँ, यही है</div>
          ${renderTrilingualBlock(disp)}
        </div>
        <div class="lock-badge">
          ${lockSvg}
          <div class="caption">${esc(s.en)} · ${esc(s.hi)}</div>
        </div>
      </div>
    </div>`;
  }

  const groupsHtml = Object.entries(grouped).map(([kind, opts]) => {
    const inner = opts.map(([token, info]) => {
      const optPath = pathTokens.concat([token]).join(', ');
      const disp = getDisplayText(chapter, optPath, token);
      return `<div class="opt-card" onclick="onOptionPick('${escAttr(token)}')">
        ${renderTrilingualBlock(disp, info.rubricCount)}
        <div class="meta">${info.totalRemedies} remedy-references</div>
      </div>`;
    }).join('');
    const kindLabel = kind + ' · ' + (KIND_HINDI[kind] || kind);
    return renderCollapsibleSection(chapter + '::' + pathTokens.join(',') + '::' + kind, kindLabel, opts.length + ' विकल्प · option(s)', inner);
  }).join('');

  const showAllLink = (!showAllOptions && totalCount > 15)
    ? `<div class="show-all-link" onclick="onShowAllOptions()">Show all ${totalCount} options · सभी ${totalCount} विकल्प देखें</div>` : '';

  const noMoreOptions = totalCount === 0;
  const filterMatchedNothing = noMoreOptions && searchFilter.length > 0;
  const genuinelyNoData = noMoreOptions && searchFilter.length === 0;

  return `
    ${renderTopbar('Guided Case Wizard', chapter)}
    ${renderBreadcrumb()}
    <div class="body">
      <button class="back-btn" onclick="onWalkBack()">&larr; Back</button>
      ${state.editingCaseIndex !== null ? `<div class="editing-banner">Editing an existing complaint. मौजूदा शिकायत में बदलाव किया जा रहा है। <span class="cancel-edit-link" onclick="onCancelEdit()">Cancel — keep original · रद्द करें, पहले जैसा रखें</span></div>` : ''}
      <h2 class="step-title">Choose what applies</h2>
      <p class="step-sub">जो लागू हो उसे चुनें। Select one to go more specific, or tap "Yes, this is it" to stop here. अधिक विशेष जानकारी के लिए एक चुनें, या यहीं रुकने के लिए "हाँ, यही है" चुनें।</p>
      ${historyHtml}
      <div style="margin-left:${liveIndent}px">
        ${totalCount > 8 || searchFilter ? `<input id="walkFilterInput" class="search-box ${filterMatchedNothing ? 'no-match' : ''}" type="text" placeholder="Search these options… · यहाँ खोजें…" value="${escAttr(searchFilter)}" oninput="onSearchFilterChange(this.value)">` : ''}
        ${filterMatchedNothing ? `<div class="no-match-msg">No option here matches "${esc(searchFilter)}" — try a shorter part of the word, or clear this to see everything again. "${esc(searchFilter)}" से कोई विकल्प मेल नहीं खाता — शब्द का छोटा हिस्सा आज़माएं, या सब देखने के लिए इसे हटाएं।</div>` : ''}
        ${stopHereHtml}
        ${genuinelyNoData && !exactMatchRubric ? `<div class="empty-state">No further detail on file for this exact combination. इस सटीक जानकारी के लिए कोई और विवरण उपलब्ध नहीं है।</div>` : ''}
        ${groupsHtml}
        ${showAllLink}
      </div>
    </div>
    ${state.completeCase.length ? `<div class="footer-bar">
      <button class="btn-outline" onclick="onAddAnotherComplaint()">Add more complaints · और शिकायतें जोड़ें</button>
      <button class="btn-primary" onclick="goToCaseReview()">Continue → · जारी रखें</button>
    </div>` : ''}
  `;
}

function renderConnectorPrompt() {
  const item = state.connectorQueue[0];
  const typeLabel = { cause: 'often follows', sequence: 'often alternates or occurs together with', content: 'is often described alongside' }[item.connectorType] || 'is often linked with';
  return `
    ${renderTopbar('Guided Case Wizard', 'Related symptom check')}
    <div class="body">
      <div class="connector-box">
        <div class="label">Worth checking</div>
        <p>This complaint ${typeLabel} a symptom in <strong>${esc(item.connectedChapter)}</strong>. Would you like to check that too?</p>
      </div>
      <button class="btn-primary" style="margin-bottom:8px" onclick="onConnectorAccept('${escAttr(item.connectedChapter)}')">Yes, check ${esc(item.connectedChapter)}</button>
      <button class="btn-outline" onclick="onConnectorSkip()">No, skip this</button>
    </div>
  `;
}

function renderCaseReview() {
  const isPostSubmission = state.reviewMode === 'postSubmission';
  const items = state.completeCase.map((c, i) => {
    const chapter = c.path.split(',')[0].trim();
    const disp = getDisplayText(chapter, c.path, c.path.split(',').map(s=>s.trim()).pop());
    const reconsidering = caseItemLockState[i] === 'reconsidering';
    const caption = reconsidering
      ? { icon: 'lockOpen', en: 'Tap again to reconsider', hi: 'फिर से सोचने के लिए दोबारा टैप करें' }
      : { icon: 'lockClosed', en: 'Tap to unlock', hi: 'अनलॉक करें' };
    const lockSvg = `<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="var(--danger)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">${ICON_PATHS[caption.icon]}</svg>`;
    return `
    <div class="case-item" onclick="onCaseItemTap(${i})">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
        <div style="flex:1;min-width:0;">
          ${renderTrilingualBlock(disp)}
          <div class="remedy-count">${c.remedyCount} remedy-references on file</div>
        </div>
        <div class="lock-badge">
          ${lockSvg}
          <div class="caption">${esc(caption.en)} · ${esc(caption.hi)}</div>
        </div>
      </div>
      <button class="remove-btn" onclick="event.stopPropagation(); onRemoveCaseItem(${i})">Remove</button>
    </div>
  `;
  }).join('');

  const postSubmissionNotice = isPostSubmission ? `<div class="editing-banner">Reviewing your already-submitted case — you have 30 minutes of activity to make changes before this window closes. आपके पास बदलाव करने के लिए 30 मिनट हैं।</div>` : '';
  const submitErrorHtml = state.submit.error ? `<div class="no-match-msg" style="margin:0 0 10px;">${esc(state.submit.error)}</div>` : '';

  const footerHtml = isPostSubmission ? `
    <div class="footer-bar" style="flex-direction:column">
      ${submitErrorHtml}
      <button class="btn-outline" onclick="onAddAnotherComplaint()" ${state.submit.busy ? 'disabled' : ''}>+ Add another complaint</button>
      <button class="btn-primary" onclick="onSubmitCase()" ${state.submit.busy ? 'disabled' : ''}>${state.submit.busy ? 'Submitting…' : 'Submit revised case →'}</button>
      <button class="btn-outline" style="color:var(--ink3);" onclick="onDoneReviewingSubmittedCase()" ${state.submit.busy ? 'disabled' : ''}>Done — back to confirmation, no changes</button>
    </div>
  ` : `
    <div class="footer-bar" style="flex-direction:column">
      <button class="btn-primary" onclick="onAddAnotherComplaint()">+ Add another complaint</button>
      ${state.completeCase.length ? `<button class="btn-outline" onclick="startGeneralsSequence()">Continue →</button>` : ''}
    </div>
  `;

  return `
    ${renderTopbar('Your Symptoms', isPostSubmission ? 'Reviewing submitted case' : 'Review before continuing')}
    <div class="body">
      <h2 class="step-title">Complaints added so far</h2>
      ${postSubmissionNotice}
      ${state.completeCase.length ? items : '<div class="empty-state">No complaints added yet.</div>'}
    </div>
    ${footerHtml}
  `;
}

// =================================================================
function renderSearchScreen() {
  const q = state.search.query.trim();
  const keywords = q.split(/[,\s]+/).map(k => k.trim().toLowerCase()).filter(Boolean);

  const TAB_DEFS = [
    { key: 'all', label: 'All' },
    { key: 'sensation', label: 'Sensation' },
    { key: 'timing', label: 'Timing' },
    { key: 'modality', label: 'Modality' },
    { key: 'laterality', label: 'Laterality' },
    { key: 'cause', label: 'Cause' },
    { key: 'sequence', label: 'Sequence' },
    { key: 'content', label: 'Content' }
  ];
  const tabsHtml = TAB_DEFS.map(t => `
    <button class="tab-btn ${state.search.activeTab === t.key ? 'active' : ''}" onclick="onSearchTabChange('${t.key}')">${esc(t.label)}</button>
  `).join('');

  let resultsHtml = '';
  let totalCount = 0;
  let nudgeHtml = '';

  if (keywords.length && state.data.searchIndex) {
    let matches = state.data.searchIndex.filter(r => keywords.every(k => r.searchable.includes(k)));
    if (state.search.activeTab !== 'all') {
      matches = matches.filter(r => r.tags[state.search.activeTab]);
    }
    matches.sort((a, b) => b.remedyCount - a.remedyCount);
    totalCount = matches.length;

    if (totalCount > 150) {
      nudgeHtml = `<div class="search-nudge">This matched a very large number of rubrics (${totalCount}). Try adding when it happens, which side, or what makes it better/worse to narrow this down.</div>`;
    }

    const shown = matches.slice(0, state.search.displayLimit);
    const byChapter = {};
    for (const r of shown) {
      if (!byChapter[r.chapter]) byChapter[r.chapter] = [];
      byChapter[r.chapter].push(r);
    }

    resultsHtml = Object.entries(byChapter).map(([chapter, items]) => `
      <div class="option-group-label" style="margin-top:14px">${esc(chapter)} (${items.length} shown)</div>
      ${items.map(r => {
        const disp = getDisplayText(r.chapter, r.path, r.path.split(',').map(s=>s.trim()).pop());
        return `<div class="opt-card" onclick="onSearchResultPick('${escAttr(r.path)}')">
          ${renderTrilingualBlock(disp)}
          <div class="meta">${r.remedyCount} remedy-references</div>
        </div>`;
      }).join('')}
    `).join('');

    if (state.search.displayLimit < totalCount) {
      resultsHtml += `<div class="show-all-link" onclick="onSearchShowMore()">Showing ${Math.min(state.search.displayLimit, totalCount)} of ${totalCount} — show more</div>`;
    }
  }

  return `
    ${renderTopbar('Search', 'Find a rubric directly, in Kent term, English, or Hindi')}
    <div class="body">
      <button class="back-btn" onclick="onCloseSearch()">&larr; Back</button>
      <input id="globalSearchInput" class="search-box" type="text" placeholder="e.g. pain, morning, right side…" value="${escAttr(state.search.query)}" oninput="onSearchInput(this.value)" autofocus>
      <p class="step-sub">Separate multiple keywords with commas. More keywords narrow the results.</p>
      <div class="search-tabs">${tabsHtml}</div>
      ${nudgeHtml}
      ${!keywords.length ? `<div class="empty-state">Start typing to search across all chapters.</div>` : ''}
      ${keywords.length && !totalCount ? `<div class="empty-state">No rubrics found matching all of: ${esc(keywords.join(', '))}</div>` : ''}
      ${resultsHtml}
    </div>
  `;
}


// =================================================================
function onChapterPick(chapter) {
  state.currentWalk = { pathTokens: [chapter] };
  searchFilter = '';
  showAllOptions = false;
  collapsedGroups = {};
  stopHereLockState = 'unlocked';
  state.editingCaseIndex = null; // starting a chapter fresh is never "editing" a specific existing entry
  state.screen = 'walk';
  render();
}

function onOptionPick(token) {
  state.currentWalk.pathTokens.push(token);
  searchFilter = '';
  showAllOptions = false;
  collapsedGroups = {};
  stopHereLockState = 'unlocked';
  render();
}

function onWalkBack() {
  if (state.currentWalk.pathTokens.length <= 1) {
    state.screen = 'chapters';
    state.editingCaseIndex = null; // abandoning the walk cancels any in-progress edit; original entry is untouched
  } else {
    state.currentWalk.pathTokens.pop();
  }
  searchFilter = '';
  showAllOptions = false;
  collapsedGroups = {};
  stopHereLockState = 'unlocked';
  render();
}

function onEditCaseItem(index) {
  const item = state.completeCase[index];
  state.editingCaseIndex = index;
  state.currentWalk = { pathTokens: item.path.split(',').map(s => s.trim()) };
  searchFilter = '';
  showAllOptions = false;
  collapsedGroups = {};
  stopHereLockState = 'unlocked'; // this rubric is already the current answer for this item — shown armed/ready
  state.screen = 'walk';
  render();
}

function onCancelEdit() {
  state.editingCaseIndex = null;
  caseItemLockState = {};
  state.screen = 'caseReview';
  render();
}

function onSearchFilterChange(val) {
  const inputEl = document.getElementById('walkFilterInput');
  const cursorPos = inputEl ? inputEl.selectionStart : val.length;

  searchFilter = val;
  render();

  const newInputEl = document.getElementById('walkFilterInput');
  if (newInputEl) {
    newInputEl.focus();
    newInputEl.setSelectionRange(cursorPos, cursorPos);
  }
}

function onShowAllOptions() {
  showAllOptions = true;
  render();
}

// The "stop here" card starts unlocked. Tapping it locks the rubric in —
// adds it to the case (or replaces the item being reconsidered, if this is
// a re-entry from the case list) — and never auto-navigates anywhere; the
// patient moves on using the explicit "Add more complaints" / "Continue"
// buttons, whenever they're ready. Tapping a locked card unlocks it again:
// for a fresh pick that just undoes the add (nothing stays half-committed);
// for a reconsidered existing item, the original stays untouched until a
// new lock actually replaces it, so just looking around never loses data.
function onStopHereTap(rubricId, path, remedyCount) {
  if (stopHereLockState === 'unlocked') {
    const entry = { rubricId, path, remedyCount };
    if (state.editingCaseIndex !== null) {
      state.completeCase[state.editingCaseIndex] = entry;
    } else {
      state.completeCase.push(entry);
    }
    stopHereLockState = 'locked';
  } else {
    if (state.editingCaseIndex === null) {
      const idx = state.completeCase.findIndex(e => e.path === path);
      if (idx !== -1) state.completeCase.splice(idx, 1);
    }
    stopHereLockState = 'unlocked';
  }
  render();
}

function onConnectorAccept(connectedChapter) {
  state.connectorQueue.shift();
  state.currentWalk = { pathTokens: [connectedChapter] };
  searchFilter = '';
  showAllOptions = false;
  collapsedGroups = {};
  stopHereLockState = 'unlocked';
  state.screen = 'walk';
  render();
}

function onConnectorSkip() {
  state.connectorQueue.shift();
  if (state.connectorQueue.length) {
    render(); // show next queued suggestion
  } else {
    caseItemLockState = {};
    state.screen = 'caseReview';
    render();
  }
}

function onRemoveCaseItem(index) {
  state.completeCase.splice(index, 1);
  caseItemLockState = {}; // indices shift after removal — start every item fresh-locked rather than risk stale state on the wrong item
  render();
}

// Case review's own 2-tap flow: first tap on a (default-locked) item just
// unlocks it in place ("click to reconsider"), staying on this screen;
// tapping again while in that state is what actually navigates to the
// rubric's origin so it can be reconsidered or replaced.
function onCaseItemTap(index) {
  if (caseItemLockState[index] === 'reconsidering') {
    onEditCaseItem(index);
  } else {
    caseItemLockState[index] = 'reconsidering';
    render();
  }
}

function onAddAnotherComplaint() {
  state.currentWalk = { pathTokens: [] };
  state.editingCaseIndex = null; // adding ANOTHER complaint must never continue editing whichever item was last being reconsidered
  caseItemLockState = {};
  state.screen = 'chapters';
  render();
}

function onOpenSearch() {
  state.returnScreenAfterSearch = state.screen === 'search' ? state.returnScreenAfterSearch : state.screen;
  state.search.query = '';
  state.search.activeTab = 'all';
  state.search.displayLimit = 30;
  state.screen = 'search';
  render();
}

function onCloseSearch() {
  state.screen = state.returnScreenAfterSearch || 'chapters';
  render();
}

function onSearchInput(val) {
  const inputEl = document.getElementById('globalSearchInput');
  const cursorPos = inputEl ? inputEl.selectionStart : val.length;

  state.search.query = val;
  state.search.displayLimit = 30; // reset pagination on every new query
  render();

  const newInputEl = document.getElementById('globalSearchInput');
  if (newInputEl) {
    newInputEl.focus();
    newInputEl.setSelectionRange(cursorPos, cursorPos);
  }
}

function onSearchTabChange(tabKey) {
  state.search.activeTab = tabKey;
  state.search.displayLimit = 30;
  render();
}

function onSearchShowMore() {
  state.search.displayLimit += 30;
  render();
}

// The core of the search-to-tree feature: a chosen rubric's full path becomes
// the walk's pathTokens directly, landing the patient exactly there — the
// exact same rendering logic used for normal click-through browsing then
// takes over from this point on, with no special-casing needed downstream.
function onSearchResultPick(path) {
  const pathTokens = path.split(',').map(s => s.trim());
  state.currentWalk = { pathTokens };
  searchFilter = '';
  showAllOptions = false;
  collapsedGroups = {};
  stopHereLockState = 'unlocked';
  state.screen = 'walk';
  render();
}


const REVIEW_SESSION_MINUTES = 30;
let reviewExpiryChecker = null;

function onReviewSubmittedCase() {
  state.reviewMode = 'postSubmission';
  state.reviewSessionExpiresAt = Date.now() + REVIEW_SESSION_MINUTES * 60 * 1000;
  if (reviewExpiryChecker) clearInterval(reviewExpiryChecker);
  reviewExpiryChecker = setInterval(() => {
    if (state.reviewMode === 'postSubmission' && state.reviewSessionExpiresAt && Date.now() > state.reviewSessionExpiresAt) {
      onReviewSessionExpired();
    }
  }, 15000);
  caseItemLockState = {};
  state.screen = 'caseReview';
  render();
}

function onReviewSessionExpired() {
  if (reviewExpiryChecker) { clearInterval(reviewExpiryChecker); reviewExpiryChecker = null; }
  state.reviewMode = 'normal';
  state.reviewExpiredNotice = true;
  state.screen = 'submitted';
  render();
}

function onDoneReviewingSubmittedCase() {
  if (reviewExpiryChecker) { clearInterval(reviewExpiryChecker); reviewExpiryChecker = null; }
  state.reviewMode = 'normal';
  state.reviewExpiredNotice = false;
  state.screen = 'submitted';
  render();
}

function goToCaseReview() {
  caseItemLockState = {};
  state.screen = 'caseReview';
  render();
}
async function onSubmitCase() {
  state.submit.busy = true;
  state.submit.error = '';
  render();

  const isRevision = !!state.submittedCaseId;
  const { accountBusy, priorGenerals, ...patientForSubmission } = state.patient; // accountBusy is transient UI state; priorGenerals is data carried IN from a past visit, not something a new case should save about itself — neither belongs in the saved record
  const payload = {
    patient: patientForSubmission,
    accessCodeUsed: state.lock.accessCodeUsed,
    complaints: state.completeCase, // includes both complaint- and generals-sourced entries; generals ones carry source:'generals'
    submittedAt: state.submittedAtOriginal || new Date().toISOString(),
  };
  if (isRevision) payload.revisedAt = new Date().toISOString();

  const result = await window.submitCaseToFirebase(payload, state.submittedCaseId);
  state.submit.busy = false;

  if (result.ok) {
    if (!isRevision) {
      state.submittedCaseId = result.caseId;
      state.submittedAtOriginal = payload.submittedAt;
      window.markAccessCodeUsed(state.lock.accessCodeUsed); // first real submission — burn it now, not at unlock
    }
    if (reviewExpiryChecker) { clearInterval(reviewExpiryChecker); reviewExpiryChecker = null; }
    state.reviewMode = 'normal';
    state.reviewExpiredNotice = false;
    if (state.patient.uid) {
      window.saveDraftCase(state.patient.uid, []); // clears the draft — a submitted case is no longer "in progress"
      lastSavedDraftSnapshot = JSON.stringify([]);
    }
    state.screen = 'submitted';
    render();
  } else {
    state.submit.error = result.error || 'Could not submit — please try again.';
    render();
  }
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escAttr(s) {
  return String(s || '').replace(/'/g, "\\'");
}

<script type="module">
  // Same Firebase project and SDK version as questionnaire_prototype.html and
  // admin-panel.html — reusing the exact, already-tested access-code checking
  // logic, plus a new function for writing a completed case.
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, get, update, push, set }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAqzKPqBzNoBJc5FWjnVXMER4prgrbhqag",
    authDomain: "punarvasu-790a8.firebaseapp.com",
    databaseURL: "https://punarvasu-790a8-default-rtdb.firebaseio.com",
    projectId: "punarvasu-790a8",
    storageBucket: "punarvasu-790a8.firebasestorage.app",
    messagingSenderId: "774115339459",
    appId: "1:774115339459:web:4ee1f45e1e25d61666c676"
  };

  const app = initializeApp(firebaseConfig, 'patientIntakeApp');
  const db = getDatabase(app);
  const auth = getAuth(app);

  // Lets the main engine check for an already-signed-in patient without
  // reaching into the raw auth object directly — matches the pattern of
  // every other Firebase-dependent helper on this page being exposed as a
  // small, purpose-built function.
  window.getSignedInPatientUid = function () {
    return auth.currentUser ? auth.currentUser.uid : null;
  };

  // Same phoneIndex/{phone} node the patient portal's own "Lost your link?"
  // recovery already reads — public, no auth required. Returns every
  // {uid, name} registered under that number, since a phone can be shared
  // across a household.
  window.lookupPhoneIndexNames = async function (phone) {
    const snap = await get(ref(db, 'phoneIndex/' + phone));
    if (!snap.exists()) return [];
    const val = snap.val();
    return Object.entries(val).map(([uid, name]) => ({ uid, name }));
  };

  // Creates (or recovers) a patient portal account, using the same
  // synthetic-email/deterministic-password scheme admin-panel.html uses for
  // patients added manually, extended with one important fix: the account is
  // now keyed by PHONE + NAME together, not phone alone. A phone number is
  // very often shared within a household — without the name in the key, a
  // father and daughter using the same number would be silently folded into
  // one account, mixing their symptoms and prescriptions into one casefile.
  // Returns the resulting uid, or null if nothing succeeds — never throws; a
  // null uid just means this case won't be linked to a portal account, the
  // case itself should still submit normally regardless.
  function normalizeNameForEmail(name) {
    return name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '.').replace(/^\.+|\.+$/g, '');
  }

  // Draft autosave — writes to patients/{uid}/draftCase, allowed under the
  // existing rules since the patient is signed in as themselves (auth.uid
  // == uid) by the time this can ever fire. Failures are deliberately
  // silent to the patient: a missed autosave shouldn't interrupt them or
  // look like an error, since final submission is what actually matters.
  window.saveDraftCase = async function (uid, completeCase) {
    try {
      if (!completeCase || completeCase.length === 0) {
        await set(ref(db, 'patients/' + uid + '/draftCase'), null); // nothing to save — clear any stale draft
      } else {
        await set(ref(db, 'patients/' + uid + '/draftCase'), { complaints: completeCase, savedAt: Date.now() });
      }
    } catch (e) {
      console.error('[patient-intake] draft autosave failed:', e);
    }
  };

  window.loadDraftCase = async function (uid) {
    try {
      const snap = await get(ref(db, 'patients/' + uid + '/draftCase'));
      if (!snap.exists()) return null;
      const data = snap.val();
      return (data && data.complaints) || null;
    } catch (e) {
      console.error('[patient-intake] draft load failed:', e);
      return null;
    }
  };

  window.ensurePatientAccount = async function (name, phone) {
    const rawDigits = phone.replace(/[^0-9]/g, '');
    if (!rawDigits) return null;
    const stripped = rawDigits.replace(/^0+/, '');
    const cleanPhone = stripped.slice(-10);
    if (!cleanPhone) return null;
    const normalizedName = normalizeNameForEmail(name);
    if (!normalizedName) return null; // name is required now — it's part of the account's identity, not just a display field

    const canonicalEmail = cleanPhone + '.' + normalizedName + '@punarvasu.clinic';
    const canonicalPass = 'Pun@' + cleanPhone.slice(-6) + 'Cl!';

    // Check the canonical (phone+name) form first — the expected case for a
    // returning patient who already has an account under this scheme.
    try {
      const cred = await signInWithEmailAndPassword(auth, canonicalEmail, canonicalPass);
      const uid = cred.user.uid;
      const existing = await get(ref(db, 'patients/' + uid));
      if (!existing.exists()) {
        await set(ref(db, 'patients/' + uid), { name, phone, email: canonicalEmail, status: 'active', createdAt: Date.now() });
      }
      return uid;
    } catch (e) {
      // not found under the canonical form — fall through
    }

    // Before falling back to the older phone-only legacy scheme, check
    // whether this phone already has exactly one known account under a
    // DIFFERENT name spelling — phoneIndex is public, keyed by uid, and
    // reflects every real account regardless of how the name was typed at
    // creation time (whether typed here, or by the doctor in Admin Panel).
    // Using ITS stored name — not whatever was just typed — to recompute
    // the canonical credentials is what lets this correctly find the
    // ALREADY-EXISTING account, rather than minting a near-duplicate
    // whenever a name gets typed slightly differently. Only when
    // phoneIndex shows more than one distinct account on this phone — a
    // genuinely shared household number — does this step back off and
    // require an exact name match below, since guessing wrong there would
    // risk merging two different real patients' cases together.
    try {
      const phoneIdxSnap = await get(ref(db, 'phoneIndex/' + cleanPhone));
      if (phoneIdxSnap.exists()) {
        const known = phoneIdxSnap.val();
        const knownUids = Object.keys(known);
        if (knownUids.length === 1) {
          const knownNormalized = normalizeNameForEmail(known[knownUids[0]] || '');
          if (knownNormalized) {
            const knownEmail = cleanPhone + '.' + knownNormalized + '@punarvasu.clinic';
            const knownPass = 'Pun@' + cleanPhone.slice(-6) + 'Cl!';
            try {
              const cred = await signInWithEmailAndPassword(auth, knownEmail, knownPass);
              return cred.user.uid;
            } catch (e2) { /* phoneIndex pointed at credentials that don't work — fall through */ }
          }
        }
      }
    } catch (idxErr) {
      console.error('[patient-intake] phoneIndex lookup failed (non-fatal):', idxErr);
    }

    // Safety net for accounts created before either fix above (phone-only key, via
    // admin-panel.html or an earlier version of this form): only treat a
    // legacy match as the SAME person if the name stored on that account
    // also matches. If it doesn't, that phone belongs to someone else
    // entirely — correctly fall through to creating a new, separate account
    // instead of merging this patient into a stranger's casefile.
    const legacyVariants = [...new Set([rawDigits, stripped, cleanPhone])];
    for (const v of legacyVariants) {
      const tryEmail = v + '@punarvasu.clinic';
      const tryPass = 'Pun@' + v.slice(-6) + 'Cl!';
      try {
        const cred = await signInWithEmailAndPassword(auth, tryEmail, tryPass);
        const uid = cred.user.uid;
        const existing = await get(ref(db, 'patients/' + uid));
        const existingNormalized = existing.exists() ? normalizeNameForEmail(existing.val().name || '') : '';
        if (existingNormalized && existingNormalized === normalizedName) {
          return uid; // genuinely the same person under the old scheme
        }
        // Name doesn't match — this legacy account belongs to someone else
        // sharing the phone. Do not reuse it; keep checking other variants,
        // then fall through to creating a new canonical account below.
      } catch (e) {
        // not found under this legacy variant either
      }
    }

    // No match anywhere — create a fresh account under the new canonical
    // (phone+name) key, so future lookups for this exact person stay simple.
    try {
      const cred = await createUserWithEmailAndPassword(auth, canonicalEmail, canonicalPass);
      await set(ref(db, 'patients/' + cred.user.uid), {
        name, phone, email: canonicalEmail, status: 'active', createdAt: Date.now()
      });
      return cred.user.uid;
    } catch (e) {
      if (e.code === 'auth/email-already-in-use') {
        // Rare race condition — e.g. the same patient submitted from two
        // tabs at once. Try signing in to the canonical account one more
        // time, now that it's had a moment to exist.
        try {
          const cred = await signInWithEmailAndPassword(auth, canonicalEmail, canonicalPass);
          return cred.user.uid;
        } catch (e2) {
          console.error('[patient-intake] race-condition recovery failed:', e2);
          return null;
        }
      }
      console.error('[patient-intake] account creation failed:', e);
      return null; // every attempt failed — case still submits, just unlinked from a portal account
    }
  };

  // Validates a code WITHOUT burning it — the code is now marked used only
  // at actual case submission (see markAccessCodeUsed, called from
  // onSubmitCase). Previously this burned the code the instant it was
  // validated, which meant any interruption after unlocking but before
  // submitting — closed browser, lost signal, app crash — permanently
  // locked the patient out of their only working link, even though they'd
  // completed nothing. Since draft progress already autosaves to
  // patients/{uid}/draftCase and reloads on return, the only thing actually
  // stopping a patient from resuming was this premature burn — not lost
  // progress. Delaying the burn to submission fixes that directly: the same
  // link now keeps working, with their in-progress selections intact,
  // right up until they actually submit.
  window.checkAndUseAccessCode = async function (code) {
    try {
      const codeRef = ref(db, 'accessCodes/' + code);
      const snap = await get(codeRef);
      if (!snap.exists()) return { ok: false, reason: 'invalid' };
      const data = snap.val();
      if (data.used === true) return { ok: false, reason: 'used' };
      // Newer codes (generated per-patient from admin-panel.html) carry
      // patientUid + patientName directly on the code record itself — read
      // straight from here, not from patients/{uid}, since that path
      // requires authentication and the patient hasn't signed into
      // anything yet at this point. Older, unlinked codes simply won't
      // have these fields, and the existing ensurePatientAccount flow at
      // submission time covers that case exactly as it did before this change.
      return { ok: true, patientUid: data.patientUid || null, patientName: data.patientName || null };
    } catch (e) {
      console.error('[patient-intake] access code check failed:', e);
      return { ok: false, reason: 'error' };
    }
  };

  // Burns the code — called once, from onSubmitCase(), only on the actual
  // first successful submission (never on a revision resubmit, which reuses
  // an already-submitted case and would otherwise try to burn an
  // already-burned code). Failure here is logged but deliberately
  // non-fatal: the case has already been saved successfully by this point,
  // and a patient should never see their real submission fail over a
  // bookkeeping write.
  window.markAccessCodeUsed = async function (code) {
    if (!code) return;
    try {
      await update(ref(db, 'accessCodes/' + code), { used: true });
    } catch (e) {
      console.error('[patient-intake] marking access code used failed (non-fatal):', e);
    }
  };

  // Read-only "peek" at an access code — checks whether it's linked to a
  // patient WITHOUT marking it used. Called at boot, before the intake
  // screen even renders, so the name can be pre-filled on that very first
  // screen. Deliberately does NOT call update()/mark used — burning the
  // code just from the page loading (e.g. if WhatsApp's own link-preview
  // crawler fetches the URL before the patient ever taps it) would lock
  // them out before they've done anything.
  window.peekAccessCodePatient = async function (code) {
    try {
      const snap = await get(ref(db, 'accessCodes/' + code));
      if (!snap.exists()) return null;
      const data = snap.val();
      if (data.used === true) return null; // don't reveal info about an already-used code
      if (!data.patientUid) return null;
      return { uid: data.patientUid, name: data.patientName || null, priorGenerals: data.priorGenerals || null };
    } catch (e) {
      console.error('[patient-intake] access code peek failed:', e);
      return null;
    }
  };

  // Writes the completed case to /cases — a new push() node on first
  // submission. On any later revision, whatever is CURRENTLY on file gets
  // archived to cases/{caseId}/revisions/{pushId} first (so nothing is ever
  // lost — the doctor asked to keep every version, not just the latest),
  // and only then does cases/{caseId} itself get overwritten with the new
  // data. NOTE: this needs the Firebase security rules extended — both to
  // allow overwriting cases/{caseId} when the access code matches, and to
  // allow a brand-new entry under revisions/ under the same condition —
  // or this will fail at the Firebase layer even though this code is correct.
  window.submitCaseToFirebase = async function (payload, existingCaseId) {
    try {
      if (existingCaseId) {
        const caseRef = ref(db, 'cases/' + existingCaseId);
        const currentSnap = await get(caseRef);
        if (currentSnap.exists()) {
          const { revisions, ...dataToArchive } = currentSnap.val(); // never nest the revision trail inside itself
          const archiveRef = push(ref(db, 'cases/' + existingCaseId + '/revisions'));
          await set(archiveRef, { ...dataToArchive, archivedAt: new Date().toISOString() });
        }
        await update(caseRef, payload); // update(), not set() — set() would replace the whole node and destroy the revisions child just written above
        return { ok: true, caseId: existingCaseId };
      } else {
        const newCaseRef = push(ref(db, 'cases'));
        await set(newCaseRef, payload);
        return { ok: true, caseId: newCaseRef.key };
      }
    } catch (e) {
      console.error('[patient-intake] case submission failed:', e);
      return { ok: false, error: e.message };
    }
  };

// Generals walk functions are defined in the main script above and are
// already globally accessible — no window assignment needed here.
</script>
</body>
