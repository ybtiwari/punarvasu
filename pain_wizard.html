<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pain Guide — Punarvasu Clinic</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#1C6B5A;--teal2:#2E7D32;--amber:#C8600A;--amber-bg:#FDF3E8;
  --ink:#1a1a1a;--ink2:#444;--ink3:#888;
  --border:#e0e0e0;--white:#fff;--cream:#f7f5f0;--bg:#f2f0eb;
  --success:#2E7D32;--danger:#c0392b;
  --font:'Source Sans 3','Noto Sans Devanagari',system-ui,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--white);display:flex;flex-direction:column}

/* Top bar */
.topbar{background:var(--teal);color:white;padding:12px 16px;flex-shrink:0}
.topbar h1{font-size:16px;font-weight:600}
.topbar span{font-size:11.5px;opacity:.8;display:block;margin-top:2px}

/* Progress */
.progress-bar{display:flex;gap:5px;padding:12px 16px 0;flex-shrink:0}
.progress-dot{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background .2s}
.progress-dot.done{background:var(--teal);opacity:.4}
.progress-dot.active{background:var(--teal)}

/* Screen header */
.screen-head{padding:16px 16px 0}
.back-btn{font-size:13px;font-weight:600;color:var(--teal);background:none;border:none;cursor:pointer;padding:0 0 10px;display:block}
.screen-q{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:4px;line-height:1.35}
.screen-q-hi{display:block;font-size:13px;font-weight:400;color:var(--ink2);margin-bottom:8px}
.screen-hint{font-size:12px;color:var(--ink3);margin-bottom:14px;line-height:1.5}

/* Scroll area */
.scroll{flex:1;overflow-y:auto;padding:0 16px 80px}

/* Chapter grid */
.ch-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:2px}
.ch-card{border:1.5px solid var(--border);border-radius:10px;padding:11px 10px;cursor:pointer;background:var(--white);transition:all .12s;text-align:center}
.ch-card.sel{border-color:var(--amber);background:var(--amber-bg)}
.ch-card:active{transform:scale(.97)}
.ch-icon{font-size:22px;margin-bottom:5px}
.ch-en{display:block;font-size:12px;font-weight:600;color:var(--ink)}
.ch-hi{display:block;font-size:11px;color:var(--ink3);margin-top:1px}
.ch-card.sel .ch-en{color:var(--amber)}

/* Option chips (sub-location, timing, better/worse) */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px}
.chip{padding:9px 14px;background:var(--white);border:1.5px solid var(--border);border-radius:20px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none;transition:all .12s;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.chip.sel{background:var(--teal);border-color:var(--teal);color:white}
.chip.sel .chip-hi{color:rgba(255,255,255,.8)}
.chip:active{transform:scale(.97)}
.chip-en{font-size:13px;font-weight:500}
.chip-hi{font-size:11.5px;color:var(--ink3)}

/* Pain type grid */
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:4px}
.type-card{border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--white);transition:all .12s}
.type-card.sel{border-color:var(--teal);background:#F0F7F4}
.type-card:active{transform:scale(.97)}
.type-en{font-size:13px;font-weight:500;color:var(--ink);line-height:1.35}
.type-hi{font-size:11.5px;color:var(--ink3);margin-top:2px}
.type-kent{font-size:10px;color:var(--ink3);margin-top:4px;font-style:italic}
.type-card.sel .type-en{color:var(--teal);font-weight:600}

/* Better/Worse */
.bw-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.bw-col label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.bw-col.better label{color:var(--success)}
.bw-col.worse  label{color:var(--danger)}
.bw-chip{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:12.5px;cursor:pointer;margin-bottom:6px;background:var(--white);user-select:none;transition:all .12s}
.bw-chip.sel.better-sel{border-color:var(--success);background:#E8F5E9;color:var(--success)}
.bw-chip.sel.worse-sel{border-color:var(--danger);background:#fdecea;color:var(--danger)}

/* Footer bar */
.footer-bar{position:sticky;bottom:0;background:white;border-top:1px solid var(--border);padding:10px 16px;display:flex;gap:10px;flex-shrink:0}
.btn-skip{background:none;border:1.5px solid var(--border);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.btn-next{background:var(--teal);color:white;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;flex:1}
.btn-next:disabled{opacity:.4;cursor:default}

/* Result / Review */
.result-card{border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;position:relative}
.result-card.sel{border-color:var(--teal);background:#F0F7F4}
.result-ch{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--amber);margin-bottom:4px}
.result-en{font-size:13px;color:var(--ink);line-height:1.4}
.result-hi{font-size:12px;color:var(--ink3);margin-top:2px}
.result-path{font-size:10.5px;color:var(--ink3);margin-top:4px;font-style:italic}
.result-chk{position:absolute;top:10px;right:10px;width:20px;height:20px;border:1.5px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;color:transparent}
.result-card.sel .result-chk{background:var(--teal);border-color:var(--teal);color:white}

/* Loading / Done */
.center-wrap{text-align:center;padding:60px 20px}
.big-icon{font-size:44px;margin-bottom:14px}
.big-title{font-size:18px;font-weight:600;color:var(--teal)}
.big-sub{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.6}
.load-bar{width:220px;height:4px;background:var(--border);border-radius:2px;margin:16px auto 0;overflow:hidden}
.load-anim{height:100%;background:var(--teal);border-radius:2px;animation:la 2s ease-in-out infinite}
@keyframes la{0%{width:0%}50%{width:75%}100%{width:100%}}
.no-result{text-align:center;padding:30px 0;font-size:13px;color:var(--ink3)}
.btn-primary{background:var(--teal);color:white;border:none;border-radius:8px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;width:100%}
.btn-outline{background:none;border:1.5px solid var(--border);border-radius:8px;padding:10px 16px;font-size:13px;color:var(--ink2);cursor:pointer;width:100%}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>🩹 Pain Symptom Guide</h1>
    <span>दर्द विवरण सहायक — Punarvasu Clinic</span>
  </div>
  <div class="progress-bar" id="progressBar"></div>
  <div class="screen-head" id="screenHead"></div>
  <div class="scroll"  id="scrollArea"></div>
  <div class="footer-bar" id="footerBar"></div>
</div>
<script>
// ─────────────────────────────────────────────
// DATA & STATE
// ─────────────────────────────────────────────
let ALL_RUBRICS = [];
let loadState   = 'idle';

// Wizard state
let step = 0;          // 0=loading, 1=chapter, 2=subloc, 3=type, 4=timing, 5=bw, 6=results, 7=done
let wChapters   = [];  // selected chapter ids (multi)
let wSubLoc     = null; // {kent, label} | null = skip
let wPainType   = null; // {kent, en, hi} | null = skip
let wTiming     = null; // kent string | null
let wBetter     = [];   // kent strings
let wWorse      = [];   // kent strings
let wResults    = [];   // rubric objects found
let wSelected   = new Set(); // paths to commit

const CHAPTERS = [
  {id:'head',               kent:'Head',                en:'Head',                    hi:'सिर',              icon:'🧠'},
  {id:'face',               kent:'Face',                en:'Face',                    hi:'चेहरा',             icon:'😶'},
  {id:'eye',                kent:'Eye',                 en:'Eye',                     hi:'आँख',               icon:'👁️'},
  {id:'ear',                kent:'Ear',                 en:'Ear',                     hi:'कान',               icon:'👂'},
  {id:'nose',               kent:'Nose',                en:'Nose',                    hi:'नाक',               icon:'👃'},
  {id:'mouth',              kent:'Mouth',               en:'Mouth',                   hi:'मुंह',               icon:'👄'},
  {id:'teeth',              kent:'Teeth',               en:'Teeth',                   hi:'दाँत',               icon:'🦷'},
  {id:'throat',             kent:'Throat',              en:'Throat (inside)',         hi:'गला (भीतर)',        icon:'👅'},
  {id:'external-throat',   kent:'External throat',     en:'Throat (outside)',        hi:'गला (बाहर)',        icon:'🧣'},
  {id:'larynx-and-trachea',kent:'Larynx and trachea',  en:'Voice box & windpipe',   hi:'स्वरयंत्र',          icon:'🫁'},
  {id:'chest',              kent:'Chest',               en:'Chest',                   hi:'छाती',               icon:'🫀'},
  {id:'heart-and-circulation',kent:'Heart & Circulation',en:'Heart',                 hi:'हृदय',               icon:'❤️'},
  {id:'respiration',        kent:'Respiration',         en:'Breathing',               hi:'श्वास',              icon:'💨'},
  {id:'cough',              kent:'Cough',               en:'Cough',                   hi:'खांसी',              icon:'😮‍💨'},
  {id:'stomach',            kent:'Stomach',             en:'Stomach',                 hi:'पेट',                icon:'🩷'},
  {id:'abdomen',            kent:'Abdomen',             en:'Abdomen',                 hi:'उदर',                icon:'🫃'},
  {id:'rectum',             kent:'Rectum',              en:'Anus & Rectum',           hi:'गुदा और मलाशय',     icon:'🔴'},
  {id:'appetite',           kent:'Appetite',            en:'Appetite',                hi:'भूख',                icon:'🍽️'},
  {id:'back',               kent:'Back',                en:'Back',                    hi:'पीठ',                icon:'🦴'},
  {id:'extremities',        kent:'Extremities',         en:'Arms & Legs',             hi:'हाथ-पैर',           icon:'💪🦵'},
  {id:'skin',               kent:'Skin',                en:'Skin',                    hi:'त्वचा',              icon:'🟫'},
  {id:'bladder',            kent:'Bladder',             en:'Bladder',                 hi:'मूत्राशय',           icon:'🟡'},
  {id:'kidneys',            kent:'Kidneys',             en:'Kidneys',                 hi:'किडनी',              icon:'🫘'},
  {id:'urethra',            kent:'Urethra',             en:'Urine pipe',              hi:'मूत्रमार्ग',         icon:'➰'},
  {id:'prostate-gland',    kent:'Prostate gland',      en:'Prostate',                hi:'प्रोस्टेट',          icon:'⚪'},
  {id:'genitalia-female',  kent:'Genitalia female',    en:'Female genitalia',        hi:'महिला जननांग',      icon:'♀️'},
  {id:'genitalia-male',    kent:'Genitalia male',      en:'Male genitalia',          hi:'पुरुष जननांग',      icon:'♂️'},
  {id:'mind',               kent:'Mind',                en:'Mind',                    hi:'मन',                 icon:'🧘'},
  {id:'fever',              kent:'Fever',               en:'Fever',                   hi:'बुखार',              icon:'🌡️'},
  {id:'chill',              kent:'Chill',               en:'Chill',                   hi:'ठंड',                icon:'⚡'},
  {id:'sleep',              kent:'Sleep',               en:'Sleep',                   hi:'नींद',                icon:'🌙'},
  {id:'vertigo',            kent:'Vertigo',             en:'Dizziness',               hi:'चक्कर',              icon:'💫'},
  {id:'generalities',      kent:'Generalities',        en:'Whole-body',              hi:'सामान्य',            icon:'🌐'},
];

// Pain type map — plain English → Kent term
const PAIN_TYPES = [
  {en:'Stabbing / needle-like',hi:'चुभन जैसा (सुई जैसा)',    kent:'stitching'},
  {en:'Tearing / ripping',     hi:'फाड़ने जैसा दर्द',          kent:'tearing'},
  {en:'Heavy / pressing down', hi:'भारीपन / दबाव जैसा',        kent:'pressing'},
  {en:'Burning / hot sensation',hi:'जलन / गर्माहट',             kent:'burning'},
  {en:'Pulling / drawing',     hi:'खिंचाव जैसा दर्द',           kent:'drawing'},
  {en:'Dull constant ache',    hi:'हल्का लगातार दर्द',          kent:'aching'},
  {en:'Cramping / gripping',   hi:'मरोड़ / ऐंठन',              kent:'cramping'},
  {en:'Sore / bruised feeling',hi:'चोट जैसा दर्द',             kent:'sore'},
  {en:'Throbbing / beating',   hi:'धड़कन जैसा दर्द',            kent:'pulsating'},
  {en:'Shooting / electric',   hi:'बिजली जैसा झटका',           kent:'shooting'},
];

const TIMING_MAP = [
  {en:'In the morning',        hi:'सुबह के समय',               kent:'morning'},
  {en:'In the evening',        hi:'शाम के समय',                kent:'evening'},
  {en:'At night',              hi:'रात के समय',                kent:'night'},
  {en:'After eating',          hi:'खाने के बाद',                kent:'eating, after'},
  {en:'During periods',        hi:'मासिक धर्म के दौरान',         kent:'menses, during'},
  {en:'On movement',           hi:'हिलने-डुलने पर',             kent:'motion'},
  {en:'Constantly',            hi:'हर समय',                   kent:'constant'},
  {en:'No clear pattern',      hi:'कोई निश्चित समय नहीं',       kent:null},
];

const BETTER_FROM = [
  {en:'Warmth / hot things',   hi:'गर्माहट से',                kent:'warmth, amel.'},
  {en:'Cold / cool things',    hi:'ठंडक से',                  kent:'cold, amel.'},
  {en:'Pressure / rubbing',    hi:'दबाव / मालिश से',            kent:'pressure, amel.'},
  {en:'Lying down',            hi:'लेटने से',                  kent:'lying, amel.'},
  {en:'Movement / walking',    hi:'हिलने-डुलने से',             kent:'motion, amel.'},
  {en:'Rest / keeping still',  hi:'आराम करने से',              kent:'rest, amel.'},
];
const WORSE_FROM = [
  {en:'Warmth / hot things',   hi:'गर्माहट से',                kent:'warmth, agg.'},
  {en:'Cold / cool things',    hi:'ठंडक से',                  kent:'cold, agg.'},
  {en:'Pressure / touch',      hi:'दबाव / छूने से',            kent:'pressure, agg.'},
  {en:'Lying down',            hi:'लेटने से',                  kent:'lying, agg.'},
  {en:'Movement / walking',    hi:'हिलने-डुलने से',             kent:'motion, agg.'},
  {en:'Touch',                 hi:'छूने से',                  kent:'touch, agg.'},
];

// Terms that are pain TYPES — not sub-locations
const TYPE_KENTS = new Set([
  'stitching','tearing','pressing','burning','drawing','aching','cramping','sore','pulsating',
  'shooting','gnawing','boring','lancinating','burrowing','bursting','rawness','stinging',
  'pinching','digging','lacerating','wrenching','jerking','rending','constricting','sprained',
  'throbbing','sharp','dull','violent','dragging','pressive','paralytic','ulcerative','corrosive',
  'cutting','cutting (sudden sharp pain)','stunning','neuralgic','screwing','twinging','racking',
  'distending','colicky','smarting','compressing','gripping','explosive','lightning like',
  'splinter like','bruised','soreness','pressive','twisting','rending','excruciating',
]);
const TIMING_KENTS = new Set([
  'morning','night','evening','afternoon','forenoon','midnight','noon','daytime','constant',
  'periodical','alternating','intermittent','sudden','paroxysmal','menses','eating','motion',
  'waking','sleeping','dinner','breakfast','before','after','then','succession',
]);
const MODALITY_KENTS = new Set([
  'cold','warmth','heat','pressure','touch','motion','rest','lying','sitting','cold air',
  'warm room','uncovering','exertion','agg.','amel.',
]);

function isSubLocation(seg) {
  const s = seg.trim().toLowerCase();
  return !TYPE_KENTS.has(s) && !TIMING_KENTS.has(s) && !MODALITY_KENTS.has(s) &&
         s !== 'left' && s !== 'right' && s !== 'both' && s !== 'sides' &&
         !s.endsWith('agg.') && !s.endsWith('amel.') && !s.includes('agg.') && !s.includes('amel.');
}

// Patient-friendly labels for common sub-location segments
const LOC_LABELS = {
  'occiput':'Back of head (occiput)','forehead':'Forehead','temples':'Temples',
  'vertex':'Top of head (vertex)','lumbar region':'Lower back (lumbar)',
  'dorsal region':'Upper back (dorsal)','cervical region':'Neck / upper spine',
  'sacral region':'Tailbone area (sacrum)','hypochondria':'Under the ribs (hypochondria)',
  'umbilicus':'Around navel (umbilicus)','hypogastrium':'Lower abdomen',
  'inguinal region':'Groin area (inguinal)','lower limbs':'Lower limbs',
  'upper limbs':'Upper limbs','leg':'Leg (lower)','foot':'Foot','knee':'Knee',
  'thigh':'Thigh','hip':'Hip','shoulder':'Shoulder','elbow':'Elbow','wrist':'Wrist',
  'fingers':'Fingers','toes':'Toes','sternum':'Breastbone (sternum)',
  'mammae':'Breast','heart region':'Heart area','nipples':'Nipples',
  'axilla':'Armpit','iliac region':'Hip/iliac area',
  'sides':'Sides','left':'Left side','right':'Right side',
};
function locLabel(kent) { return LOC_LABELS[kent.toLowerCase()] || (kent.charAt(0).toUpperCase() + kent.slice(1)); }

// ─────────────────────────────────────────────
// DATA LOADING
// ─────────────────────────────────────────────
async function loadData() {
  step = 0; render();
  try {
    const [r1, r2] = await Promise.all([fetch('all_rubrics_1.json'), fetch('all_rubrics_2.json')]);
    if (!r1.ok || !r2.ok) throw new Error('JSON files not found');
    const [p1, p2] = await Promise.all([r1.json(), r2.json()]);
    ALL_RUBRICS = p1.concat(p2);
    loadState = 'loaded';
    step = 1; render();
  } catch(e) {
    loadState = 'error'; render();
    console.error(e);
  }
}

// ─────────────────────────────────────────────
// SMART DATA QUERIES
// ─────────────────────────────────────────────
function getSubLocations(chIds) {
  const locs = {};
  for (const chId of chIds) {
    const ch = CHAPTERS.find(c => c.id === chId);
    if (!ch) continue;
    const prefix = ch.kent + ', pain,';
    for (const r of ALL_RUBRICS) {
      if (r.chapterId !== chId) continue;
      if (!r.path.startsWith(prefix)) continue;
      const segs = r.path.split(',').map(s => s.trim());
      if (segs.length < 3) continue;
      const seg2 = segs[2];
      if (isSubLocation(seg2)) locs[seg2] = (locs[seg2] || 0) + 1;
    }
  }
  return Object.entries(locs).sort((a,b) => b[1]-a[1]).slice(0, 15).map(([k]) => k);
}

function getAvailableTypes(chIds, subLocKent) {
  const found = new Set();
  for (const chId of chIds) {
    const ch = CHAPTERS.find(c => c.id === chId);
    if (!ch) continue;
    for (const pt of PAIN_TYPES) {
      const paths = [
        `${ch.kent}, pain, ${pt.kent}`,
        subLocKent ? `${ch.kent}, pain, ${subLocKent}, ${pt.kent}` : null,
        subLocKent ? `${ch.kent}, pain, ${pt.kent}, ${subLocKent}` : null,
      ].filter(Boolean);
      const hasIt = paths.some(p => ALL_RUBRICS.some(r =>
        r.path.toLowerCase() === p.toLowerCase() ||
        r.path.toLowerCase().startsWith(p.toLowerCase() + ',')
      ));
      if (hasIt) found.add(pt.kent);
    }
  }
  return PAIN_TYPES.filter(pt => found.has(pt.kent));
}

function getAvailableTiming(chIds, subLocKent, typeKent) {
  const found = new Set();
  for (const chId of chIds) {
    const ch = CHAPTERS.find(c => c.id === chId);
    if (!ch) continue;
    for (const t of TIMING_MAP) {
      if (!t.kent) { found.add('__none__'); continue; }
      const paths = [
        `${ch.kent}, pain, ${t.kent}`,
        typeKent     ? `${ch.kent}, pain, ${typeKent}, ${t.kent}` : null,
        subLocKent   ? `${ch.kent}, pain, ${subLocKent}, ${t.kent}` : null,
        typeKent && subLocKent ? `${ch.kent}, pain, ${subLocKent}, ${typeKent}, ${t.kent}` : null,
        typeKent && subLocKent ? `${ch.kent}, pain, ${typeKent}, ${subLocKent}, ${t.kent}` : null,
      ].filter(Boolean);
      if (paths.some(p => ALL_RUBRICS.some(r =>
        r.path.toLowerCase() === p.toLowerCase() ||
        r.path.toLowerCase().startsWith(p.toLowerCase() + ',')
      ))) found.add(t.kent);
    }
  }
  return TIMING_MAP.filter(t => !t.kent || found.has(t.kent));
}

function getAvailableBW(chIds, subLocKent, typeKent, timingKent) {
  const betterFound = new Set(), worseFound = new Set();
  for (const chId of chIds) {
    const ch = CHAPTERS.find(c => c.id === chId);
    if (!ch) continue;
    for (const m of [...BETTER_FROM, ...WORSE_FROM]) {
      const isBetter = m.kent.includes('amel');
      const paths = [
        `${ch.kent}, pain, ${m.kent}`,
        typeKent ? `${ch.kent}, pain, ${typeKent}, ${m.kent}` : null,
      ].filter(Boolean);
      if (paths.some(p => ALL_RUBRICS.some(r =>
        r.path.toLowerCase() === p.toLowerCase() ||
        r.path.toLowerCase().startsWith(p.toLowerCase() + ',')
      ))) {
        if (isBetter) betterFound.add(m.kent); else worseFound.add(m.kent);
      }
    }
  }
  return {
    better: BETTER_FROM.filter(m => betterFound.has(m.kent)),
    worse:  WORSE_FROM.filter(m => worseFound.has(m.kent)),
  };
}

// ─────────────────────────────────────────────
// RUBRIC ASSEMBLY
// ─────────────────────────────────────────────
function assembleRubrics() {
  const found = [];
  const seen = new Set();
  function tryAdd(path) {
    const r = ALL_RUBRICS.find(r => r.path.toLowerCase() === path.toLowerCase());
    if (r && !seen.has(r.path)) { found.push(r); seen.add(r.path); }
  }
  function tryPrefix(prefix) {
    // If exact path doesn't exist, try to find the rubric whose path most closely matches
    // (it might be one level shallower)
    if (!ALL_RUBRICS.some(r => r.path.toLowerCase() === prefix.toLowerCase())) {
      // Try without last segment
      const shorter = prefix.split(',').slice(0,-1).join(',').trim();
      if (shorter) tryAdd(shorter);
    } else {
      tryAdd(prefix);
    }
  }

  const sl = wSubLoc ? wSubLoc.kent : null;
  const pt = wPainType ? wPainType.kent : null;
  const ti = wTiming;

  for (const chId of wChapters) {
    const ch = CHAPTERS.find(c => c.id === chId);
    if (!ch) continue;
    const kc = ch.kent;

    // Most specific combinations first
    if (pt && sl && ti) {
      tryAdd(`${kc}, pain, ${pt}, ${sl}, ${ti}`);
      tryAdd(`${kc}, pain, ${sl}, ${pt}, ${ti}`);
      tryAdd(`${kc}, pain, ${pt}, ${ti}, ${sl}`);
    }
    if (pt && sl) {
      tryAdd(`${kc}, pain, ${pt}, ${sl}`);
      tryAdd(`${kc}, pain, ${sl}, ${pt}`);
    }
    if (pt && ti) tryAdd(`${kc}, pain, ${pt}, ${ti}`);
    if (sl && ti) tryAdd(`${kc}, pain, ${sl}, ${ti}`);
    if (pt)  tryAdd(`${kc}, pain, ${pt}`);
    if (sl)  tryAdd(`${kc}, pain, ${sl}`);
    if (ti)  tryAdd(`${kc}, pain, ${ti}`);

    // Modalities
    for (const bk of wBetter) {
      if (pt) tryAdd(`${kc}, pain, ${pt}, ${bk}`);
      tryAdd(`${kc}, pain, ${bk}`);
    }
    for (const wk of wWorse) {
      if (pt) tryAdd(`${kc}, pain, ${pt}, ${wk}`);
      tryAdd(`${kc}, pain, ${wk}`);
    }

    // Fallback to root pain rubric
    if (!found.some(r => r.chapterId === chId)) tryAdd(`${kc}, pain`);
  }

  return found;
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderProgress() {
  const bar = document.getElementById('progressBar');
  if (step <= 1 || step >= 6) { bar.innerHTML = ''; return; }
  const totalSteps = 5;
  bar.innerHTML = Array.from({length:totalSteps}, (_,i) => {
    const s = i+1;
    const cls = s < step ? 'done' : s === step ? 'active' : '';
    return `<div class="progress-dot ${cls}"></div>`;
  }).join('');
}

function render() {
  renderProgress();
  const head = document.getElementById('screenHead');
  const area = document.getElementById('scrollArea');
  const foot = document.getElementById('footerBar');

  // ── Loading ──
  if (step === 0) {
    head.innerHTML = ''; foot.innerHTML = '';
    area.innerHTML = `<div class="center-wrap">
      <div class="big-icon">🩹</div>
      <div class="big-title">Pain Symptom Guide</div>
      <div class="big-sub" style="margin-top:6px;">दर्द विवरण सहायक</div>
      <div class="load-bar"><div class="load-anim"></div></div>
      <div style="font-size:12.5px;color:var(--ink3);margin-top:10px;">
        ${loadState==='error' ? '⚠️ Could not load rubric data.<br>Make sure all_rubrics_1.json and all_rubrics_2.json are in the same folder.' : 'Loading Kent\'s Repertory…'}
      </div>
    </div>`;
    return;
  }

  // ── Step 1: Chapter ──
  if (step === 1) {
    const hasPainCh = new Set();
    for (const r of ALL_RUBRICS) {
      if (r.path.split(',').map(s=>s.trim().toLowerCase()).includes('pain'))
        hasPainCh.add(r.chapterId);
    }
    const chs = CHAPTERS.filter(c => hasPainCh.has(c.id));

    head.innerHTML = `<p class="screen-q">Where does it hurt?</p>
      <span class="screen-q-hi">दर्द कहाँ है?</span>
      <p class="screen-hint">You can select more than one body part. · एक से ज़्यादा हिस्से चुन सकते हैं।</p>`;

    area.innerHTML = `<div class="ch-grid">
      ${chs.map(c => `
        <div class="ch-card ${wChapters.includes(c.id)?'sel':''}" data-ch="${esc(c.id)}">
          <div class="ch-icon">${c.icon}</div>
          <span class="ch-en">${esc(c.en)}</span>
          <span class="ch-hi">${esc(c.hi)}</span>
        </div>`).join('')}
    </div>`;

    foot.innerHTML = `
      <button class="btn-next" id="nextBtn" ${!wChapters.length?'disabled':''}>
        Next: Where exactly? →
      </button>`;
    return;
  }

  // ── Step 2: Sub-location ──
  if (step === 2) {
    const locs = getSubLocations(wChapters);
    const chNames = wChapters.map(id => CHAPTERS.find(c=>c.id===id)?.en || id).join(', ');

    head.innerHTML = `<button class="back-btn" id="backBtn">← Back</button>
      <p class="screen-q">Where exactly in your ${esc(chNames)}?</p>
      <span class="screen-q-hi">${esc(chNames)} में ठीक कहाँ?</span>
      <p class="screen-hint">Select the specific area. Tap "Not sure / whole area" if unsure.</p>`;

    const allOption = `<div class="chip ${!wSubLoc?'sel':''}" data-loc="__none__">
      <span class="chip-en">Whole area / not sure</span>
      <span class="chip-hi">पूरे हिस्से में / निश्चित नहीं</span>
    </div>`;

    area.innerHTML = `<div class="chips">
      ${allOption}
      ${locs.map(k => `
        <div class="chip ${wSubLoc&&wSubLoc.kent===k?'sel':''}" data-loc="${esc(k)}">
          <span class="chip-en">${esc(locLabel(k))}</span>
          <span class="chip-hi">${esc(k)}</span>
        </div>`).join('')}
    </div>
    ${!locs.length ? '<div class="no-result">No sub-locations found — tap "Whole area" to continue.</div>' : ''}`;

    foot.innerHTML = `<button class="btn-skip" id="skipBtn">Skip →</button>
      <button class="btn-next" id="nextBtn">Next: Feel of pain →</button>`;
    return;
  }

  // ── Step 3: Pain type ──
  if (step === 3) {
    const sl = wSubLoc ? wSubLoc.kent : null;
    const types = getAvailableTypes(wChapters, sl);

    head.innerHTML = `<button class="back-btn" id="backBtn">← Back</button>
      <p class="screen-q">What does it feel like?</p>
      <span class="screen-q-hi">दर्द कैसा महसूस होता है?</span>
      <p class="screen-hint">Choose the description that fits best.</p>`;

    area.innerHTML = `<div class="type-grid">
      ${types.map(pt => `
        <div class="type-card ${wPainType&&wPainType.kent===pt.kent?'sel':''}" data-type="${esc(pt.kent)}">
          <div class="type-en">${esc(pt.en)}</div>
          <div class="type-hi">${esc(pt.hi)}</div>
          <div class="type-kent">(Kent: ${esc(pt.kent)})</div>
        </div>`).join('')}
    </div>
    ${!types.length ? '<div class="no-result">No specific pain types found in Kent for this selection.</div>' : ''}`;

    foot.innerHTML = `<button class="btn-skip" id="skipBtn">Skip →</button>
      <button class="btn-next" id="nextBtn">Next: When? →</button>`;
    return;
  }

  // ── Step 4: Timing ──
  if (step === 4) {
    const sl = wSubLoc ? wSubLoc.kent : null;
    const pt = wPainType ? wPainType.kent : null;
    const timings = getAvailableTiming(wChapters, sl, pt);

    head.innerHTML = `<button class="back-btn" id="backBtn">← Back</button>
      <p class="screen-q">When does it mainly happen?</p>
      <span class="screen-q-hi">दर्द मुख्यतः कब होता है?</span>
      <p class="screen-hint">Choose one, or tap "No clear pattern".</p>`;

    area.innerHTML = `<div class="chips">
      ${timings.map(t => `
        <div class="chip ${wTiming===(t.kent||'__none__')?'sel':''}" data-timing="${esc(t.kent||'__none__')}">
          <span class="chip-en">${esc(t.en)}</span>
          <span class="chip-hi">${esc(t.hi)}</span>
        </div>`).join('')}
    </div>
    ${!timings.length ? '<div class="no-result">No timing sub-rubrics found for this selection.</div>' : ''}`;

    foot.innerHTML = `<button class="btn-skip" id="skipBtn">Skip →</button>
      <button class="btn-next" id="nextBtn">Next: Better / Worse →</button>`;
    return;
  }

  // ── Step 5: Better / Worse ──
  if (step === 5) {
    const sl = wSubLoc ? wSubLoc.kent : null;
    const pt = wPainType ? wPainType.kent : null;
    const bw = getAvailableBW(wChapters, sl, pt, wTiming);

    head.innerHTML = `<button class="back-btn" id="backBtn">← Back</button>
      <p class="screen-q">What makes it better or worse?</p>
      <span class="screen-q-hi">किससे आराम या बढ़ोतरी होती है?</span>
      <p class="screen-hint">Select all that apply in both columns.</p>`;

    area.innerHTML = `<div class="bw-grid">
      <div class="bw-col better">
        <label>✓ Better from · आराम</label>
        ${bw.better.map(m => `
          <div class="bw-chip ${wBetter.includes(m.kent)?'sel better-sel':''}" data-better="${esc(m.kent)}">
            ${esc(m.en)}<br><small style="opacity:.7">${esc(m.hi)}</small>
          </div>`).join('')}
        ${!bw.better.length ? '<div style="font-size:12px;color:var(--ink3)">None found</div>' : ''}
      </div>
      <div class="bw-col worse">
        <label>✗ Worse from · बढ़ोतरी</label>
        ${bw.worse.map(m => `
          <div class="bw-chip ${wWorse.includes(m.kent)?'sel worse-sel':''}" data-worse="${esc(m.kent)}">
            ${esc(m.en)}<br><small style="opacity:.7">${esc(m.hi)}</small>
          </div>`).join('')}
        ${!bw.worse.length ? '<div style="font-size:12px;color:var(--ink3)">None found</div>' : ''}
      </div>
    </div>`;

    foot.innerHTML = `<button class="btn-skip" id="skipBtn">Skip →</button>
      <button class="btn-next" id="nextBtn">Find rubrics →</button>`;
    return;
  }

  // ── Step 6: Results ──
  if (step === 6) {
    head.innerHTML = `<button class="back-btn" id="backBtn">← Back</button>
      <p class="screen-q">Matching rubrics found</p>
      <span class="screen-q-hi">मिले हुए रूब्रिक्स</span>
      <p class="screen-hint">Every rubric below exists in Kent's Repertory and has at least one remedy. Tap to select the ones that match your pain.</p>`;

    const rubrics = wResults;

    if (!rubrics.length) {
      area.innerHTML = `<div class="center-wrap">
        <div class="big-icon">🔍</div>
        <div style="font-size:14px;font-weight:600;">No exact match found</div>
        <div style="font-size:12.5px;color:var(--ink3);margin-top:8px;">कोई सटीक रूब्रिक नहीं मिला।<br>Try going back and changing some selections.</div>
        <button class="btn-outline" id="backBtn2" style="margin-top:20px;">← Try again</button>
      </div>`;
    } else {
      area.innerHTML = rubrics.map(r => {
        const ch = CHAPTERS.find(c => c.id === r.chapterId);
        const sel = wSelected.has(r.path);
        return `<div class="result-card ${sel?'sel':''}" data-rpath="${esc(r.path)}">
          <div class="result-ch">${ch ? ch.icon + ' ' + ch.en + ' · ' + (ch.hi||'') : r.chapterId}</div>
          <div class="result-en">${esc(r.en)}</div>
          ${r.hi ? `<div class="result-hi">${esc(r.hi)}</div>` : ''}
          <div class="result-path">${esc(r.path)}</div>
          <div class="result-chk">${sel ? '✓' : ''}</div>
        </div>`;
      }).join('') + `<div style="margin-top:10px;">
        <button class="btn-outline" id="selectAllBtn">Select all (${rubrics.length})</button>
      </div>`;
    }

    const anySelected = wSelected.size > 0;
    foot.innerHTML = `<button class="btn-skip" id="startOverBtn">Start over</button>
      <button class="btn-next" ${!anySelected?'disabled':''} id="doneBtn">
        Add ${wSelected.size || ''} rubric(s) ✓
      </button>`;
    return;
  }

  // ── Step 7: Done ──
  if (step === 7) {
    head.innerHTML = '';
    const rubrics = [...wSelected].map(p => ALL_RUBRICS.find(r => r.path === p)).filter(Boolean);
    const payload = rubrics.map(r => ({path:r.path, en:r.en, hi:r.hi||'', chapterId:r.chapterId}));
    area.innerHTML = `<div class="center-wrap">
      <div class="big-icon">✅</div>
      <div class="big-title">${rubrics.length} rubric(s) ready</div>
      <div style="font-size:13px;color:var(--ink2);margin-top:6px;">${rubrics.length} रूब्रिक्स तैयार हैं</div>
      <div class="big-sub" style="margin-top:14px;">All from Kent's Repertory · all have remedies.<br>Firebase submission wires here when integrated.</div>
      <div style="background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:16px;text-align:left;font-size:11px;color:var(--ink3);font-family:monospace;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto;">${JSON.stringify(payload,null,2)}</div>
      <button class="btn-primary" id="startOverBtn" style="margin-top:16px;">Start over / फिर से शुरू</button>
    </div>`;
    foot.innerHTML = '';
  }
}

// ─────────────────────────────────────────────
// EVENT HANDLING
// ─────────────────────────────────────────────
function advance() {
  if (step === 5) {
    wResults = assembleRubrics();
    wSelected = new Set(wResults.map(r => r.path)); // pre-select all
    step = 6;
  } else {
    step = Math.min(step + 1, 7);
  }
  render();
}
function goBack() {
  if (step > 1) { step--; render(); }
}

document.addEventListener('click', e => {
  // Chapter cards
  const ch = e.target.closest('[data-ch]');
  if (ch) {
    const id = ch.dataset.ch;
    const idx = wChapters.indexOf(id);
    if (idx === -1) wChapters.push(id); else wChapters.splice(idx, 1);
    render(); return;
  }
  // Sub-location chips
  const loc = e.target.closest('[data-loc]');
  if (loc) {
    const k = loc.dataset.loc;
    wSubLoc = k === '__none__' ? null : {kent: k, label: locLabel(k)};
    // Auto-advance after selection
    setTimeout(advance, 200);
    render(); return;
  }
  // Pain type cards
  const type = e.target.closest('[data-type]');
  if (type) {
    const k = type.dataset.type;
    const pt = PAIN_TYPES.find(p => p.kent === k);
    wPainType = wPainType && wPainType.kent === k ? null : pt;
    render(); return;
  }
  // Timing chips
  const timing = e.target.closest('[data-timing]');
  if (timing) {
    const k = timing.dataset.timing;
    wTiming = k === '__none__' ? null : (wTiming === k ? null : k);
    render(); return;
  }
  // Better/Worse chips
  const better = e.target.closest('[data-better]');
  if (better) {
    const k = better.dataset.better;
    const i = wBetter.indexOf(k);
    if (i === -1) wBetter.push(k); else wBetter.splice(i, 1);
    render(); return;
  }
  const worse = e.target.closest('[data-worse]');
  if (worse) {
    const k = worse.dataset.worse;
    const i = wWorse.indexOf(k);
    if (i === -1) wWorse.push(k); else wWorse.splice(i, 1);
    render(); return;
  }
  // Result card toggle
  const rpath = e.target.closest('[data-rpath]');
  if (rpath && !e.target.closest('.result-chk') && e.target.tagName !== 'BUTTON') {
    const p = rpath.dataset.rpath;
    if (wSelected.has(p)) wSelected.delete(p); else wSelected.add(p);
    render(); return;
  }
  // Select all button
  if (e.target.id === 'selectAllBtn') {
    wResults.forEach(r => wSelected.add(r.path)); render(); return;
  }
  // Navigation buttons
  if (e.target.id === 'nextBtn' && !e.target.disabled) { advance(); return; }
  if (e.target.id === 'skipBtn') { advance(); return; }
  if (e.target.id === 'backBtn' || e.target.id === 'backBtn2') { goBack(); return; }
  if (e.target.id === 'doneBtn') { step = 7; render(); return; }
  if (e.target.id === 'startOverBtn') {
    wChapters = []; wSubLoc = null; wPainType = null; wTiming = null;
    wBetter = []; wWorse = []; wResults = []; wSelected = new Set();
    step = 1; render(); return;
  }
});

loadData();
</script>

</html>
