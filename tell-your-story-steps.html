<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tell us your problem — Punarvasu Clinic</title>
<meta name="robots" content="noindex">
<!-- STORY-STEPS: the step-by-step version of the "Tell your story" form. One question at a time, in English, Hindi or Gujarati (&lang=en|hi|gu).
     It sends the same kind of record as tell-your-story.html (a plain "story" text), so the Case Analyzer reads it the same way.
     &test=1 turns on test mode: nothing is sent, and the thank-you screen shows the text that would have been sent. -->
<style>
:root{--blue:#2055a4;--navy:#163d7a;--cream:#faf6ee;--ink:#1d2b2a;--mut:#566066;--soft:#4a5554;--line:#d9d4c7;--field:#bdb7a8;--warn:#a1431a;--ok:#1d7a4a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans Gujarati",sans-serif;overflow-wrap:break-word;overflow-wrap:anywhere}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(32,85,164,.45);outline-offset:2px}

/* the blue-and-gold header used on every Punarvasu page */
.hd{padding:14px 16px;background:linear-gradient(135deg,#1C2E50 0%,#2055A4 100%);box-shadow:inset 0 -3px 0 #C8962E;color:#fff}
.hd b{display:block;font-size:18px;line-height:1.3;letter-spacing:.2px}
.hd span{display:block;font-size:12.5px;line-height:1.35;opacity:.9}
.tb{padding:7px 16px;background:#fff8e6;border-bottom:1px solid #ecd9a0;color:#5b4a14;font-size:13.5px;line-height:1.4;text-align:center}

/* progress: six parts, the part you are in fills with gold */
.prog{max-width:640px;margin:0 auto;padding:14px 16px 0}
.segs{display:flex}
.seg{position:relative;flex:1;height:6px;border-radius:3px;background:#e2dbc9;overflow:hidden}
.seg+.seg{margin-left:5px}
.seg.done{background:#163d7a}
.seg i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#C8962E}
.plab{display:flex;justify-content:space-between;align-items:baseline;min-height:21px;margin-top:8px;font-size:13px;color:var(--mut)}
.plab b{font-size:14px;color:var(--navy)}

.view{max-width:640px;margin:0 auto;padding:12px 16px 170px;outline:none}
.q{margin:6px 0 6px;font-size:24px;line-height:1.3;font-weight:700;color:var(--navy);outline:none}
@supports (text-wrap:balance){.q{text-wrap:balance}}
.q.big{margin-top:22px;font-size:30px;line-height:1.25}
.help{margin:0 0 14px;font-size:15px;line-height:1.5;color:var(--soft)}
.lab{display:block;margin:14px 0 6px;font-size:14px;font-weight:600;color:var(--navy)}
.lab small{font-size:13px;font-weight:400;color:var(--mut)}
.in,.ta{display:block;width:100%;padding:11px 12px;border:1.5px solid var(--field);border-radius:10px;background:#fff;font-size:16px;line-height:1.5;color:var(--ink)}
.ta{min-height:128px;max-height:380px;resize:none;overflow-y:auto}
.ta.sm{min-height:84px}
.in:focus,.ta:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(32,85,164,.15)}
.in.bad,.ta.bad{border-color:var(--warn);box-shadow:0 0 0 3px rgba(161,67,26,.12)}
::placeholder{color:#656d76;opacity:1}
.pair{display:flex}
.pair>div{flex:1;min-width:0}
.pair>div+div{margin-left:10px}
.card{margin:0 0 12px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:14px}
.tips{margin:0;padding:0;list-style:none}
.tips li{display:flex;align-items:flex-start;margin:0 0 12px;font-size:16px;line-height:1.5}
.tips li:last-child{margin-bottom:0}
.tips svg{flex:none;margin:2px 12px 0 0;color:var(--blue)}
.notyou{display:inline-block;margin:0 0 8px;padding:8px 0;min-height:40px;border:0;background:none;font-size:15px;color:var(--blue);text-decoration:underline}
.mini{margin:0;font-size:13px;line-height:1.4;color:var(--mut)}
.hint{margin:10px 0 0;font-size:13px;line-height:1.45;color:var(--mut)}
.hint.tip{padding:7px 10px;background:#fff8e6;border:1px solid #ecd9a0;border-radius:8px;color:#5b4a14}

/* speaking */
.tools{display:flex;align-items:center;flex-wrap:wrap;margin:8px -10px 0 0}
.tools>*{margin-right:10px}
.mic{display:inline-flex;align-items:center;min-height:44px;padding:4px 16px 4px 12px;border:1.5px solid var(--blue);border-radius:22px;background:#fff;font-size:15px;font-weight:600;color:var(--navy)}
.mic svg{flex:none;margin-right:8px;color:var(--blue)}
.mic.on{background:#c0392b;border-color:#c0392b;color:#fff;animation:pulse 1.2s infinite}
.mic.on svg{color:#fff}
@keyframes pulse{50%{opacity:.75}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.langs{display:flex;flex-wrap:wrap;align-items:center;margin:0 -6px 6px 0}
.langs>*{margin:0 6px 6px 0}
.langs span{margin:0 8px 6px 0;font-size:13px;color:var(--mut)}
@media (max-width:399px){.langs span{flex:0 0 100%;margin:0 0 6px}}
.langs button{min-height:40px;padding:6px 13px;border:1.5px solid var(--field);border-radius:999px;background:#fff;font-size:14px;font-weight:600;color:var(--ink)}
.langs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.langs.after{margin:10px -6px -6px 0}

/* other problems */
.pbox{margin:0 0 12px;padding:12px 14px 14px;background:#fff;border:1px solid var(--line);border-radius:14px}
.pbox .ph{display:flex;align-items:center;justify-content:space-between;min-height:32px;margin-bottom:6px;font-size:14px;font-weight:600;color:var(--navy)}
.rm{display:inline-flex;align-items:center;min-height:40px;margin:-4px 0;padding:2px 4px;border:0;background:none;font-size:14px;font-weight:600;color:var(--mut)}
.add{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;padding:6px 8px;border:1.5px dashed var(--blue);border-radius:12px;background:#fff;font-size:16px;font-weight:600;color:var(--navy)}

/* the answers to tap */
.opts{margin:0}
.opts.two{display:grid;grid-template-columns:1fr 1fr;grid-template-columns:repeat(2,minmax(0,1fr));grid-gap:10px;gap:10px}
.opts.two.one{grid-template-columns:1fr;grid-template-columns:minmax(0,1fr)}   /* one answer per line: set by the page when two to a line would not fit (large text) */
.opt{display:flex;align-items:center;width:100%;min-height:56px;margin:0 0 10px;padding:10px 14px;background:#fff;border:1.5px solid #cfc7b6;border-radius:12px;font-size:17px;line-height:1.3;text-align:left;color:var(--ink)}
.opts.two .opt{margin:0;padding:10px 12px;font-size:16px}
.opt span:last-child{min-width:0;overflow-wrap:break-word;overflow-wrap:anywhere}
.opts.two:not(.one) .opt span:last-child{overflow-wrap:normal}   /* in two columns a word is never cut: if one does not fit, the page switches to one column */
@supports (text-wrap:balance){.opt span:last-child{text-wrap:balance}}
.mk{flex:none;display:flex;align-items:center;justify-content:center;margin-right:12px;width:24px;height:24px;border:2px solid #7d838c;border-radius:50%;background:#fff}
.mk.sq{border-radius:6px}
.mk i{display:block;width:10px;height:10px;border-radius:50%;background:#fff}
.mk svg{color:#fff}
.add svg,.more svg,.chg svg{color:var(--blue)}
.rm svg,.cell svg{color:var(--mut)}
.add svg,.more svg{margin-right:8px}
.chg svg{margin-right:5px}
.rm svg{margin-right:4px}
.opt.on{background:#eef2fa;border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);font-weight:600;color:var(--navy)}
.opt.on .mk{border-color:var(--blue);background:var(--blue)}
.more{display:flex;align-items:center;min-height:48px;margin-top:2px;padding:4px;border:0;background:none;font-size:16px;font-weight:600;color:var(--blue)}
@media (max-width:340px){.opts.two{grid-template-columns:1fr;grid-template-columns:minmax(0,1fr)}}

/* check your answers */
.rv{margin:0 0 8px;padding:6px 14px 10px;background:#fff;border:1px solid var(--line);border-radius:14px}
.rh{display:flex;align-items:center;justify-content:space-between;min-height:30px}
.rh b{font-size:15px;line-height:1.3;color:var(--navy)}
.chg{display:inline-flex;align-items:center;min-height:44px;margin:-7px 0;padding:2px 2px 2px 6px;border:0;background:none;font-size:14px;font-weight:600;color:var(--blue)}
.rv p{margin:2px 0 0;font-size:15px;line-height:1.4;overflow-wrap:break-word}
.rv p.mu{font-size:14px;color:var(--soft)}
.rv p.mu b{font-weight:600;color:var(--mut)}
.gr{display:grid;grid-template-columns:1fr 1fr;grid-gap:2px 12px;gap:2px 12px;margin-top:4px}
.cell{display:block;min-width:0;min-height:40px;margin:0;padding:8px 0;border:0;background:none;font-size:14px;line-height:1.35;text-align:left;color:var(--ink);overflow-wrap:break-word}
.cell b{font-weight:600;color:var(--mut)}
.cell svg{vertical-align:-1px}
.sk{color:var(--mut);font-style:italic}
html[lang=hi] .sk,html[lang=gu] .sk{font-style:normal}

/* resume and thank-you screens */
.at{margin:2px 0 0;font-size:19px;line-height:1.35;font-weight:700;color:var(--navy)}
.meter{display:flex;margin-top:12px}
.meter i{flex:1;height:6px;border-radius:3px;background:#e2dbc9}
.meter i+i{margin-left:4px}
.meter i.on{background:var(--navy)}
.stack{display:flex;flex-direction:column;margin-top:20px}
.stack>*+*{margin-top:12px}
.ty{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:56px;padding-top:12vh}
.ring{display:flex;align-items:center;justify-content:center;width:92px;height:92px;border:3px solid #C8962E;border-radius:50%;background:#fff}
.ty .help{margin:0 8px 18px;font-size:17px}
.prev{width:100%;margin-top:26px;text-align:left}
.prev pre{margin:8px 0 0;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:10px;font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}

/* the bar at the bottom */
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px 18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.06)}
.barin{max-width:640px;margin:0 auto}
.err{margin:0 0 8px;font-size:14px;line-height:1.4;color:var(--warn)}
.err:empty{display:none}
.err.note{color:var(--mut)}
.btns{display:flex}
.btns>*+*{margin-left:10px}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border:0;border-radius:12px;padding:8px 16px;font-size:17px;font-weight:700;line-height:1.2}
.btn.go{background:var(--blue);color:#fff}
.btn.alt{background:#fff;border:1.5px solid var(--blue);color:var(--navy)}
.btn.main{flex:1;min-width:0}
.btn.back{flex:none;width:112px}
.btn.back.wide{width:auto;min-width:112px;max-width:55%}
.btn:disabled{opacity:.55}
.stack .btn{width:100%}
</style>
</head>
<body>
<header class="hd"><b id="brand">Punarvasu Clinic</b><span id="doctor">Dr. Yogeshwar Tiwari (BHMS)</span></header>
<div class="tb" id="tb" hidden></div>
<div class="prog" id="prog" hidden></div>
<main class="view" id="view" tabindex="-1">
  <noscript><p class="help">Please turn on JavaScript to use this page. · कृपया इस पेज के लिए JavaScript चालू कीजिए। · કૃપા કરી આ પેજ માટે JavaScript ચાલુ કરો.</p></noscript>
</main>
<div class="bar" id="bar" hidden><div class="barin"><div class="err" id="err" role="alert"></div><div class="btns" id="btns"></div></div></div>

<script>
(function () {
'use strict';
// ============================================================ the link
// ?uid=...   the patient's own id (the clinic puts it in the link)         ?lang=en|hi|gu   the language Dr. Tiwari chose for this patient

var P = new URLSearchParams(location.search);
var urlLang = (P.get('lang') || '').trim().toLowerCase();
if (urlLang !== 'en' && urlLang !== 'hi' && urlLang !== 'gu') urlLang = '';
var uid = (P.get('uid') || '').trim();
var testMode = P.get('test') === '1';
var LI = { en: 0, hi: 1, gu: 2 };
var SPEAK = { en: 'en-IN', hi: 'hi-IN', gu: 'gu-IN' };
var L = urlLang || 'en';

// ============================================================ the words on the screen: [English, Hindi, Gujarati]
var T = {
  pageTitle: ['Tell us your problem — Punarvasu Clinic', 'अपनी तकलीफ़ बताइए — पुनर्वसु क्लिनिक', 'તમારી તકલીફ જણાવો — પુનર્વસુ ક્લિનિક'],

  wait: ['One moment…', 'एक क्षण…', 'એક ક્ષણ…'],
  // the six parts of the form
  sYou: ['You', 'आप', 'તમે'],
  sMain: ['Main problem', 'मुख्य तकलीफ़', 'મુખ્ય તકલીફ'],
  sOthers: ['Other problems', 'दूसरी तकलीफ़ें', 'બીજી તકલીફો'],

  back: ['Back', 'पीछे', 'પાછળ'],

  send: ['Send to Dr. Tiwari', 'डॉ. तिवारी को भेजें', 'ડૉ. તિવારીને મોકલો'],
  change: ['Change', 'बदलिए', 'બદલો'],
  remove: ['Remove', 'हटाएँ', 'કાઢો'],

  addOwn: ['Add your own words', 'अपने शब्द जोड़ें', 'તમારા શબ્દો ઉમેરો'],

  // 1 - You

  lAge: ['Age', 'उम्र', 'ઉંમર'],
  lSex: ['Sex', 'लिंग', 'જાતિ'],

  male: ['Male', 'पुरुष', 'પુરુષ'],
  female: ['Female', 'महिला', 'સ્ત્રી'],
  other: ['Other', 'अन्य', 'અન્ય'],
  sexWhy: ['This helps us ask the right questions.', 'इससे हम सही सवाल पूछ पाते हैं।', 'તેનાથી અમે યોગ્ય સવાલો પૂછી શકીએ છીએ.'],
  unlinkedMini: ['About 10 minutes. You can speak instead of typing, and skip any question you prefer not to answer.', 'लगभग 10 मिनट। आप टाइप करने की जगह बोल सकते हैं, और जिस सवाल का जवाब न देना चाहें उसे छोड़ सकते हैं।', 'લગભગ 10 મિનિટ. તમે ટાઇપ કરવાને બદલે બોલી શકો છો, અને જે સવાલનો જવાબ ન આપવો હોય તે છોડી શકો છો.'],
  // opening the link again
  wbTitle: ['Welcome back', 'वापस स्वागत है', 'ફરી સ્વાગત છે'],
  wbHelp: ['Your earlier answers are saved on this phone.', 'आपके पहले के जवाब इसी फ़ोन में सुरक्षित हैं।', 'તમારા પહેલાંના જવાબ આ ફોનમાં સાચવેલા છે.'],
  wbStopped: ['You stopped at', 'आप यहाँ रुके थे', 'તમે અહીં અટક્યા હતા'],
  wbQ: ['{i} of {n} questions', '{n} में से {i} सवाल', '{n} માંથી {i} સવાલ'],

    return h1(esc(title)) + '<p class="help">' + t('genOwn') + '</p>' + '<label class="lab" for="fOwn">' + esc(pk(q.own || T.ownLabel)) + ' <small>' + t('optional') + '</small></label>'
      + '<textarea class="ta" id="fOwn">' + esc(a.own) + '</textarea><div class="tools">' + micBtn('fOwn') + '</div>';
  }
  var h = h1(esc(title)) + '<p class="help">' + t(q.multi ? 'genMany' : 'genOne') + '</p>';
  h += '<div class="opts' + (q.multi ? ' two' : '') + '" role="' + (q.multi ? 'group' : 'radiogroup') + '" aria-label="' + esc(title) + '">';
  q.opts.forEach(function (o, i) {

  return h + '<button type="button" class="more" id="moreBtn" data-act="more">' + svg(20, 2.2, P_PLUS) + t('addOwn') + '</button><div id="ownBox" hidden>' + own + '</div>';
}

// the short form of an answer, for the check screen

    + (since ? '<p class="mu"><b>' + t('lSince') + '</b> ' + esc(since) + '</p>' : '')

  h += rvGroup('others', others.length ? '<p>' + others.join('<br>') + '</p>' : '<p class="mu">' + t('nothingAdded') + '</p>');
  var cells = ''; generalList().forEach(function (id) { cells += cellHtml(Qby[id.slice(2)]); });
  h += rvGroup('general', '<div class="gr">' + cells + '</div>');

function viewHtml(step) {
  if (step === 'resume') return resumeHtml();
  if (step === 'you') return youHtml();
  if (step === 'main') return mainHtml();
  if (step === 'others') return othersHtml();
  if (step === 'extra') return extraHtml();
  if (step === 'review') return reviewHtml();
  return generalHtml(Qby[step.slice(2)]);
}

function drawProg(step) {
  var g = groupOf(step), gi = GROUPS.indexOf(g), frac = 0.4, sub = '';
  if (g === 'general' || (g === 'main' && step !== 'main')) { var gl = groupSteps(g), i = gl.indexOf(step) + 1; frac = i / gl.length; sub = t('ofN', { i: i, n: gl.length }); }
  else if (g === 'review') frac = 0.6;
  var h = '<div class="segs">';
  for (var k = 0; k < GROUPS.length; k++) h += k < gi ? '<span class="seg done"></span>' : (k === gi ? '<span class="seg"><i style="width:' + Math.round(frac * 100) + '%"></i></span>' : '<span class="seg"></span>');
  $('prog').innerHTML = h + '</div><div class="plab"><b>' + t(GLAB[g]) + '</b><span>' + sub + '</span></div>';
  $('prog').hidden = false;
}
function anyOther() {
  if (cur === 'others' && $('plist')) { var any = false; each('#plist textarea', function (ta) { if (clean(ta.value)) any = true; }); return any; }
  for (var i = 0; i < S.others.length; i++) if (clean(S.others[i])) return true;
  return false;
}
// what the big button on the right says and looks like
function primaryLook(step) {

  if (step === 'you') return ['start', 'go'];

  if (step === 'others') return [anyOther() ? 'next' : 'noElse', 'go'];

  return answered(step.slice(2)) ? ['next', 'go'] : ['skip', 'alt'];
}
function drawBar(step) {
  var bar = $('bar');

  bar.hidden = false;
  var h = '';

  else if (step !== 'you') h += '<button type="button" class="btn alt back" data-act="back">' + t('back') + '</button>';

}
function refreshControls() {
  var p = $('primary');
  if (p && !sending) { var look = primaryLook(cur); p.textContent = t(look[0]); p.className = 'btn main ' + look[1]; }
  if (cur === 'others' && $('plist')) {
    var boxes = $('plist').children, n = boxes.length;
    for (var i = 0; i < n; i++) boxes[i].querySelector('.rm').hidden = (n === 1 && !clean(boxes[i].querySelector('textarea').value));

function render(step) {

  drawBar(step);
  fitOpts();
  setMsg('');
  each('.ta', grow);
  refreshControls();
  try { window.scrollTo(0, 0); } catch (e) {}
  var head = $('h1'); if (head) { try { head.focus({ preventScroll: true }); } catch (e1) { try { head.focus(); } catch (e2) {} } }
}
function renderDone(preview) {
  cur = 'done'; sent = true; setMsg('');
  $('prog').hidden = true; $('bar').hidden = true;
  var h = '<div class="ty"><div class="ring" style="color:#163d7a">' + svg(46, 2.6, P_TICK) + '</div>' + h1(t('thanks'), true)
    + '<p class="help">' + t('doneMsg') + '</p><p class="mini">' + t('closePage') + '</p>';
  if (testMode) h += '<div class="prev"><p class="mini"><b>Test mode: nothing was sent.</b> This is the text Dr. Tiwari would have received:</p><pre id="testOut">' + esc(preview || '') + '</pre>'
    + '<p style="margin-top:14px"><button type="button" class="btn alt" style="width:100%" data-act="newtest">Start a new test</button></p></div>';
  $('view').innerHTML = h + '</div>';
  try { window.scrollTo(0, 0); } catch (e) {}
  var hd = $('h1'); if (hd) { try { hd.focus({ preventScroll: true }); } catch (e1) { try { hd.focus(); } catch (e2) {} } }

// ============================================================ moving between screens (the phone's Back button works too)
function leave(fn, retry) {   // stop the microphone (late words still land), keep what is on the screen, then go on
  if (navBusy) { if (retry) setTimeout(function () { leave(fn, retry); }, 60); return; }
  navBusy = true; stopMic();
  settleMic().then(function () { navBusy = false; collect(); draftNow(); fn(); });
}
function startAt(step) { nav = [step]; navAt = 0; try { history.replaceState({ d: 0 }, ''); } catch (e) {} render(step); }
function go(step) {
  leave(function () {
    lastNav = Date.now();
    nav = nav.slice(0, navAt + 1); nav.push(step); navAt = nav.length - 1;
    try { history.pushState({ d: navAt }, ''); } catch (e) {}
    render(step);
  });
}
function backOne() {
  if (navAt > 0) { try { lastNav = Date.now(); history.back(); return; } catch (e) {} }
  var a = stepsList(), i = a.indexOf(cur);
  if (i > 0) leave(function () { lastNav = Date.now(); startAt(a[i - 1]); });
}
function backToCheck() {
  var j = -1;
  for (var i = navAt - 1; i >= 0; i--) if (nav[i] === 'review') { j = i; break; }
  if (j >= 0) { try { lastNav = Date.now(); history.go(j - navAt); return; } catch (e) {} }
  go('review');
}
window.addEventListener('popstate', function (e) {
  if (!booted) return;
  if (sent) {   // once it is sent the form never comes back
    nav = ['done']; navAt = 0; try { history.replaceState({ d: 0 }, ''); } catch (x) {}
    if (cur !== 'done') renderDone('');
    return;
  }
  var d = (e.state && typeof e.state.d === 'number') ? e.state.d : 0;
  if (d > nav.length - 1) d = nav.length - 1;
  if (d < 0) d = 0;
  leave(function () { lastNav = Date.now(); navAt = d; render(nav[d]); }, true);
});
function startEdit(group, step, single) { edit = { group: group, single: !!single }; go(step); }
function onPrimary() {
  collect();
  var bad = validate(cur); if (bad) { showError(bad); return; }
  setMsg('');
  if (cur === 'review') { send(); return; }
  if (edit && (edit.single || isLastOfGroup(cur))) { edit = null; backToCheck(); return; }
  var a = stepsList(); go(a[a.indexOf(cur) + 1]);
}

// ============================================================ sending
function patientNow() {
  if (known) return { uid: known.uid, name: known.name, phone: known.phone || '', age: known.age || '', sex: effSex() || '' };
  return { uid: uid || '', name: clean(S.name), phone: S.phone.replace(/[^\d+]/g, ''), age: S.age || '', sex: S.sex || '' };   // a link that carries the patient's id still files it under that patient
}
function afterSent(preview) {
  clearDraft(); renderDone(preview);
  var k = navAt; nav = ['done']; navAt = 0;
  try { if (k > 0) history.go(-k); else history.replaceState({ d: 0 }, ''); } catch (e) {}
}
function send() {
  if (sending || sent) return;
  collect();
  var bad = validate('you') || validate('main'); if (bad) { setMsg(bad[1]); return; }
  var patient = patientNow(), b = buildStory();
  var payload = { patient: patient, submittedAt: new Date().toISOString(), story: b.story, storyParts: { complaints: b.complaints, general: b.general }, storyEntry: true, storyLang: micLang };
  if (!patient.uid) payload.unlinked = true;
  if (testMode) { afterSent(b.story); return; }
  sending = true; setMsg('');
  var btn = $('primary'); if (btn) { btn.disabled = true; btn.textContent = '…'; }
  slowTimer = setTimeout(function () { if (sending) setMsg(t('slowSend'), 'note'); }, 12000);
  var p;
  try { p = W.sender ? W.sender(payload) : Promise.reject(new Error('the sender is not ready')); } catch (e) { p = Promise.reject(e); }
  p.then(function () { clearTimeout(slowTimer); sending = false; afterSent(''); },
    function (err) {
      clearTimeout(slowTimer); sending = false;
      try { console.error('[story] submit failed:', err); } catch (e2) {}
      if (btn) btn.disabled = false;
      refreshControls(); setMsg(t('sendFail'));
    });
}

// ============================================================ what the patient does on a screen
function doPick(qid, i) {
  var q = Qby[qid], a = ga(qid), v = q.opts[i].v;
  if (q.multi) { var k = a.v.indexOf(v); if (k >= 0) a.v.splice(k, 1); else a.v.push(v); }
  else a.v = (a.v === v) ? '' : v;
  each('.opt[data-q="' + qid + '"]', function (el) {
    var j = +el.getAttribute('data-i'), x = q.opts[j].v, on = q.multi ? a.v.indexOf(x) >= 0 : a.v === x;
    el.className = 'opt' + (on ? ' on' : ''); el.setAttribute('aria-checked', on ? 'true' : 'false');
    el.firstChild.innerHTML = mkInner(q.multi, on);
  });
  refreshControls(); draftSoon();
}
function renumber() {
  var boxes = $('plist').children;
  for (var i = 0; i < boxes.length; i++) {
    var label = t('problemN', { n: i + 1 }), ta = boxes[i].querySelector('textarea');
    boxes[i].querySelector('.pn').textContent = label; ta.setAttribute('aria-label', label); ta.setAttribute('placeholder', t(i === 0 ? 'othersPh1' : 'othersPhN'));
  }
}
function addProblem() {
  var list = $('plist'); if (list.children.length >= 8) return;
  var d = document.createElement('div'); d.innerHTML = pbox('', list.children.length);
  var box = d.firstChild; list.appendChild(box);
  refreshControls();
  var ta = box.querySelector('textarea');
  try { ta.focus(); } catch (e) {}
  try { box.scrollIntoView({ block: 'center' }); } catch (e2) {}
}
function removeProblem(btn) {
  stopMic();
  var box = closest(btn, '.pbox'), list = $('plist');
  if (list.children.length > 1) { list.removeChild(box); renumber(); }
  else { var ta = box.querySelector('textarea'); ta.value = ''; grow(ta); }
  collect(); refreshControls(); draftSoon();
}
function onInput(e) {
  var el = e.target;
  if (matches(el, '.bad')) { el.className = el.className.replace(/\s*\bbad\b/, ''); if (!noteOn) setMsg(''); }
  if (el.tagName === 'TEXTAREA') grow(el);
  collect(); refreshControls(); draftSoon();
}
function textChanged(ta) { grow(ta); collect(); refreshControls(); draftSoon(); }
function applyLang() {
  document.documentElement.lang = L; document.title = t('pageTitle');
  $('brand').textContent = t('brand'); $('doctor').textContent = t('doctor');
  if (!micTouched) micLang = SPEAK[L];
}
function onClick(e) {
  var b = closest(e.target, '[data-act]'); if (!b || !booted) return;
  var act = b.getAttribute('data-act');
  if ((act === 'primary' || act === 'back' || act === 'tocheck') && (navBusy || Date.now() - lastNav < 280)) return;   // a double tap must not skip a screen
  if (act === 'pick') doPick(b.getAttribute('data-q'), +b.getAttribute('data-i'));
  else if (act === 'more') { b.hidden = true; $('ownBox').hidden = false; var ta = $('fOwn'); grow(ta); try { ta.focus(); } catch (x) {} }
  else if (act === 'mic') micToggle(b.getAttribute('data-for'));
  else if (act === 'speaklang') setMicLang(b.getAttribute('data-l'));
  else if (act === 'addprob') addProblem();
  else if (act === 'rmprob') removeProblem(b);
  else if (act === 'notyou') leave(function () { known = null; render('you'); });
  else if (act === 'lang') { var l2 = b.getAttribute('data-l'); leave(function () { L = l2; applyLang(); render(cur); draftNow(); }); }
  else if (act === 'change') { var g = b.getAttribute('data-g'); startEdit(g, firstOfGroup(g), false); }
  else if (act === 'cell') startEdit('general', b.getAttribute('data-s'), true);
  else if (act === 'resume') { var st = pending.step; pending = null; lastNav = Date.now(); startAt(st); }
  else if (act === 'again') {
    clearDraft(); var keep = S; S = freshState(); S.name = keep.name; S.phone = keep.phone; S.age = keep.age; S.sex = keep.sex;
    pending = null; lastNav = Date.now(); startAt('you');
  }
  else if (act === 'primary') onPrimary();
  else if (act === 'back') backOne();
  else if (act === 'tocheck') { collect(); var bad = validate(cur); if (bad) { showError(bad); return; } edit = null; backToCheck(); }
  else if (act === 'newtest') { clearDraft(); location.reload(); }
}

// ============================================================ speaking: the phone turns the voice into text right in the box; nothing is recorded or stored
// (this is the same voice code as the live form: the box text is rebuilt from the whole list of results each time, never added to)
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var micLang = SPEAK[L], micTouched = false, rec = null, recFor = null, wantOn = false, winding = null;
// On Android phones the half-finished guesses are not asked for at all: the words then appear after each pause, as the phone's final version.
// Adding &live=on or &live=off to the page address chooses the other way.
var liveParam = (P.get('live') || '').toLowerCase();
var liveText = liveParam === 'on' ? true : liveParam === 'off' ? false : !/android/i.test(navigator.userAgent);
var HEARD_SKIP = ' .,;:!?\'"()[]{}-' + String.fromCharCode(0x2013, 0x2014, 0x2018, 0x2019, 0x201c, 0x201d, 0x2026, 0x964, 0x965, 0x200b, 0x200c, 0x200d, 0xfeff);
function heardKey(w) { w = w.toLowerCase(); var a = 0, b = w.length; while (a < b && HEARD_SKIP.indexOf(w.charAt(a)) !== -1) a++; while (b > a && HEARD_SKIP.indexOf(w.charAt(b - 1)) !== -1) b--; return w.slice(a, b); }
function heardStarts(a, b) { if (b.length > a.length) return false; for (var i = 0; i < b.length; i++) if (a[i] !== b[i]) return false; return true; }
function mergeHeard(list) {
  var out = [], total = 0;
  for (var n = 0; n < list.length; n++) {
    var w = String(list[n] || '').split(/\s+/).filter(Boolean); if (!w.length) continue;
    var k = w.map(function (x) { return heardKey(x); }), last = out[out.length - 1];
    if (last && heardStarts(k, last.k)) { total += k.length - last.k.length; out[out.length - 1] = { w: w, k: k }; continue; }   // goes on from the one before, or repeats it: keep the longer
    if (last && heardStarts(last.k, k)) continue;   // only the beginning of the one before: nothing new
    if (out.length > 1 && k.length >= total && heardStarts(k, [].concat.apply([], out.map(function (g) { return g.k; })))) { out.length = 0; total = 0; }   // says everything so far again, and more
    out.push({ w: w, k: k }); total += k.length;
  }
  return out.map(function (g) { return g.w.join(' '); }).join(' ');
}
function retireMic(r) { if (!r) return; r.onresult = r.onerror = r.onend = null; try { r.abort(); } catch (e) {} }
function settleMic() {   // the last words may still be on their way
  return new Promise(function (resolve) {
    var n = 0;
    (function wait() { if (winding && !winding._done && n++ < 20) setTimeout(wait, 75); else resolve(); })();
  });
}
function resetMicButtons() { each('.mic.on', function (b) { b.className = 'mic'; b.innerHTML = micInner(false); }); }
function stopMic() {
  wantOn = false;
  if (rec && !rec._done) { if (winding) retireMic(winding); winding = rec; try { rec.stop(); } catch (e) {} }
  rec = null; resetMicButtons(); recFor = null;
  if (noteOn) setMsg('');
}
function startMic(id) {
  if (!SR) return;
  var ta = $(id); if (!ta) return;
  var btn = null; each('.mic', function (b) { if (b.getAttribute('data-for') === id) btn = b; });
  if (winding) { retireMic(winding); winding = null; }
  recFor = id; wantOn = true;
  function mk() {
    var r = new SR(); r.lang = micLang; r.continuous = true; r.interimResults = liveText;
    var base = ta.value ? ta.value.replace(/\s+$/, '') + ' ' : '';
    r.onresult = function (ev) {
      if (r !== rec && r !== winding) return;   // only the recogniser that is listening (or just finishing) may write
      var heard = [];
      for (var i = 0; i < ev.results.length; i++) heard.push(ev.results[i][0].transcript);   // the whole list every time, not only what is new
      if (!heard.length) return;
      ta.value = (base + mergeHeard(heard)).trim();
      textChanged(ta);
    };
    r.onerror = function (ev) { if (r !== rec) return; if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') { wantOn = false; setMsg(t('micBlocked')); } };
    r.onend = function () {
      r._done = true;
      if (r === winding) { winding = null; return; }
      if (r !== rec) return;
      if (wantOn && recFor === id) { try { rec = mk(); rec.start(); } catch (e) { stopMic(); } }
      else if (btn) { btn.className = 'mic'; btn.innerHTML = micInner(false); }
    };
    return r;
  }
  try { rec = mk(); rec.start(); if (btn) { btn.className = 'mic on'; btn.innerHTML = micInner(true); } setMsg(liveText ? t('listenLive') : t('pauseTip'), 'note'); } catch (e) { stopMic(); }
}
function micToggle(id) { if (wantOn && recFor === id) stopMic(); else { stopMic(); startMic(id); } }
function setMicLang(code) {
  micLang = code; micTouched = true;
  each('[data-act="speaklang"]', function (b) { var on = b.getAttribute('data-l') === code; b.className = on ? 'on' : ''; b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
  if (wantOn) { var id = recFor; stopMic(); startMic(id); }
}

// ============================================================ start-up (called once the patient has been looked up)
function init(k) {
  if (booted) { if (k && !known && cur === 'you' && !sent) { known = k; render('you'); } return; }
  booted = true; known = k || null;
  var d = loadDraft();
  if (d) {
    if (!urlLang && (d.lang === 'en' || d.lang === 'hi' || d.lang === 'gu')) L = d.lang;
    if (d.speak === 'en-IN' || d.speak === 'hi-IN' || d.speak === 'gu-IN') { micLang = d.speak; micTouched = d.speak !== SPEAK[L]; }
  }
  applyLang();
  if (testMode) { $('tb').textContent = 'Test mode: nothing is sent to Dr. Tiwari. The answers you type stay on this page only.'; $('tb').hidden = false; }
  if (d && hasContent(normState(d.S))) {
    S = normState(d.S); pending = { step: d.step };
    if (stepsList().indexOf(pending.step) < 0) pending.step = 'you';
    nav = ['resume']; navAt = 0; try { history.replaceState({ d: 0 }, ''); } catch (e) {}
    render('resume');
  } else {
    S = freshState();
    if (d) { var x = normState(d.S); S.name = x.name; S.phone = x.phone; S.age = x.age; S.sex = x.sex; }
    startAt('you');
  }
}

<script type="module">
// Sending and looking up the patient: the same Firebase project, the same places and the same record as tell-your-story.html
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, set, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const app = initializeApp({
  apiKey: "AIzaSyAqzKPqBzNoBJc5FWjnVXMER4prgrbhqag",
  authDomain: "punarvasu-790a8.firebaseapp.com",
  databaseURL: "https://punarvasu-790a8-default-rtdb.firebaseio.com",
  projectId: "punarvasu-790a8",
  storageBucket: "punarvasu-790a8.firebasestorage.app",
  messagingSenderId: "774115339459",
  appId: "1:774115339459:web:4ee1f45e1e25d61666c676"
}, 'patientStoryApp');
const db = getDatabase(app);
const auth = getAuth(app);
try { setPersistence(auth, browserSessionPersistence); } catch (e) {}   // signed in for this visit of the page only
const W = window.Wizard;

// STORY-LINK: a story sent from a link that does not carry the patient's id used to arrive as a case with no account ("Cases with no
// account" in the Case Analyzer, to be linked by hand). Now Send first finds the patient's own account from the phone and name - the very
// same account scheme as the intake wizard's ensurePatientAccount (patient_intake_wizard.html): phone+name first; then the one account
// phoneIndex knows on this phone; then the old phone-only accounts, only when the name matches - or opens a new one, and files the story
// under it. If none of that works (e.g. no network for sign-in), the story is still sent, unlinked, as before.
function nameKey(name) { return String(name || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '.').replace(/^\.+|\.+$/g, ''); }
async function findOrMakeAccount(name, phone) {
  const raw = String(phone || '').replace(/[^0-9]/g, ''), stripped = raw.replace(/^0+/, ''), ph = stripped.slice(-10);
  if (ph.length !== 10) return null;
  const pass = v => 'Pun@' + v.slice(-6) + 'Cl!', nk = nameKey(name);
  const tryIn = async (email, pw) => { try { return (await signInWithEmailAndPassword(auth, email, pw)).user.uid; } catch (e) { return null; } };
  let uid = nk ? await tryIn(ph + '.' + nk + '@punarvasu.clinic', pass(ph)) : null;
  if (uid) return uid;
  try {   // the only account on this phone, whatever spelling (or script) the name was typed in
    const idx = await get(ref(db, 'phoneIndex/' + ph));
    if (idx.exists()) {
      const ids = Object.keys(idx.val() || {});
      if (ids.length === 1) { const kn = nameKey(idx.val()[ids[0]]); if (kn) { uid = await tryIn(ph + '.' + kn + '@punarvasu.clinic', pass(ph)); if (uid) return uid; } }
    }
  } catch (e) { /* phoneIndex not readable - go on */ }
  if (!nk) return null;   // a name in Hindi / Gujarati letters cannot make a new account: sent unlinked, as before
  for (const v of [...new Set([raw, stripped, ph])]) {   // old phone-only accounts: the same person only when the name matches too
    uid = await tryIn(v + '@punarvasu.clinic', pass(v));
    if (uid) { try { const ex = await get(ref(db, 'patients/' + uid)); if (ex.exists() && nameKey(ex.val().name) === nk) return uid; } catch (e) {} }
  }
  const email = ph + '.' + nk + '@punarvasu.clinic';
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass(ph));
    await set(ref(db, 'patients/' + cred.user.uid), { name, phone, email, status: 'active', createdAt: Date.now() });
    try { await set(ref(db, 'phoneIndex/' + ph + '/' + cred.user.uid), name); } catch (e) {}
    return cred.user.uid;
  } catch (e) {
    if (e && e.code === 'auth/email-already-in-use') return await tryIn(email, pass(ph));
    return null;
  }
}

// the form calls this when the patient presses "Send to Dr. Tiwari" (never in test mode)
W.sender = async function (payload) {
  const patient = payload.patient;
  if (!patient.uid) {   // STORY-LINK
    let uid = null;
    try { uid = await findOrMakeAccount(patient.name, patient.phone); } catch (e) { console.error('[story] account lookup failed:', e); }
    if (uid) { patient.uid = uid; delete payload.unlinked; }
  }
  const caseKey = push(ref(db, 'cases')).key;
  await set(ref(db, 'cases/' + caseKey), payload);
  if (patient.uid) { try { await set(ref(db, 'patients/' + patient.uid + '/casefile/lastCaseSubmittedAt'), new Date(payload.submittedAt).getTime()); } catch (e) {} }
  try { await push(ref(db, 'notifications/admin'), { type: 'case_submitted', patientUid: patient.uid || '', name: patient.name, timestamp: Date.now(), viaStory: true, caseKey }); } catch (e) {}
};

// who is writing (the invite link carries the patient's own id), then the form opens
window.__ready = (async () => {
  let known = null;
  if (W.uid) {
    try {
      const snap = await get(ref(db, 'pendingIntakeContext/' + W.uid));
      if (snap.exists()) {
        const c = snap.val();
        if (c && c.name) known = { uid: W.uid, name: String(c.name), phone: c.phone != null ? String(c.phone) : '', age: c.age || '', sex: c.sex || '' };
      }
    } catch (e) { console.error('[story] context lookup failed:', e); }
  }
  W.init(known);
})();
</script>
</body>
