    body { background: var(--cream); font-family: var(--sans); min-height: 100vh; }

    .fp-brand { text-align: center; margin-bottom: 26px; }

    .fc-btn-primary{display:inline-block;width:100%;box-sizing:border-box;padding:14px 16px;border-radius:8px;background:var(--teal);color:var(--white);text-align:center;text-decoration:none;font-size:15px;margin-bottom:10px;cursor:pointer;border:none;font-family:var(--sans);}
    .fc-btn-primary:hover{background:var(--teal2);}
    .fc-btn-secondary{display:block;width:100%;box-sizing:border-box;padding:13px 16px;border-radius:8px;background:none;color:var(--ink3);text-align:center;text-decoration:none;font-size:14px;cursor:pointer;border:1px solid var(--border);font-family:var(--sans);}
    .fc-btn-secondary:hover{background:var(--cream2);}

    @media (max-width:480px){

  <div class="fp-wrap">

      <a class="fp-pdf-link" href="fee-structure.pdf" target="_blank" rel="noopener">📄 Download the full fee guide (PDF · English, हिंदी, ગુજરાતી)</a>

<script>
(function(){
  var SLIDES = [
    { en:"Most people try modern medicine first, before ever considering homeopathy.",
      hi:"ज़्यादातर लोग होम्योपैथी के बारे में सोचने से पहले, पहले आधुनिक चिकित्सा (एलोपैथी) आज़माते हैं।",
      gu:"મોટાભાગના લોકો હોમિયોપેથી વિશે વિચારતા પહેલા આધુનિક ચિકિત્સા (એલોપેથી) અજમાવે છે." },
    { en:"So if someone reaches a homeopath, it's often because modern medicine hasn't fully resolved their case yet.",
      hi:"इसलिए अगर कोई होम्योपैथिक डॉक्टर तक पहुँचता है, तो अक्सर इसलिए क्योंकि आधुनिक चिकित्सा उनके केस को पूरी तरह हल नहीं कर पाई।",
      gu:"તેથી જો કોઈ હોમિયોપેથિક ડૉક્ટર સુધી પહોંચે છે, તો ઘણી વાર એટલા માટે કારણ કે આધુનિક ચિકિત્સા તેમનો કેસ સંપૂર્ણપણે ઉકેલી શકી નથી." },
    { en:"That means the cases a homeopath actually sees are, by default, already the harder ones — not the easy ones.",
      hi:"इसका मतलब है कि होम्योपैथिक डॉक्टर के पास जो केस आते हैं, वे स्वाभाविक रूप से पहले से ही मुश्किल होते हैं — आसान नहीं।",
      gu:"એનો અર્થ એ કે હોમિયોપેથિક ડૉક્ટર પાસે જે કેસ આવે છે તે સ્વાભાવિક રીતે પહેલેથી જ મુશ્કેલ હોય છે — સરળ નહીં." },
    { en:"A case that's already complex naturally needs more time and more follow-ups to resolve properly — not a single quick fix.",
      hi:"जो केस पहले से ही जटिल है, उसे ठीक से हल करने के लिए स्वाभाविक रूप से ज़्यादा समय और ज़्यादा फॉलो-अप चाहिए — एक झटके में समाधान नहीं।",
      gu:"જે કેસ પહેલેથી જ જટિલ છે તેને યોગ્ય રીતે ઉકેલવા માટે સ્વાભાવિક રીતે વધુ સમય અને વધુ ફોલો-અપની જરૂર પડે છે — એક ઝટકે ઉકેલ નહીં." },
    { en:"At the same time, some people believe homeopathy is only suited for trivial complaints — cough, cold, minor issues — and that serious diseases should only be handled by highly qualified modern-medicine specialists.",
      hi:"साथ ही, कुछ लोग मानते हैं कि होम्योपैथी केवल छोटी-मोटी शिकायतों — जैसे खांसी, ज़ुकाम — के लिए ही उपयुक्त है, और गंभीर बीमारियों का इलाज केवल उच्च योग्यता प्राप्त आधुनिक चिकित्सा विशेषज्ञों से ही करवाना चाहिए।",
      gu:"તે જ સાથે, કેટલાક લોકો માને છે કે હોમિયોપેથી ફક્ત નાની-મોટી ફરિયાદો — જેમ કે ખાંસી, શરદી — માટે જ યોગ્ય છે, અને ગંભીર બીમારીઓની સારવાર ફક્ત ઉચ્ચ લાયકાત ધરાવતા આધુનિક ચિકિત્સા નિષ્ણાતો પાસેથી જ કરાવવી જોઈએ." },
    { en:"So it follows that a homeopath ends up seeing everything — from the most trivial complaints to the most complicated, difficult cases.",
      hi:"तो इससे यह निष्कर्ष निकलता है कि एक होम्योपैथिक डॉक्टर के पास बहुत छोटी शिकायतों से लेकर बेहद जटिल केस तक, हर तरह के मरीज़ आते हैं।",
      gu:"તો આનાથી એવું તારણ નીકળે છે કે એક હોમિયોપેથિક ડૉક્ટર પાસે ખૂબ નાની ફરિયાદોથી લઈને અત્યંત જટિલ કેસ સુધી, દરેક પ્રકારના દર્દીઓ આવે છે." },
    { en:"Given that range, it isn't realistic to expect the same time, effort, and fee for every single patient — a homeopath simply can't keep one fixed fee across every kind of case.",
      hi:"इस विविधता को देखते हुए, हर मरीज़ से एक जैसा समय, मेहनत और फीस की उम्मीद करना उचित नहीं है — एक होम्योपैथिक डॉक्टर हर तरह के केस के लिए एक ही निश्चित फीस नहीं रख सकता।",
      gu:"આ વિવિધતાને ધ્યાનમાં રાખતાં, દરેક દર્દી પાસેથી સરખો સમય, મહેનત અને ફી અપેક્ષા રાખવી વ્યાજબી નથી — એક હોમિયોપેથિક ડૉક્ટર દરેક પ્રકારના કેસ માટે એક જ નિશ્ચિત ફી રાખી શકે નહીં." },
    { en:"So it isn't fair to say the same fixed fee should apply to a patient with a trivial ailment — cough, cold, fever — and to a patient who has lost all hope from modern medicine, or is living with a long-standing, complicated, incurable disease like cancer, diabetes, Parkinson's disease, pancreatitis, kidney failure, or liver cirrhosis.",
      hi:"तो यह कहना उचित नहीं होगा कि एक ही निश्चित फीस, एक साधारण शिकायत — जैसे खांसी, ज़ुकाम, बुखार — वाले मरीज़ से भी ली जाए, और उस मरीज़ से भी जिसने आधुनिक चिकित्सा से सारी उम्मीद खो दी हो, या जो कैंसर, डायबिटीज़, पार्किंसन रोग, पैंक्रियाटाइटिस, किडनी फेलियर, या लीवर सिरोसिस जैसी लंबी, जटिल, असाध्य बीमारी से जूझ रहा हो।",
      gu:"તો એમ કહેવું વ્યાજબી નહીં હોય કે એક જ નિશ્ચિત ફી, એક સામાન્ય ફરિયાદ — જેમ કે ખાંસી, શરદી, તાવ — ધરાવતા દર્દી પાસેથી પણ લેવાય, અને એ દર્દી પાસેથી પણ જેણે આધુનિક ચિકિત્સાથી બધી આશા ગુમાવી દીધી હોય, અથવા જે કેન્સર, ડાયાબિટીસ, પાર્કિન્સન રોગ, પેન્ક્રિયાટાઇટિસ, કિડની ફેલ્યોર, અથવા લિવર સિરોસિસ જેવી લાંબી, જટિલ, અસાધ્ય બીમારીથી ઝઝૂમી રહ્યો હોય." }
  ];

  var STRINGS = {
    eyebrow:  { en:"Understanding your fee", hi:"आपकी फीस को समझना", gu:"તમારી ફી સમજવી" },
    agree:    { en:"Agree", hi:"सहमत हूं", gu:"સહમત છું" },
    notReally:{ en:"Not really", hi:"पूरी तरह नहीं", gu:"બરાબર નહીં" },
    aside:    { en:"Fair enough — not everyone's experience matches this exactly, and that's okay.",
                hi:"ठीक है — यह सबके अनुभव से बिल्कुल मेल नहीं खा सकता, और यह कोई बात नहीं।",
                gu:"ઠીક છે — આ દરેકના અનુભવ સાથે બરાબર મેળ ન પણ ખાય, અને એ કંઈ વાંધો નથી." },
    payoffTitle: { en:"That's exactly why our fees are flexible, not fixed.",
                   hi:"इसीलिए हमारी फीस लचीली (फ्लेक्सिबल) है, तय नहीं।",
                   gu:"એટલે જ અમારી ફી લવચીક (ફ્લેક્સિબલ) છે, નિશ્ચિત નથી." },
    payoffBody:  { en:"At Punarvasu, different patients are charged differently, based on what their case actually needs. Tap the link above 👆 to see the typical slabs — they're just for your reference; your actual fee is settled through honest, mutual agreement with you and your family, and there's always room to talk it through.",
                   hi:"पुनर्वसु में, अलग-अलग मरीज़ों से अलग-अलग फीस ली जाती है, उनके केस की वास्तविक ज़रूरत के अनुसार। ऊपर दिए गए लिंक पर टैप करें 👆 सामान्य स्लैब देखने के लिए — ये केवल आपकी जानकारी के लिए हैं; आपकी असली फीस आपसे और आपके परिवार से ईमानदार, आपसी सहमति से तय होती है, और इस पर बात करने की हमेशा गुंजाइश रहती है।",
                   gu:"પુનર્વસુમાં, જુદા-જુદા દર્દીઓ પાસેથી જુદી-જુદી ફી લેવામાં આવે છે, તેમના કેસની ખરેખરી જરૂરિયાત મુજબ. ઉપર આપેલી લિંક પર ટેપ કરો 👆 સામાન્ય સ્લેબ જોવા માટે — આ ફક્ત તમારી જાણકારી માટે છે; તમારી ખરેખરી ફી તમારી અને તમારા પરિવાર સાથે પ્રામાણિક, પરસ્પર સંમતિથી નક્કી થાય છે, અને આના પર વાત કરવાની હંમેશા શક્યતા રહે છે." },
    bookNow:  { en:"Book a consultation →", hi:"परामर्श बुक करें →", gu:"પરામર્શ બુક કરો →" },
    restart:  { en:"Read again", hi:"फिर से पढ़ें", gu:"ફરીથી વાંચો" }
  };

  var lang = null, step = 0;
  function t(key) { return STRINGS[key][lang]; }

  function renderLangSelect() {
    document.getElementById('fcContent').innerHTML =
      '<div class="fc-eyebrow">Punarvasu Clinic · बुक करने से पहले · બુક કરતા પહેલા</div>' +
      '<div class="fc-statement" style="font-size:18px;">Choose your language to continue</div>' +
      '<button class="fc-lang-btn" onclick="window.fcSetLang(\'en\')">English</button>' +
      '<button class="fc-lang-btn" onclick="window.fcSetLang(\'hi\')">हिंदी</button>' +
      '<button class="fc-lang-btn" onclick="window.fcSetLang(\'gu\')">ગુજરાતી</button>';
  }

  window.fcSetLang = function(l) { lang = l; step = 0; renderSlide(); };

  function renderSlide() {
    var el = document.getElementById('fcContent');
    var backBtn = '<button class="fc-back-btn" onclick="window.fcBack()">← Back</button><br/>';
    if (step < SLIDES.length) {
      var s = SLIDES[step];
      el.innerHTML =
        backBtn +
        '<div class="fc-eyebrow">' + t('eyebrow') + '</div>' +
        '<div class="fc-progress">' + (step+1) + ' / ' + (SLIDES.length+1) + '</div>' +
        '<div class="fc-statement">' + s[lang] + '</div>' +
        '<div class="fc-btn-row">' +
          '<button class="fc-btn fc-btn-agree" onclick="window.fcNext()">' + t('agree') + '</button>' +
          '<button class="fc-btn fc-btn-soft" onclick="window.fcSoftNo()">' + t('notReally') + '</button>' +
        '</div>' +
        '<div id="fcAside"></div>';
    } else {
      el.innerHTML =
        backBtn +
        '<div class="fc-eyebrow">' + t('eyebrow') + '</div>' +
        '<div class="fc-progress">' + (SLIDES.length+1) + ' / ' + (SLIDES.length+1) + '</div>' +
        '<div class="fc-payoff-title">' + t('payoffTitle') + '</div>' +
        '<div class="fc-payoff-body">' + t('payoffBody') + '</div>' +
        '<a class="fc-btn-primary" href="appointment/index.html">' + t('bookNow') + '</a>' +
        '<button class="fc-btn-secondary" onclick="window.fcRestart()">' + t('restart') + '</button>';
    }
  }

  window.fcNext = function() { step++; renderSlide(); };

  // Steps back one slide at a time; from the very first slide, returns to
  // the language picker rather than doing nothing.
  window.fcBack = function() {
    if (step === 0) { renderLangSelect(); }
    else { step--; renderSlide(); }
  };

  // "Read again" restarts from slide 1 in the SAME language already
  // chosen — this doesn't take a parameter at all, unlike the old,
  // broken call that tried to read a variable named "lang" from the
  // wrong scope (the global scope, not this function's closure, where
  // the real lang value actually lives) and got undefined instead.
  window.fcRestart = function() { step = 0; renderSlide(); };

  window.fcSoftNo = function() {
    var aside = document.getElementById('fcAside');
    if (aside) aside.innerHTML = '<div class="fc-aside">' + t('aside') + '</div>';
    setTimeout(function(){ window.fcNext(); }, 1400);
  };

  renderLangSelect();
})();
</script>
</body>
</html>
